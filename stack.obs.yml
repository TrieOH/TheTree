# =============================================================
# stack.obs.yml — Observability Stack (Docker Swarm)
#
# Deploy separately from the core stack:
#   docker stack deploy -c stack.obs.yml trieoh
# =============================================================

networks:
  internal:
    driver: overlay
    external: true

volumes:
  grafana_data:
  victoria_metrics_data:
  victoria_logs_data:
  victoria_traces_data:
  beszel_data:
  beszel_agent_data:
  beszel_socket:

services:

  # =============================================================
  # 📊 BESZEL (system monitoring)
  # =============================================================

  beszel:
    image: henrygd/beszel:latest
    environment:
      APP_URL: http://localhost:8090
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first

  beszel-agent:
    image: henrygd/beszel-agent:latest
    env_file:
      - infra/beszel/.env
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://beszel:8090
    networks:
      - internal
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first

  # =============================================================
  # 📊 VICTORIA METRICS (metrics)
  # =============================================================

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:8428
      - --promscrape.config=/etc/victoria-metrics/scrape.yml
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
      - ./infra/victoria-metrics/scrape.yml:/etc/victoria-metrics/scrape.yml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first

  # =============================================================
  # 📝 VICTORIA LOGS (logs)
  # =============================================================

  victoria-logs:
    image: victoriametrics/victoria-logs:latest
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:9428
    volumes:
      - victoria_logs_data:/victoria-logs-data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first

  # =============================================================
  # 🔍 VICTORIA TRACES (traces)
  # =============================================================

  victoria-traces:
    image: victoriametrics/victoria-traces:latest
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:10428
    volumes:
      - victoria_traces_data:/victoria-traces-data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:10428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first

  # =============================================================
  # 📝 VECTOR (log collector)
  # =============================================================

  vector:
    image: timberio/vector:latest-alpine
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./infra/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    depends_on:
      - victoria-logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8686/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first

  # =============================================================
  # 📊 GRAFANA
  # =============================================================

  grafana:
    image: grafana/grafana:latest
    env_file:
      - .tree.env
    environment:
      GF_INSTALL_PLUGINS: victoriametrics-metrics-datasource,victoriametrics-logs-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - internal
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: stop-first
