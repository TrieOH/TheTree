name: Setup Node + pnpm
description: >
  Node + pnpm toolchain with automatic pnpm-store caching via setup-node's
  built-in cache. Node is NODE_VERSION from tools.versions; pnpm is the
  version package.json's packageManager pins. Optionally runs
  `pnpm install --frozen-lockfile` (install input).
inputs:
  install:
    description: "run `pnpm install --frozen-lockfile` after cache restore (true/false)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # tools.versions → GITHUB_ENV, so this and later steps read the pins
    - name: Load tool versions
      shell: bash
      run: grep -E '^[A-Z0-9_]+=' tools.versions >> "$GITHUB_ENV"

    # no version input: action-setup reads package.json's packageManager
    - name: pnpm
      uses: pnpm/action-setup@v6

    - name: Toolchain
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Report
      shell: bash
      run: |
        node --version
        pnpm --version
