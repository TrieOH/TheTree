name: Trivy scan
description: >
  Installs the pinned trivy (TRIVY_VERSION from tools.versions) and scans
  each path for vulnerabilities, secrets and misconfigurations; any finding
  fails the step. Each path is scanned once to JSON, printed as a table and
  counted per severity. Trivy downloads its own DB once per job.
inputs:
  paths:
    description: space-separated paths to scan
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup/versions

    - name: Install
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
          | sh -s -- -b "$HOME/.local/bin" "v${TRIVY_VERSION}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Scan
      shell: bash
      env:
        SCAN_PATHS: ${{ inputs.paths }}
      run: |
        set -uo pipefail
        M="$GITHUB_WORKSPACE/.github/scripts/metric"
        rc=0
        for p in $SCAN_PATHS; do
          echo "[trivy] scanning $p"
          OUT="$RUNNER_TEMP/trivy-$(tr '/' '_' <<< "$p").json"
          trivy fs --skip-version-check --quiet \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            --format json --output "$OUT" "$p" || { rc=1; continue; }
          trivy convert --format table --exit-code 1 "$OUT" || rc=1
          for sev in CRITICAL HIGH MEDIUM LOW; do
            n=$(jq --arg s "$sev" '[.Results[]? | (.Vulnerabilities // []) + (.Secrets // []) + ((.Misconfigurations // []) | map(select(.Status == "FAIL"))) | .[] | select(.Severity == $s)] | length' "$OUT")
            "$M" scan/trivy findings "$n" "path=$p" "severity=$sev"
          done
        done
        exit $rc
