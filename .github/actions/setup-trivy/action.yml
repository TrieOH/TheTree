name: Setup Trivy
description: >
  Installs a pinned trivy binary and lets trivy manage its own CVE database
  download. No caching — binary and DB fetched fresh every run.
  Adds ~/.local/bin to PATH — same location `just setup` uses on dev machines.
  The version is TRIVY_VERSION from tools.versions.
runs:
  using: composite
  steps:
    # tools.versions → GITHUB_ENV, so this and later steps read the pins
    - name: Load tool versions
      shell: bash
      run: grep -E '^[A-Z0-9_]+=' tools.versions >> "$GITHUB_ENV"

    - name: Install binary
      shell: bash
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v${{ env.TRIVY_VERSION }}/contrib/install.sh \
          | sh -s -- -b "$HOME/.local/bin" "v${{ env.TRIVY_VERSION }}"

    - name: Add to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Report + smoke test
      shell: bash
      run: trivy --version