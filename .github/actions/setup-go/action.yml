name: Setup Go
description: >
  Go toolchain with automatic module/build caching via setup-go's built-in
  cache, pointed at the workspace's go.work.sum and per-module go.sum files
  (there's no root go.sum in this go.work multi-module layout). Run before
  setup-go-tools (which needs the go toolchain for `go install`). The
  version is GO_VERSION from tools.versions.
runs:
  using: composite
  steps:
    # tools.versions → GITHUB_ENV, so this and later steps read the pins
    - name: Load tool versions
      shell: bash
      run: grep -E '^[A-Z0-9_]+=' tools.versions >> "$GITHUB_ENV"

    - name: Check go.work directive
      shell: bash
      run: |
        if ! grep -qx "go $GO_VERSION" go.work; then
          echo "::error file=go.work::go directive does not match GO_VERSION=$GO_VERSION in tools.versions"
          exit 1
        fi

    - name: Toolchain
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: |
          go.work.sum
          **/go.sum

    - name: Report
      shell: bash
      run: go version