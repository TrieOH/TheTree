name: Report release to the portal
description: >
  Tells the dev portal (portal.trieoh.com) what a release run did, from the
  run itself: the status and the stage it stopped at (parse, checks or
  publish) to /webhooks/deploy, and every job's, step's and substep's timing
  plus the metrics the jobs recorded to /webhooks/ci (D1). Neither the
  pipeline nor the portal calls the services, so a release never wakes a
  container. Run it in the run's last job, after every other job; never fails.
inputs:
  secret:
    description: DEPLOY_HOOK_SECRET
    required: true
  token:
    description: "a token that can read this run's jobs and logs (actions: read)"
    required: true
  needs:
    description: "toJSON(needs): which pipeline ran, its outputs (artifact, lane, superseded) and metrics"
    required: true
runs:
  using: composite
  steps:
    - name: Report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SECRET: ${{ inputs.secret }}
        NEEDS_JSON: ${{ inputs.needs }}
        TAG: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        ACTOR: ${{ github.actor }}
        REPORT_JOB: ${{ github.job }}
      run: python3 -I "$GITHUB_WORKSPACE/.github/scripts/ci-report.py"
