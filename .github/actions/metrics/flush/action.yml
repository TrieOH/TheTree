name: Flush metrics
description: >
  Hands what .github/scripts/metric recorded in this job to release/report
  as a step output (JSON lines), which the job and its reusable workflow
  pass on as <job>-metrics. Cheaper than an artifact upload. Run it last,
  with `if: always()`, so a failed job still reports. Never fails the job.
outputs:
  metrics:
    description: the job's metrics, one JSON object per line
    value: ${{ steps.collect.outputs.metrics }}
runs:
  using: composite
  steps:
    - name: Collect
      id: collect
      shell: bash
      run: |
        SRC="$RUNNER_TEMP/ci-metrics.jsonl"
        touch "$SRC"
        DELIM="metrics_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        { echo "metrics<<$DELIM"; cat "$SRC"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
        echo "[metrics] $(wc -l < "$SRC") metrics from $GITHUB_JOB"
