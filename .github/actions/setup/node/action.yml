name: Setup Node + pnpm
description: >
  Node (NODE_VERSION from tools.versions) and pnpm (the version package.json's
  packageManager pins), both kept in the tool cache on a sticky disk
  (setup/toolcache), and the pnpm store on its own sticky disk so a release
  tag reuses what the last one downloaded. pnpm runs with its global virtual
  store: node_modules link into the store instead of getting copies of it
  (the store is on another filesystem, so pnpm can't hard-link). Optionally
  runs `pnpm install --frozen-lockfile`, for the whole workspace or one filter.
inputs:
  install:
    description: "run `pnpm install --frozen-lockfile` (true/false)"
    required: false
    default: "false"
  filter:
    description: "install only this pnpm filter and its dependencies, e.g. ./front/portal (empty: whole workspace)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup/versions

    - uses: ./.github/actions/setup/toolcache

    - name: Toolchain
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    # pnpm/action-setup reinstalls pnpm from npm on every run; this installs
    # the pinned version into the tool cache once
    - name: pnpm
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(jq -r '.packageManager | sub("^pnpm@"; "") | sub("\\+.*$"; "")' package.json)
        DIR="$RUNNER_TOOL_CACHE/pnpm/$VERSION"
        if [ ! -x "$DIR/bin/pnpm" ]; then
          rm -rf "$DIR"
          npm install --global --prefix "$DIR" --no-audit --no-fund "pnpm@$VERSION"
          "$GITHUB_WORKSPACE/.github/scripts/metric" setup/node pnpm_installed 1
        fi
        echo "$DIR/bin" >> "$GITHUB_PATH"
        echo "pnpm_config_enable_global_virtual_store=true" >> "$GITHUB_ENV"

    - name: Locate store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Mount store
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ github.repository }}-pnpm-store
        path: ${{ steps.store.outputs.path }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: |
        set -euo pipefail
        LOG="$RUNNER_TEMP/pnpm-install.log"
        pnpm install --frozen-lockfile ${FILTER:+--filter "$FILTER..."} 2>&1 | tee "$LOG"
        # last progress line: "Progress: resolved N, reused R, downloaded D, added A, done"
        LINE=$(grep -oE 'resolved [0-9]+, reused [0-9]+, downloaded [0-9]+' "$LOG" | tail -1 || true)
        if [ -n "$LINE" ]; then
          read -r RESOLVED REUSED DOWNLOADED <<< "$(grep -oE '[0-9]+' <<< "$LINE" | xargs)"
          M="$GITHUB_WORKSPACE/.github/scripts/metric"
          "$M" setup/node pnpm_resolved "$RESOLVED"
          "$M" setup/node pnpm_reused "$REUSED"
          "$M" setup/node pnpm_downloaded "$DOWNLOADED"
        fi

    - name: Report
      shell: bash
      run: |
        node --version
        pnpm --version
