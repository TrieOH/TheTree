name: Report deploy to the portal
description: >
  Tells the dev portal (portal.trieoh.com) what a release did: the run's
  status only. Neither the pipeline nor the portal calls the services, so a
  release never wakes a container. Never fails the job.
inputs:
  status:
    description: "the job's status so far: success, failure or cancelled (pass job.status)"
    required: true
  secret:
    description: "DEPLOY_HOOK_SECRET"
    required: true
runs:
  using: composite
  steps:
    - name: Report
      shell: bash
      env:
        STATUS: ${{ inputs.status }}
        SECRET: ${{ inputs.secret }}
        TAG: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        ACTOR: ${{ github.actor }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -uo pipefail
        # what shipped: the tag minus its version (identityx, univents-ui, pages/trieoh)
        COMPONENT="${TAG%/v*}"
        BODY=$(printf '{"component":"%s","tag":"%s","sha":"%s","actor":"%s","status":"%s","run_id":%s}' \
          "$COMPONENT" "$TAG" "$SHA" "$ACTOR" "$STATUS" "$RUN_ID")
        curl -fsS -m 15 -X POST https://portal.trieoh.com/webhooks/deploy \
          -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" \
          --data "$BODY" \
          && echo "[report] $COMPONENT $TAG $STATUS" \
          || echo "::warning::could not report the deploy to the portal"
