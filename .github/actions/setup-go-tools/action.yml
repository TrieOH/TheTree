name: Setup Go tools
description: >
  Installs pinned Go-ecosystem tools, one dir each under
  ~/.local/thetree-tools (all added to PATH): sqlc, oapi-codegen, golangci-lint, gotestsum — the same versions
  `just setup` installs on dev machines. Requires setup-go to run first
  (needs `go install`). Each tool is cached on its own version, so a bump
  reinstalls only that tool.
inputs:
  sqlc-version:
    description: sqlc version (no leading v — matches the tarball name)
    required: false
    default: "1.31.1"
  oapi-codegen-version:
    description: oapi-codegen module version (with leading v)
    required: false
    default: "v2.8.0"
  golangci-lint-version:
    description: golangci-lint version (no leading v — tag gets v-prefix)
    required: false
    default: "2.12.2"
  gotestsum-version:
    description: gotestsum version (WITH leading v — go install needs it)
    required: false
    default: "v1.13.0"
runs:
  using: composite
  steps:
    # ── sqlc — tarball name uses underscores ───────────────────────────────
    - name: Restore sqlc
      id: sqlc
      uses: actions/cache@v4
      with:
        path: ~/.local/thetree-tools/sqlc
        key: thetree-tool-${{ runner.os }}-sqlc-${{ inputs.sqlc-version }}

    - name: Install sqlc
      if: steps.sqlc.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/thetree-tools/sqlc"
        curl -sSL "https://downloads.sqlc.dev/sqlc_${{ inputs.sqlc-version }}_linux_amd64.tar.gz" \
          | tar -xz -C "$HOME/.local/thetree-tools/sqlc" sqlc

    # ── golangci-lint — release tag gets the v-prefix, dirname doesn't ─────
    - name: Restore golangci-lint
      id: gcl
      uses: actions/cache@v4
      with:
        path: ~/.local/thetree-tools/golangci-lint
        key: thetree-tool-${{ runner.os }}-golangci-lint-${{ inputs.golangci-lint-version }}

    - name: Install golangci-lint
      if: steps.gcl.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        GCL="${{ inputs.golangci-lint-version }}"
        mkdir -p "$HOME/.local/thetree-tools/golangci-lint"
        curl -sSL "https://github.com/golangci/golangci-lint/releases/download/v${GCL}/golangci-lint-${GCL}-linux-amd64.tar.gz" \
          | tar -xz --strip-components=1 -C "$HOME/.local/thetree-tools/golangci-lint" "golangci-lint-${GCL}-linux-amd64/golangci-lint"

    # ── oapi-codegen — go install (needs the go toolchain) ─────────────────
    - name: Restore oapi-codegen
      id: oapi
      uses: actions/cache@v4
      with:
        path: ~/.local/thetree-tools/oapi-codegen
        key: thetree-tool-${{ runner.os }}-oapi-codegen-${{ inputs.oapi-codegen-version }}

    - name: Install oapi-codegen
      if: steps.oapi.outputs.cache-hit != 'true'
      shell: bash
      run: GOBIN="$HOME/.local/thetree-tools/oapi-codegen" go install "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${{ inputs.oapi-codegen-version }}"

    # ── gotestsum — go install (needs the go toolchain) ────────────────────
    - name: Restore gotestsum
      id: gts
      uses: actions/cache@v4
      with:
        path: ~/.local/thetree-tools/gotestsum
        key: thetree-tool-${{ runner.os }}-gotestsum-${{ inputs.gotestsum-version }}

    - name: Install gotestsum
      if: steps.gts.outputs.cache-hit != 'true'
      shell: bash
      run: GOBIN="$HOME/.local/thetree-tools/gotestsum" go install "gotest.tools/gotestsum@${{ inputs.gotestsum-version }}"

    - name: Add to PATH
      shell: bash
      run: |
        for t in sqlc golangci-lint oapi-codegen gotestsum; do
          echo "$HOME/.local/thetree-tools/$t" >> "$GITHUB_PATH"
        done

    - name: Report + smoke test
      shell: bash
      run: |
        sqlc version
        oapi-codegen --version
        golangci-lint version
        gotestsum --version
