name: Go generate
description: >
  sqlc, then tools/go/generate.sh for one service: the generated code is
  gitignored, same recipe as `just gen`. Requires setup/go and
  setup/go-tools.
inputs:
  dir:
    description: the service module, e.g. api/identityx
    required: true
runs:
  using: composite
  steps:
    - name: Generate
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        set -euo pipefail
        # One root sqlc.yaml for all four backends; it generates them all.
        sqlc generate -f "$GITHUB_WORKSPACE/sqlc.yaml"
        "$GITHUB_WORKSPACE/tools/go/generate.sh" .
