name: Front release
# Called by deploy.yml for <front>-ui/v* tags. checks: parse the tag,
# generate → lint → typecheck → test (full lane; trivy scans in the
# background meanwhile), then build once and hand the build to publish as the
# `dist` artifact. publish: upload that build as a Worker version and promote
# it; the portal instead migrates its D1 and deploys with its own token.
# Production config is in each front's wrangler.jsonc.

on:
  workflow_call:
    outputs:
      artifact:
        value: ${{ jobs.checks.outputs.artifact }}
      lane:
        value: ${{ jobs.checks.outputs.lane }}
      superseded:
        value: ${{ jobs.publish.outputs.superseded }}
      checks-metrics:
        value: ${{ jobs.checks.outputs.metrics }}
      publish-metrics:
        value: ${{ jobs.publish.outputs.metrics }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      artifact: ${{ steps.tag.outputs.artifact }}
      version: ${{ steps.tag.outputs.version }}
      lane: ${{ steps.tag.outputs.lane }}
      package: ${{ steps.tag.outputs.package }}
      dir: ${{ steps.tag.outputs.dir }}
      metrics: ${{ steps.metrics.outputs.metrics }}
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Parse tag
        id: tag
        uses: ./.github/actions/release/parse-tag
        with:
          expect: front

      # tools/problemgen bundles the specs orval reads
      - name: Setup Go
        uses: ./.github/actions/setup/go
        with:
          cache-scope: fronts

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup/node
        with:
          install: 'true'

      - name: Generate
        uses: ./.github/actions/front/generate
        with:
          package: ${{ steps.tag.outputs.package }}

      # the lockfile lives at the root; the app dir alone has no dep files
      - name: Start Trivy
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          mode: start
          paths: ${{ steps.tag.outputs.dir }} pnpm-lock.yaml

      - name: Lint
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/front/check
        with:
          package: ${{ steps.tag.outputs.package }}

      - name: Typecheck
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/front/typecheck
        with:
          package: ${{ steps.tag.outputs.package }}

      - name: Test
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/front/test
        with:
          package: ${{ steps.tag.outputs.package }}

      - name: Trivy
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          mode: finish

      - name: Build
        uses: ./.github/actions/front/build
        with:
          package: ${{ steps.tag.outputs.package }}
          dir: ${{ steps.tag.outputs.dir }}

      - name: Flush metrics
        id: metrics
        if: always()
        uses: ./.github/actions/metrics/flush

  publish:
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    concurrency:
      group: release-${{ needs.checks.outputs.artifact }}
      cancel-in-progress: false
    outputs:
      superseded: ${{ steps.guard.outputs.superseded }}
      metrics: ${{ steps.metrics.outputs.metrics }}
    env:
      ARTIFACT: ${{ needs.checks.outputs.artifact }}
      VERSION: ${{ needs.checks.outputs.version }}
      PACKAGE: ${{ needs.checks.outputs.package }}
      DIR: ${{ needs.checks.outputs.dir }}
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Supersede guard
        id: guard
        uses: ./.github/actions/release/guard
        with:
          artifact: ${{ env.ARTIFACT }}
          version: ${{ env.VERSION }}

      # wrangler only: this front, not the whole workspace
      - name: Setup Node + pnpm
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/setup/node
        with:
          install: 'true'
          filter: ./${{ env.DIR }}

      - name: Download build
        if: steps.guard.outputs.superseded != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ env.DIR }}

      # The portal deploys with its own token (Workers Scripts, D1, Account
      # Settings), so the shared one needs no D1 access, and with `wrangler
      # deploy`, so its first release could create the Worker.
      - name: Deploy to Cloudflare
        id: deploy
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/deploy/worker
        with:
          dir: ${{ env.DIR }}
          mode: ${{ env.PACKAGE == 'portal' && 'deploy' || 'upload' }}
          d1: ${{ env.PACKAGE == 'portal' && 'portal' || '' }}
          artifact: ${{ env.ARTIFACT }}
          version: ${{ env.VERSION }}
          api-token: ${{ env.PACKAGE == 'portal' && secrets.PORTAL_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: release.json
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/release/summary
        with:
          release: >-
            {"tag": "${{ env.VERSION }}", "artifact": "${{ env.ARTIFACT }}", "type": "front",
             "worker_version_id": "${{ steps.deploy.outputs.version-id }}"}

      - name: Flush metrics
        id: metrics
        if: always()
        uses: ./.github/actions/metrics/flush
