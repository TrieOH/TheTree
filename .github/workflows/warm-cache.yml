name: Warm cache
# Saves the Go tool binaries and the Go module/build cache from main, the
# one ref every tag run can restore from (a cache saved on a tag is visible
# only to that tag). Checks nothing and gates nothing — ADR-0007's deploy
# gate stays the only CI.
#
# Runs when a tool version or a dependency changes, or by hand; dispatch
# with refresh=true to drop the main caches first and rebuild them.

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/setup-go/**'
      - '.github/actions/setup-go-tools/**'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
  workflow_dispatch:
    inputs:
      refresh:
        description: Delete main's tool and Go caches before rebuilding them
        type: boolean
        default: false

concurrency:
  group: warm-cache
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # cache deletion on refresh

defaults:
  run:
    shell: bash

jobs:
  warm:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Drop main's caches
        if: ${{ inputs.refresh }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for prefix in thetree-tool- setup-go-; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$prefix" --limit 100 --json id --jq '.[].id' \
              | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
          done

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Go tools
        uses: ./.github/actions/setup-go-tools

      # fills the module cache setup-go saves at the end of the job
      - name: Download modules
        run: go mod download
