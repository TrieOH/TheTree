name: Warm tool cache
# Saves the Go tool binaries (setup-go-tools) from main, the one ref every
# tag run can restore from (a cache saved on a tag is visible only to that
# tag). Checks nothing and gates nothing — ADR-0007's deploy gate stays the
# only CI.
#
# Runs when a tool version changes, or by hand; dispatch with refresh=true
# to drop main's tool caches first and rebuild them.

on:
  push:
    branches: [main]
    paths:
      - 'tools.versions'
      - '.github/actions/setup-go-tools/**'
  workflow_dispatch:
    inputs:
      refresh:
        description: Delete main's tool caches before rebuilding them
        type: boolean
        default: false

concurrency:
  group: warm-tool-cache
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # cache deletion on refresh

defaults:
  run:
    shell: bash

jobs:
  warm:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Drop main's tool caches
        if: ${{ inputs.refresh }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key thetree-tool- --limit 100 --json id --jq '.[].id' \
            | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done

      - name: Load tool versions
        run: grep -E '^[A-Z0-9_]+=' tools.versions >> "$GITHUB_ENV"

      # go install needs the toolchain; its module cache is not warmed here
      - name: Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Go tools
        uses: ./.github/actions/setup-go-tools
