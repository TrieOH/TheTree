name: Service release
# Called by deploy.yml for <service>/v* tags. checks: parse the tag, then the
# ordered R-chain (generate → compile → unit → lint → trivy → integration;
# express lane stops after unit); trivy scans in the background from right
# after generate; then the release binary, built from the code just tested.
# publish: put that binary in the image (no compile there), push it to GHCR,
# ship that same image to Cloudflare.

on:
  workflow_call:
    outputs:
      artifact:
        value: ${{ jobs.checks.outputs.artifact }}
      lane:
        value: ${{ jobs.checks.outputs.lane }}
      superseded:
        value: ${{ jobs.publish.outputs.superseded }}
      checks-metrics:
        value: ${{ jobs.checks.outputs.metrics }}
      publish-metrics:
        value: ${{ jobs.publish.outputs.metrics }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      artifact: ${{ steps.tag.outputs.artifact }}
      version: ${{ steps.tag.outputs.version }}
      lane: ${{ steps.tag.outputs.lane }}
      dir: ${{ steps.tag.outputs.dir }}
      metrics: ${{ steps.metrics.outputs.metrics }}
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3

      - name: Parse tag
        id: tag
        uses: ./.github/actions/release/parse-tag
        with:
          expect: service

      - name: Setup Go
        uses: ./.github/actions/setup/go
        with:
          cache-scope: ${{ steps.tag.outputs.artifact }}

      - name: Setup Go tools
        uses: ./.github/actions/setup/go-tools

      # stamps the bundled spec's info.version, as the image used to
      - name: Generate
        uses: ./.github/actions/go/generate
        env:
          SPEC_VERSION: ${{ steps.tag.outputs.version }}
        with:
          dir: ${{ steps.tag.outputs.dir }}

      - name: Start Trivy
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          mode: start
          paths: ${{ steps.tag.outputs.dir }} lib/go tools/go

      - name: Compile
        uses: ./.github/actions/go/build
        with:
          dir: ${{ steps.tag.outputs.dir }}

      - name: Unit tests
        uses: ./.github/actions/go/test
        with:
          dir: ${{ steps.tag.outputs.dir }}
          mode: short

      - name: Lint
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/go/lint
        with:
          dir: ${{ steps.tag.outputs.dir }}
          cache-scope: ${{ steps.tag.outputs.artifact }}

      - name: Trivy
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          mode: finish

      # slowest, so last; the runner's own Docker runs testcontainers
      - name: Integration tests
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/go/test
        with:
          dir: ${{ steps.tag.outputs.dir }}
          mode: integration

      # only once every check passed: what publish ships is what was tested
      - name: Release binary
        uses: ./.github/actions/go/release-binary
        with:
          dir: ${{ steps.tag.outputs.dir }}
          service: ${{ steps.tag.outputs.artifact }}

      - name: Flush metrics
        id: metrics
        if: always()
        uses: ./.github/actions/metrics/flush

  publish:
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # one release of an artifact ships at a time, in order; release/guard
    # skips a tag a newer one already superseded
    concurrency:
      group: release-${{ needs.checks.outputs.artifact }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      superseded: ${{ steps.guard.outputs.superseded }}
      metrics: ${{ steps.metrics.outputs.metrics }}
    env:
      SERVICE: ${{ needs.checks.outputs.artifact }}
      VERSION: ${{ needs.checks.outputs.version }}
      IMAGE: ghcr.io/trieoh/${{ needs.checks.outputs.artifact }}:${{ needs.checks.outputs.version }}
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3

      - name: Supersede guard
        id: guard
        uses: ./.github/actions/release/guard
        with:
          artifact: ${{ env.SERVICE }}
          version: ${{ env.VERSION }}

      - name: Load tool versions
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/setup/versions

      # Background work, so it overlaps the build and the smoke test: the
      # Worker package's install (wrangler and what the Worker bundles) and
      # the smoke test's Postgres image.
      - name: Setup Node + pnpm
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/setup/node
        with:
          install: background
          filter: ./api/${{ env.SERVICE }}/cloudflare

      - name: Prefetch Postgres
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/release/smoke-boot
        with:
          mode: prefetch

      - name: Download release binary
        if: steps.guard.outputs.superseded != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bin
          path: ${{ runner.temp }}/release-bin

      # Registry: GHCR, auth via the job's own GITHUB_TOKEN. The build runs
      # through Blacksmith's cached builder (docs.blacksmith.sh/blacksmith-caching/docker-builds).
      - name: Setup Docker builder
        if: steps.guard.outputs.superseded != 'true'
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2.3.0
        with:
          cache-key: release/${{ env.SERVICE }}

      - name: Login to GHCR
        if: steps.guard.outputs.superseded != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is checks' release binary in distroless (api/Dockerfile.release),
      # also loaded into this job's Docker for the smoke test and the
      # Cloudflare push.
      - name: Build & push image
        id: img
        if: steps.guard.outputs.superseded != 'true'
        # The ~3 s dockereng/export-build pull after each build is Blacksmith's
        # own build reporting; it runs whatever DOCKER_BUILD_SUMMARY says.
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: ${{ runner.temp }}/release-bin
          file: api/Dockerfile.release
          tags: ${{ env.IMAGE }}
          push: true
          load: true

      # the digest output can be a full ref (registry/repo@sha256:…); keep
      # the bare digest, the Cloudflare step pulls the image by it
      - name: Image digest
        id: digest
        if: steps.guard.outputs.superseded != 'true'
        env:
          DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          set -euo pipefail
          DIGEST="${DIGEST##*@}"
          [ -n "$DIGEST" ] || { echo "::error::build-push-action returned no digest"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "[release] pushed $IMAGE → $DIGEST"

      # in the background, during the smoke test; a failed smoke test means
      # the image sits unused in Cloudflare's registry, nothing deploys
      - name: Push to Cloudflare's registry
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/deploy/container
        with:
          mode: push
          service: ${{ env.SERVICE }}
          version: ${{ env.VERSION }}
          image: ${{ env.IMAGE }}
          api-token: ${{ secrets.CLOUDFLARE_BACKEND_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The image must boot before it ships: a throwaway Postgres, a stub
      # for the other services, /health within a minute. Nothing in prod is
      # touched.
      - name: Boot smoke test
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/release/smoke-boot
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}

      - name: Deploy to Cloudflare
        id: deploy
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/deploy/container
        with:
          mode: deploy
          service: ${{ env.SERVICE }}
          version: ${{ env.VERSION }}
          api-token: ${{ secrets.CLOUDFLARE_BACKEND_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A green deploy means the container is on this image, not only the Worker.
      - name: Wait for container rollout
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/deploy/wait-rollout
        with:
          service: ${{ env.SERVICE }}
          version: ${{ env.VERSION }}
          api-token: ${{ secrets.CLOUDFLARE_BACKEND_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A line on every Grafana chart at each release (tag "deploy"), green or
      # failed. Skipped until GRAFANA_URL and GRAFANA_ANNOTATIONS_TOKEN exist.
      - name: Grafana deploy annotation
        if: always() && steps.guard.outputs.superseded != 'true'
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_ANNOTATIONS_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_TOKEN" ]; then
            echo "[annotate] GRAFANA_URL / GRAFANA_ANNOTATIONS_TOKEN not set, skipping"
            exit 0
          fi
          text="$SERVICE $VERSION deployed"
          [ "$OUTCOME" = "success" ] || text="$SERVICE $VERSION deploy FAILED"
          body=$(jq -nc --arg text "$text" --arg svc "$SERVICE" --arg ver "$VERSION" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{time: (now * 1000 | floor), tags: ["deploy", $svc, $ver], text: ($text + " — <a href=\"" + $run + "\">run</a>")}')
          curl -fsS -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_TOKEN" -H "Content-Type: application/json" -d "$body" \
            || echo "::warning::could not post the Grafana annotation"

      - name: release.json
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/release/summary
        with:
          release: >-
            {"tag": "${{ env.VERSION }}", "artifact": "${{ env.SERVICE }}", "type": "service",
             "image": "${{ env.IMAGE }}", "digest": "${{ steps.digest.outputs.digest }}",
             "worker_version_id": "${{ steps.deploy.outputs.version-id }}"}

      - name: Flush metrics
        id: metrics
        if: always()
        uses: ./.github/actions/metrics/flush
