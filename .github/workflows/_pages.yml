name: Pages release
# Called by deploy.yml for pages/<dir>/v* tags: a static site in front/<dir>
# (its wrangler.jsonc names the Pages project). checks: lint → typecheck →
# trivy → build once; publish uploads that build to Pages.

on:
  workflow_call:
    inputs:
      package:
        description: the pnpm package, e.g. @trieoh/trieoh-platform
        type: string
        required: true
      dir:
        description: e.g. front/trieoh
        type: string
        required: true
      version:
        type: string
        required: true
      lane:
        description: full or express
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup/node
        with:
          install: 'true'
          filter: ./${{ inputs.dir }}

      - name: Lint
        if: inputs.lane == 'full'
        uses: ./.github/actions/front/check
        with:
          package: ${{ inputs.package }}

      - name: Typecheck
        if: inputs.lane == 'full'
        uses: ./.github/actions/front/typecheck
        with:
          package: ${{ inputs.package }}

      - name: Trivy
        if: inputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          paths: ${{ inputs.dir }} pnpm-lock.yaml

      - name: Build
        uses: ./.github/actions/front/build
        with:
          package: ${{ inputs.package }}
          dir: ${{ inputs.dir }}

      - name: Flush metrics
        if: always()
        uses: ./.github/actions/metrics/flush

  publish:
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup/node
        with:
          install: 'true'
          filter: ./${{ inputs.dir }}

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ inputs.dir }}

      - name: Deploy to Pages
        id: deploy
        uses: ./.github/actions/deploy/pages
        with:
          dir: ${{ inputs.dir }}
          api-token: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: release.json
        uses: ./.github/actions/release/summary
        with:
          release: >-
            {"tag": "${{ inputs.version }}", "dir": "${{ inputs.dir }}", "type": "pages",
             "url": "${{ steps.deploy.outputs.url }}"}

      - name: Flush metrics
        if: always()
        uses: ./.github/actions/metrics/flush
