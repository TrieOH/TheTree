name: Pages release
# Called by deploy.yml for pages/<dir>/v* tags: a static site in front/<dir>
# (its wrangler.jsonc names the Pages project). checks: parse the tag, lint →
# typecheck (trivy in the background) → build once; publish uploads that
# build to Pages.

on:
  workflow_call:
    outputs:
      artifact:
        value: ${{ jobs.checks.outputs.artifact }}
      lane:
        value: ${{ jobs.checks.outputs.lane }}
      superseded:
        value: ${{ jobs.publish.outputs.superseded }}
      checks-metrics:
        value: ${{ jobs.checks.outputs.metrics }}
      publish-metrics:
        value: ${{ jobs.publish.outputs.metrics }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      artifact: ${{ steps.tag.outputs.artifact }}
      version: ${{ steps.tag.outputs.version }}
      lane: ${{ steps.tag.outputs.lane }}
      dir: ${{ steps.tag.outputs.dir }}
      metrics: ${{ steps.metrics.outputs.metrics }}
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Parse tag
        id: tag
        uses: ./.github/actions/release/parse-tag
        with:
          expect: pages

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup/node
        with:
          install: 'true'
          filter: ./${{ steps.tag.outputs.dir }}

      - name: Start Trivy
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          mode: start
          paths: ${{ steps.tag.outputs.dir }} pnpm-lock.yaml

      - name: Lint
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/front/check
        with:
          package: ${{ steps.tag.outputs.package }}

      - name: Typecheck
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/front/typecheck
        with:
          package: ${{ steps.tag.outputs.package }}

      - name: Trivy
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          mode: finish

      - name: Build
        uses: ./.github/actions/front/build
        with:
          package: ${{ steps.tag.outputs.package }}
          dir: ${{ steps.tag.outputs.dir }}

      - name: Flush metrics
        id: metrics
        if: always()
        uses: ./.github/actions/metrics/flush

  publish:
    needs: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    concurrency:
      group: release-${{ needs.checks.outputs.artifact }}
      cancel-in-progress: false
    outputs:
      superseded: ${{ steps.guard.outputs.superseded }}
      metrics: ${{ steps.metrics.outputs.metrics }}
    env:
      ARTIFACT: ${{ needs.checks.outputs.artifact }}
      VERSION: ${{ needs.checks.outputs.version }}
      DIR: ${{ needs.checks.outputs.dir }}
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Supersede guard
        id: guard
        uses: ./.github/actions/release/guard
        with:
          artifact: ${{ env.ARTIFACT }}
          version: ${{ env.VERSION }}

      - name: Setup Node + pnpm
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/setup/node
        with:
          install: 'true'
          filter: ./${{ env.DIR }}

      - name: Download build
        if: steps.guard.outputs.superseded != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ env.DIR }}

      - name: Deploy to Pages
        id: deploy
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/deploy/pages
        with:
          dir: ${{ env.DIR }}
          api-token: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: release.json
        if: steps.guard.outputs.superseded != 'true'
        uses: ./.github/actions/release/summary
        with:
          release: >-
            {"tag": "${{ env.VERSION }}", "dir": "${{ env.DIR }}", "type": "pages",
             "url": "${{ steps.deploy.outputs.url }}"}

      - name: Flush metrics
        id: metrics
        if: always()
        uses: ./.github/actions/metrics/flush
