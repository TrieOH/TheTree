name: Deploy
# The release router (ADR-0007: the deploy gate is the only CI). A release tag
# goes straight to one reusable workflow per artifact type, by its pattern;
# each pipeline's checks job parses the tag first (release/parse-tag), then
# runs its gate, and its publish job ships:
#   <service>/v1.2.3        → _service.yml   Go backend → GHCR → Cloudflare Container
#   <front>-ui/v1.2.3       → _front.yml     Worker front
#   <sdk>-sdk-ts/v1.2.3     → _sdk.yml       gate only; npm publishing is by hand
#   pages/<dir>/v1.2.3      → _pages.yml     static site on Cloudflare Pages
#   <artifact>/v1.2.3-hotfix.1               express lane: compile + unit only (§3.5)
# Anything else falls through to _service.yml, whose parse step rejects it.
#
# Releases of one artifact never overlap in publish (a per-artifact lock in
# each pipeline), and an older tag that reaches publish after a newer one is
# skipped (release/guard), so an older version can't replace a newer one.
#
# Contract (§3.8): build once → publish immutable artifact → capture digest /
# Worker Version ID. NO :latest is ever pushed. release.json is printed to the
# run log and summary. Whatever happens, `report` tells the dev portal the
# outcome and every step's timing and metrics.

on:
  push:
    tags:
      - '*/v*'
      - 'pages/*/v*'

permissions:
  contents: read

jobs:
  service:
    if: >-
      !startsWith(github.ref_name, 'pages/') &&
      !contains(github.ref_name, '-ui/') &&
      !contains(github.ref_name, '-sdk-ts/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_service.yml
    secrets: inherit

  front:
    if: contains(github.ref_name, '-ui/')
    uses: ./.github/workflows/_front.yml
    secrets: inherit

  sdk:
    if: contains(github.ref_name, '-sdk-ts/')
    uses: ./.github/workflows/_sdk.yml

  pages:
    if: startsWith(github.ref_name, 'pages/')
    uses: ./.github/workflows/_pages.yml
    secrets: inherit

  # Every release, whatever stage it stopped at, reports to the dev portal.
  report:
    needs: [service, front, sdk, pages]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read # this run's jobs, steps and logs
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Report to the portal
        uses: ./.github/actions/release/report
        with:
          secret: ${{ secrets.DEPLOY_HOOK_SECRET }}
          token: ${{ github.token }}
          needs: ${{ toJSON(needs) }}
