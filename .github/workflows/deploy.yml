name: Deploy
# Gate + publish for service, Worker frontend and SDK artifact types (Go services,
# fronts, TS SDKs), both lanes. Replaces publish.yml, publish-ts-sdks.yml and
# deploy-front.yml once proven out on a sandbox tag.
#
# Tags pages/<directory>/v* use deploy-pages.yml and never enter this workflow.
# Tag grammar:
#   <service>/v1.2.3              → full lane   (all checks)
#   <app>-ui/v1.2.3               → full lane   (front checks)
#   <sdk>-sdk-ts/v1.2.3           → full lane   (version guard)
#   <artifact>/v1.2.3-hotfix.1    → express lane (compile + unit only, §3.5)
#
# Contract (§3.8): build once → publish immutable artifact → capture digest /
# Worker Version ID. NO :latest is ever pushed. release.json is printed to the
# run log.

on:
  push:
    tags:
      - '*/v*'
      - '!pages/**'

# Release lock per artifact: tags for different artifacts deploy in
# parallel; tags for the same artifact queue and never cancel (§3.8), so an
# older version can't finish after a newer one. Expressions can't split the
# tag, hence the prefix chain; anything unlisted (SDKs) locks per tag.
concurrency:
  group: >-
    release-${{
      startsWith(github.ref_name, 'identityx/') && 'identityx' ||
      startsWith(github.ref_name, 'informd/') && 'informd' ||
      startsWith(github.ref_name, 'payssage/') && 'payssage' ||
      startsWith(github.ref_name, 'univents/') && 'univents' ||
      startsWith(github.ref_name, 'identityx-ui/') && 'identityx-ui' ||
      startsWith(github.ref_name, 'informd-ui/') && 'informd-ui' ||
      startsWith(github.ref_name, 'payssage-ui/') && 'payssage-ui' ||
      startsWith(github.ref_name, 'univents-ui/') && 'univents-ui' ||
      github.ref_name
    }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  parse:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      artifact: ${{ steps.tag.outputs.artifact }}
      type: ${{ steps.tag.outputs.type }}
      lane: ${{ steps.tag.outputs.lane }}
      version: ${{ steps.tag.outputs.version }}
      front-name: ${{ steps.tag.outputs.front_name }}
      sdk-name: ${{ steps.tag.outputs.sdk_name }}
    steps:
      - name: Parse tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARTIFACT="${TAG%%/*}"
          VERSION="${TAG#*/}"

          case "$ARTIFACT" in
            *-ui)      TYPE=front ;;
            *-sdk-ts*) TYPE=sdk ;;
            *)         TYPE=service ;;
          esac

          LANE=full
          case "$VERSION" in
            *-hotfix.*) LANE=express ;;
          esac

          FRONT_NAME=""
          SDK_NAME=""
          case "$TYPE" in
            front)
              FRONT_NAME="${ARTIFACT%-ui}"
              case "$FRONT_NAME" in
                identityx|informd|payssage|univents) ;;
                *) echo "::error::unknown front '$ARTIFACT'"; exit 1 ;;
              esac
              ;;
            service)
              case "$ARTIFACT" in
                identityx|informd|payssage|univents) ;;
                *) echo "::error::unknown service '$ARTIFACT'"; exit 1 ;;
              esac
              ;;
            sdk)
              # same parse as publish-ts-sdks: strip first '-sdk-ts'
              SDK_NAME="${ARTIFACT/-sdk-ts/}"
              [ -d "sdk/ts/$SDK_NAME" ] || { echo "::error::unknown sdk '$ARTIFACT' (no sdk/ts/$SDK_NAME)"; exit 1; }
              ;;
          esac

          echo "artifact=$ARTIFACT"    >> "$GITHUB_OUTPUT"
          echo "type=$TYPE"            >> "$GITHUB_OUTPUT"
          echo "lane=$LANE"            >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "front_name=$FRONT_NAME" >> "$GITHUB_OUTPUT"
          echo "sdk_name=$SDK_NAME"      >> "$GITHUB_OUTPUT"
          echo "[tag] artifact=$ARTIFACT type=$TYPE lane=$LANE version=$VERSION"

  checks:
    needs: parse
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      sdk-skip: ${{ steps.sdk.outputs.skip }}
      sdk-name: ${{ steps.sdk.outputs.name }}
    env:
      ARTIFACT: ${{ needs.parse.outputs.artifact }}
      TYPE: ${{ needs.parse.outputs.type }}
      LANE: ${{ needs.parse.outputs.lane }}
      VERSION: ${{ needs.parse.outputs.version }}
      FRONT_NAME: ${{ needs.parse.outputs.front-name }}
      SDK_NAME: ${{ needs.parse.outputs.sdk-name }}
    steps:
      - uses: useblacksmith/checkout@v1

      # ── Go toolchain (services) ────────────────────────────────────────
      - name: Setup Go
        id: setup-go
        if: ${{ env.TYPE == 'service' }}
        uses: ./.github/actions/setup-go

      - name: Setup Go tools
        if: ${{ env.TYPE == 'service' }}
        uses: ./.github/actions/setup-go-tools

      # ── Node toolchain (fronts, sdks) ──────────────────────────────────
      - name: Setup Node + pnpm
        if: ${{ env.TYPE != 'service' }}
        uses: ./.github/actions/setup-node
        with:
          install: 'true'

      # ── R0 generate (services): sqlc + oapi-codegen, same recipe as the
      #    old ci.yml tests job — generated code is gitignored ────────────
      - name: R0 generate code
        if: ${{ env.TYPE == 'service' }}
        run: |
          echo "▶ R0 generate code"
          set -euo pipefail
          cd "api/$ARTIFACT"
          sqlc generate
          oapi-codegen --config oapi-codegen.yaml -generate types -o internal/openapi/types.gen.go api-spec.yml
          oapi-codegen --config oapi-codegen.yaml -generate chi-server,strict-server -o internal/openapi/server.gen.go api-spec.yml
          go get "github.com/oapi-codegen/runtime@v$OAPI_RUNTIME_VERSION"

      # ── R1 compile ──────────────────────────────────────────────────────
      - name: R1 compile
        if: ${{ env.TYPE == 'service' }}
        run: |
          echo "▶ R1 compile"
          cd "api/$ARTIFACT" && go build ./...

      # ── R2 unit tests (short: testdb skips testcontainers, see
      #    lib/go/testdb — express lane's only test stage) ─────────────────
      - name: R2 unit tests (-short)
        if: ${{ env.TYPE == 'service' }}
        run: cd "api/$ARTIFACT" && gotestsum --format standard-verbose -- -short -timeout 5m ./...

      # ── R3 lint (full lane only) ────────────────────────────────────────
      - name: R3 lint
        if: ${{ env.TYPE == 'service' && env.LANE == 'full' }}
        run: |
          echo "▶ R3 lint"
          golangci-lint run "./api/$ARTIFACT/..."

      # ── R4 front checks (full lane only) ────────────────────────────────
      - name: R4 front check (lint + format)
        if: ${{ env.TYPE == 'front' && env.LANE == 'full' }}
        run: pnpm -F "$FRONT_NAME" check

      - name: R4 front tsc
        if: ${{ env.TYPE == 'front' && env.LANE == 'full' }}
        run: pnpm -F "$FRONT_NAME" tsc

      - name: R4 front test
        if: ${{ env.TYPE == 'front' && env.LANE == 'full' && env.FRONT_NAME == 'univents' }}
        run: pnpm -F "$FRONT_NAME" test

      # ── SDK version guard (always — cheap, gates the publish) ───────────
      - name: SDK version guard
        id: sdk
        if: ${{ env.TYPE == 'sdk' }}
        working-directory: sdk/ts/${{ env.SDK_NAME }}
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package: $PKG_NAME@$PKG_VERSION (tag: $VERSION)"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch! Tag version is $VERSION but package.json version is $PKG_VERSION"
            exit 1
          fi
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$PKG_NAME@$VERSION already published to npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── R5 trivy (full lane only) ───────────────────────────────────────
      - name: Setup Trivy
        if: ${{ env.LANE == 'full' }}
        uses: ./.github/actions/setup-trivy

      - name: R5 trivy scan
        if: ${{ env.LANE == 'full' }}
        run: |
          set -euo pipefail
          echo "▶ R5 trivy scan"
          case "$TYPE" in
            service) PATHS="api/$ARTIFACT lib/go" ;;
            front)
              FRONT_DIR="$FRONT_NAME"
              [ "$FRONT_NAME" = "univents" ] && FRONT_DIR="univents-solid"
              PATHS="front/$FRONT_DIR pnpm-lock.yaml" ;;  # lockfile lives at root — the app dir alone has zero scannable dep files
            sdk)     PATHS="sdk/ts/$SDK_NAME pnpm-lock.yaml" ;;
          esac
          rc=0
          for p in $PATHS; do
            echo "[trivy] scanning $p"
            trivy fs --skip-version-check \
              --severity LOW,MEDIUM,HIGH,CRITICAL \
              --scanners vuln,secret,misconfig \
              --exit-code 1 "$p" || rc=1
          done
          exit $rc

      # ── R6 integration tests (services, full lane, slowest — last) ──────
      - name: Setup Docker
        if: ${{ env.TYPE == 'service' && env.LANE == 'full' }}
        uses: ./.github/actions/setup-docker

      - name: R6 integration tests
        if: ${{ env.TYPE == 'service' && env.LANE == 'full' }}
        run: |
          echo "▶ R6 integration tests"
          cd "api/$ARTIFACT" && gotestsum --format standard-verbose -- -count=1 ./...

  publish:
    needs: [parse, checks]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    env:
      ARTIFACT: ${{ needs.parse.outputs.artifact }}
      TYPE: ${{ needs.parse.outputs.type }}
      LANE: ${{ needs.parse.outputs.lane }}
      VERSION: ${{ needs.parse.outputs.version }}
      FRONT_NAME: ${{ needs.parse.outputs.front-name }}
      SDK_NAME: ${{ needs.parse.outputs.sdk-name }}
    steps:
      - uses: useblacksmith/checkout@v1

      # ── Services: build once → push immutable image → capture digest ───
      #    NOTE: no :latest push — latest left the deployment contract.
      #    Registry: GHCR (ghcr.io/trieoh/<artifact>), auth via the job's
      #    own GITHUB_TOKEN — no registry secret needed. Build runs through
      #    Blacksmith's cached builder — see docs.blacksmith.sh/blacksmith-caching/docker-builds
      - name: Load tool versions
        if: ${{ env.TYPE == 'service' }}
        run: grep -E '^[A-Z0-9_]+=' tools.versions >> "$GITHUB_ENV"

      - name: Setup Docker Builder (Blacksmith)
        if: ${{ env.TYPE == 'service' }}
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: api/${{ env.ARTIFACT }}/Dockerfile

      - name: Login to GHCR
        if: ${{ env.TYPE == 'service' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: img
        if: ${{ env.TYPE == 'service' }}
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: api/${{ env.ARTIFACT }}/Dockerfile
          build-args: GO_VERSION=${{ env.GO_VERSION }}
          tags: ghcr.io/trieoh/${{ env.ARTIFACT }}:${{ env.VERSION }}
          push: true

      - name: Extract digest
        id: digest
        if: ${{ env.TYPE == 'service' }}
        run: |
          echo "▶ publish: extract digest"
          set -euo pipefail
          IMG="ghcr.io/trieoh/$ARTIFACT:$VERSION"
          # RepoDigests entries are full refs (registry/repo@sha256:…) — keep the
          # bare digest only: the Cloudflare step pulls the image by it
          DIGEST="${{ steps.img.outputs.digest }}"
          DIGEST="${DIGEST##*@}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "[release] pushed $IMG → $DIGEST"

      - name: release.json
        if: ${{ env.TYPE == 'service' }}
        run: |
          cat <<EOF
          ┌─ release.json ────────────────────────────────────────
          {
            "tag": "$VERSION",
            "artifact": "$ARTIFACT",
            "type": "service",
            "image": "ghcr.io/trieoh/$ARTIFACT:$VERSION",
            "digest": "${{ steps.digest.outputs.digest }}"
          }
          └───────────────────────────────────────────────────────
          EOF

      # ── Services on Cloudflare (all four backends): the SAME image just
      #    pushed to GHCR → Cloudflare registry → Worker + Container rollout.
      #    The service env is the <SERVICE>_API_ENV secret (dotenv format).
      - name: Setup Node + pnpm (cloudflare service)
        if: ${{ env.TYPE == 'service' }}
        uses: ./.github/actions/setup-node
        with:
          install: 'true'

      - name: Deploy to Cloudflare (${{ env.ARTIFACT }})
        if: ${{ env.TYPE == 'service' }}
        working-directory: api/${{ env.ARTIFACT }}/cloudflare
        run: |
          echo "▶ publish: cloudflare"
          set -euo pipefail
          case "$ARTIFACT" in
            identityx) SERVICE_ENV="$IDENTITYX_API_ENV"; ENV_NAME=IDENTITYX_API_ENV ;;
            payssage)  SERVICE_ENV="$PAYSSAGE_API_ENV";  ENV_NAME=PAYSSAGE_API_ENV ;;
            informd)   SERVICE_ENV="$INFORMD_API_ENV";   ENV_NAME=INFORMD_API_ENV ;;
            univents)  SERVICE_ENV="$UNIVENTS_API_ENV";  ENV_NAME=UNIVENTS_API_ENV ;;
          esac
          SRC="ghcr.io/trieoh/$ARTIFACT@${{ steps.digest.outputs.digest }}"
          LOCAL="$ARTIFACT-api:$VERSION"
          docker pull "$SRC"
          docker tag "$SRC" "$LOCAL"
          pnpm exec wrangler containers push "$LOCAL"
          IMAGE="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$LOCAL"
          # deploy the pushed image instead of rebuilding from the Dockerfile
          sed -i -E "s|\"image\": \"[^\"]*\"|\"image\": \"$IMAGE\"|; /\"image_build_context\"/d" wrangler.jsonc
          grep -n '"image"' wrangler.jsonc
          # the service env travels with the version (secrets are additive:
          # keys removed from the file stay set until deleted by hand)
          [ -n "$SERVICE_ENV" ] || { echo "::error::$ENV_NAME secret is empty"; exit 1; }
          umask 077
          printf '%s\n' "$SERVICE_ENV" > "$RUNNER_TEMP/service.env"
          trap 'rm -f "$RUNNER_TEMP/service.env"' EXIT
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/service.env" \
            --tag "$VERSION" --message "release: $ARTIFACT $VERSION" | tee deploy.log
          ID=$(grep -oE 'Current Version ID: [a-f0-9-]+' deploy.log | awk '{print $NF}' || true)
          echo "[release] $ARTIFACT $VERSION → Cloudflare ($IMAGE, worker version ${ID:-unknown})"
        env:
          # backends deploy with their own token (Workers, Containers, Queues)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKEND_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IDENTITYX_API_ENV: ${{ secrets.IDENTITYX_API_ENV }}
          PAYSSAGE_API_ENV: ${{ secrets.PAYSSAGE_API_ENV }}
          INFORMD_API_ENV: ${{ secrets.INFORMD_API_ENV }}
          UNIVENTS_API_ENV: ${{ secrets.UNIVENTS_API_ENV }}

      # ── Fronts: build once → upload Worker version → promote SAME
      #    version to production (staging/E2E slots in here later) ────────
      - name: Setup Node + pnpm
        if: ${{ env.TYPE == 'front' || env.TYPE == 'sdk' }}
        uses: ./.github/actions/setup-node
        with:
          install: 'true'

      - name: Build & upload version (identityx)
        id: identityx
        if: ${{ env.ARTIFACT == 'identityx-ui' }}
        run: |
          set -euo pipefail
          pnpm -F identityx build
          ID=$(pnpm -F identityx exec wrangler versions upload --tag "$VERSION" --message "release: $ARTIFACT $VERSION" 2>&1 | grep -oE 'Worker Version ID: [a-f0-9-]+' | awk '{print $NF}')
          echo "WORKER_VERSION_ID=$ID" >> "$GITHUB_ENV"
        env:
          VITE_APP_TITLE: ${{ vars.IDENTITYX_APP_TITLE }}
          VITE_API_URL: ${{ vars.IDENTITYX_API_URL }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.IDENTITYX_POSTHOG_HOST }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.IDENTITYX_POSTHOG_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Promote identityx to production
        if: ${{ env.ARTIFACT == 'identityx-ui' }}
        run: pnpm -F identityx exec wrangler versions deploy --version-id "$WORKER_VERSION_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & upload version (informd)
        id: informd
        if: ${{ env.ARTIFACT == 'informd-ui' }}
        run: |
          set -euo pipefail
          pnpm -F informd build
          ID=$(pnpm -F informd exec wrangler versions upload --tag "$VERSION" --message "release: $ARTIFACT $VERSION" 2>&1 | grep -oE 'Worker Version ID: [a-f0-9-]+' | awk '{print $NF}')
          echo "WORKER_VERSION_ID=$ID" >> "$GITHUB_ENV"
        env:
          VITE_APP_TITLE: ${{ vars.INFORMD_APP_TITLE }}
          VITE_API_URL: ${{ vars.INFORMD_API_URL }}
          VITE_AUTH_API_URL: ${{ vars.INFORMD_AUTH_API_URL }}
          VITE_POSTHOG_KEY: ${{ secrets.INFORMD_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.INFORMD_POSTHOG_HOST }}
          VITE_TRIEOH_AUTH_PROJECT_ID: ${{ secrets.INFORMD_AUTH_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Promote informd to production
        if: ${{ env.ARTIFACT == 'informd-ui' }}
        run: pnpm -F informd exec wrangler versions deploy --version-id "$WORKER_VERSION_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & upload version (payssage)
        id: payssage
        if: ${{ env.ARTIFACT == 'payssage-ui' }}
        run: |
          set -euo pipefail
          pnpm -F payssage build
          ID=$(pnpm -F payssage exec wrangler versions upload --tag "$VERSION" --message "release: $ARTIFACT $VERSION" 2>&1 | grep -oE 'Worker Version ID: [a-f0-9-]+' | awk '{print $NF}')
          echo "WORKER_VERSION_ID=$ID" >> "$GITHUB_ENV"
        env:
          VITE_APP_TITLE: ${{ vars.PAYSSAGE_APP_TITLE }}
          VITE_API_URL: ${{ vars.PAYSSAGE_API_URL }}
          VITE_AUTH_API_URL: ${{ vars.PAYSSAGE_AUTH_API_URL }}
          VITE_POSTHOG_KEY: ${{ secrets.PAYSSAGE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.PAYSSAGE_POSTHOG_HOST }}
          VITE_TRIEOH_AUTH_PROJECT_ID: ${{ secrets.PAYSSAGE_AUTH_PROJECT_ID }}
          VITE_SUPPORTED_PROVIDERS: ${{ vars.PAYSSAGE_SUPPORTED_PROVIDERS }}
          VITE_INTENT_TEST_MODE: ${{ vars.PAYSSAGE_INTENT_TEST_MODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Promote payssage to production
        if: ${{ env.ARTIFACT == 'payssage-ui' }}
        run: pnpm -F payssage exec wrangler versions deploy --version-id "$WORKER_VERSION_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & upload version (univents)
        id: univents
        if: ${{ env.ARTIFACT == 'univents-ui' }}
        run: |
          set -euo pipefail
          pnpm -F univents build
          ID=$(pnpm -F univents exec wrangler versions upload --var "VITE_TRIEOH_AUTH_PROJECT_ID:$VITE_TRIEOH_AUTH_PROJECT_ID" --tag "$VERSION" --message "release: $ARTIFACT $VERSION" 2>&1 | grep -oE 'Worker Version ID: [a-f0-9-]+' | awk '{print $NF}')
          echo "WORKER_VERSION_ID=$ID" >> "$GITHUB_ENV"
        env:
          VITE_APP_TITLE: ${{ vars.UNIVENTS_APP_TITLE }}
          VITE_API_URL: ${{ vars.UNIVENTS_API_URL }}
          VITE_AUTH_API_URL: ${{ vars.UNIVENTS_AUTH_API_URL }}
          VITE_STORAGE_URL: ${{ vars.UNIVENTS_STORAGE_URL }}
          VITE_POSTHOG_KEY: ${{ secrets.UNIVENTS_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.UNIVENTS_POSTHOG_HOST }}
          VITE_TRACING_ENABLED: ${{ vars.UNIVENTS_TRACING_ENABLED }}
          VITE_TRIEOH_AUTH_PROJECT_ID: ${{ secrets.UNIVENTS_AUTH_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Promote univents to production
        if: ${{ env.ARTIFACT == 'univents-ui' }}
        run: pnpm -F univents exec wrangler versions deploy --version-id "$WORKER_VERSION_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: release.json (front)
        if: ${{ env.TYPE == 'front' }}
        run: |
          cat <<EOF
          ┌─ release.json ────────────────────────────────────────
          {
            "tag": "$VERSION",
            "artifact": "$ARTIFACT",
            "type": "front",
            "worker_version_id": "$WORKER_VERSION_ID"
          }
          └───────────────────────────────────────────────────────
          EOF

      # ── SDKs: build once → npm publish (version-guarded in checks) ──────
      - name: Build & publish SDK
        if: ${{ env.TYPE == 'sdk' && needs.checks.outputs.sdk-skip != 'true' }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          pnpm --filter "${{ needs.checks.outputs.sdk-name }}" build
          pnpm publish --access public --no-git-checks
          rm -f ~/.npmrc
          echo "[release] published ${{ needs.checks.outputs.sdk-name }}@$VERSION"
        working-directory: sdk/ts/${{ env.SDK_NAME }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: release.json (sdk)
        if: ${{ env.TYPE == 'sdk' }}
        run: |
          cat <<EOF
          ┌─ release.json ────────────────────────────────────────
          {
            "tag": "$VERSION",
            "artifact": "$ARTIFACT",
            "type": "sdk",
            "package": "${{ needs.checks.outputs.sdk-name }}",
            "npm_version": "$VERSION"
          }
          └───────────────────────────────────────────────────────
          EOF
