name: SDK release
# Called by deploy.yml for <sdk>-sdk-ts/v* tags: the gate only. It parses the
# tag, checks it names the package.json version, builds the SDK and scans it,
# and fails like any other release. Publishing stays by hand: npm requires
# staged publishing for these packages (E_STAGE_REQUIRED), approved by a
# person.

on:
  workflow_call:
    outputs:
      artifact:
        value: ${{ jobs.checks.outputs.artifact }}
      lane:
        value: ${{ jobs.checks.outputs.lane }}
      checks-metrics:
        value: ${{ jobs.checks.outputs.metrics }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      artifact: ${{ steps.tag.outputs.artifact }}
      lane: ${{ steps.tag.outputs.lane }}
      metrics: ${{ steps.metrics.outputs.metrics }}
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2

      - name: Parse tag
        id: tag
        uses: ./.github/actions/release/parse-tag
        with:
          expect: sdk

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup/node
        with:
          install: 'true'
          filter: ./${{ steps.tag.outputs.dir }}

      - name: Start Trivy
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          mode: start
          paths: ${{ steps.tag.outputs.dir }} pnpm-lock.yaml

      - name: Version guard
        uses: ./.github/actions/sdk/version-guard
        with:
          dir: ${{ steps.tag.outputs.dir }}
          version: ${{ steps.tag.outputs.version }}

      - name: Build
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
        run: pnpm -F "$PACKAGE" build

      - name: Trivy
        if: steps.tag.outputs.lane == 'full'
        uses: ./.github/actions/scan/trivy
        with:
          mode: finish

      - name: release.json
        uses: ./.github/actions/release/summary
        with:
          release: >-
            {"tag": "${{ steps.tag.outputs.version }}", "type": "sdk", "package": "${{ steps.tag.outputs.package }}",
             "published": "by hand (npm staged publishing)"}

      - name: Flush metrics
        id: metrics
        if: always()
        uses: ./.github/actions/metrics/flush
