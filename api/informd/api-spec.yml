openapi: 3.1.0

info:
  title: Informd API
  summary: Multi-tenant forms service for TrieOH
  description: |
    Informd is TrieOH's forms service: namespaces (tenant grouping),
    forms, steps (sections), fields (question definitions), and
    responses (submissions).

    ## Authentication

    | Scheme | Header | Notes |
    |---|---|---|
    | Bearer JWT | `Authorization: Bearer <token>` | IdentityX access token. |
    | API key | `X-API-KEY: <key>` | IdentityX API key. |

    `anyAuth` endpoints accept either. Namespace routes (`/namespaces...`)
    require a JWT (`jwt` only). The following routes are public:
    `GET /forms/{form_id}/asnwerable` (public answer view — note the
    original spelling, part of the interface) and
    `POST /forms/{form_id}/responses` (public submission).

    ## Response envelope

    Every JSON response is the `fun.Response` envelope:

    ```json
    {
      "code": 200,
      "message": "",
      "data": { "...": "operation payload" },
      "error": null,
      "pagination": null,
      "timestamp": "2026-01-01T12:00:00Z",
      "module": "Informd"
    }
    ```

    - Success: `data` carries the payload. Errors: `error` carries an
      `AppError` — `{ "code", "message", "fields", "meta" }`.
    - `pagination` is reserved for paged list endpoints (currently
      unused by Informd routes).

    ## Error codes → HTTP status

    The `error.code` sentinel maps to the HTTP status:

    | code | status |
    |---|---|
    | `BAD_REQUEST`, `VALIDATION_ERROR` | 400 |
    | `UNAUTHORIZED` | 401 |
    | `PAYMENT_REQUIRED` | 402 |
    | `FORBIDDEN` | 403 |
    | `NOT_FOUND` | 404 |
    | `METHOD_NOT_ALLOWED` | 405 |
    | `CONFLICT` | 409 |
    | `UNPROCESSABLE_ENTITY` | 422 |
    | `TOO_MANY_REQUESTS` | 429 |
    | `INTERNAL_ERROR` | 500 |
    | `NOT_IMPLEMENTED` | 501 |
    | `BAD_GATEWAY` | 502 |
    | `SERVICE_UNAVAILABLE` | 503 |

    ## Form model

    A form has steps, each step has fields, each field may have a select
    configuration (when `type` is `select`). The `full` view
    (`GET /forms/{form_id}/full`) returns the form with steps, fields,
    and their answers; the `asnwerable` view returns the same shape
    without answers, for respondents.

    ### Duplicated namespaced routes

    Several form/step/field operations exist twice: anchored on the form
    (`/forms/{form_id}/...`) and on the namespace
    (`/namespaces/{namespace_id}/forms/{form_id}/...`). Both are live
    routes; the namespaced variants are scheduled for removal (the form
    already anchors via its namespace). Keep using the `/forms/...`
    variants in new code.

    ## Rate limits

    The harness applies a fixed rate limit of 400 requests/second with a
    burst of 20, keyed by client IP. Exceeded requests receive
    `429 TOO_MANY_REQUESTS`.
  version: 0.1.0
  contact:
    name: TrieOH
    url: https://trieoh.com/support
    email: contact@trieoh.com
  license:
    name: TSAL
    url: https://git.trieoh.com/TrieOH/TheTree/src/branch/main/api/informd/LICENSE

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.informd.com.br
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Reserved for system level operations such as /health

  - name: namespaces
    description: Tenant grouping for forms and membership

  - name: forms
    description: Form lifecycle, members, and public views

  - name: steps
    description: Form sections

  - name: fields
    description: Question definitions, including select configurations

  - name: responses
    description: Public form submissions

externalDocs:
  description: Full TrieOH documentation
  url: https://docs.trieoh.com

security:
  - bearerAuth: []

paths:
  /docs/openapi.yml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: Get the OpenAPI specification
      description: |
        Returns this service's OpenAPI 3.1 specification in YAML — the
        same content as api/<svc>/api-spec.yml, embedded and served by
        the harness. Docs tooling fetches this URL to render the API
        reference. Public.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
                description: The OpenAPI 3.1 document in YAML.

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      description: Harness-owned liveness probe. Public.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: "ok"
                  service:
                    type: string
                    const: "Informd"

  /namespaces:
    get:
      tags: [namespaces]
      operationId: listNamespaces
      summary: List your namespaces
      description: |
        Lists the namespaces the authenticated actor is a member of.
        Requires a JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Namespaces the actor belongs to
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Namespace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [namespaces]
      operationId: createNamespace
      summary: Create a namespace
      description: |
        Creates a namespace owned by the authenticated actor. The
        creator becomes the namespace owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamespaceRequest'
            example:
              name: My Workspace
      responses:
        '201':
          description: Namespace created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Namespace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /namespaces/{namespace_id}/members:
    get:
      tags: [namespaces]
      operationId: listNamespaceMembers
      summary: List namespace members
      description: |
        Lists the members of a namespace. The actor must be a member of
        the namespace.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceID'
      responses:
        '200':
          description: Namespace members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamespaceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [namespaces]
      operationId: addNamespaceMember
      summary: Add a namespace member
      description: |
        Adds an actor (by user ID) to the namespace with the given role.
        The actor must be an admin or owner of the namespace.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNamespaceMemberRequest'
            example:
              user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              role: member
      responses:
        '201':
          description: Member added
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [namespaces]
      operationId: removeNamespaceMember
      summary: Remove a namespace member
      description: |
        Removes an actor (by user ID) from the namespace. The actor must
        be an admin or owner of the namespace.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveNamespaceMemberRequest'
            example:
              user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /namespaces/{namespace_id}/forms:
    get:
      tags: [namespaces]
      operationId: listNamespaceForms
      summary: List a namespace's forms
      description: |
        Lists the forms in the namespace (excluding archived). The actor
        must be a member of the namespace.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceID'
      responses:
        '200':
          description: Namespace forms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [namespaces]
      operationId: createNamespaceForm
      summary: Create a form in a namespace
      description: |
        Creates a draft form inside the namespace. The actor must be an
        admin or owner of the namespace.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormRequest'
            example:
              title: Registration Form
      responses:
        '201':
          description: Form created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Form'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /namespaces/{namespace_id}/forms/archived:
    get:
      tags: [namespaces]
      operationId: listNamespaceArchivedForms
      summary: List a namespace's archived forms
      description: |
        Lists the archived forms in the namespace. The actor must be a
        member of the namespace.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceID'
      responses:
        '200':
          description: Archived namespace forms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms:
    get:
      tags: [forms]
      operationId: listMyForms
      summary: List your forms
      description: |
        Lists the forms the authenticated actor owns (excluding
        archived). Accepts JWT or API key.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Forms owned by the actor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [forms]
      operationId: createForm
      summary: Create a form
      description: |
        Creates a draft form owned by the authenticated actor. New forms
        are standalone (no namespace) until moved into one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormRequest'
            example:
              title: Registration Form
      responses:
        '201':
          description: Form created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Form'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/archived:
    get:
      tags: [forms]
      operationId: listMyArchivedForms
      summary: List your archived forms
      description: |
        Lists the archived forms owned by the authenticated actor.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Archived forms owned by the actor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/asnwerable:
    get:
      tags: [forms]
      operationId: getAnswerableForm
      summary: Get the answerable view of a form
      description: |
        Returns the form with its steps and fields (no answers) for
        respondents to fill out. Public — this is the view embedded in
        the public submission flow. NOTE: the path keeps the original
        spelling `asnwerable`, which is part of the interface.
      security: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Answerable form view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FormAnswerable'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/full:
    get:
      tags: [forms]
      operationId: getFullForm
      summary: Get the full form with answers
      description: |
        Returns the form with its steps, fields, and all submitted
        answers — the editing/analytics view. The actor must be a member
        of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Full form view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FullForm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/members:
    get:
      tags: [forms]
      operationId: listFormMembers
      summary: List form members
      description: |
        Lists the members of a form. The actor must be a member of the
        form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Form members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FormMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [forms]
      operationId: addFormMember
      summary: Add a form member
      description: |
        Adds an actor (by user ID) to the form with the given role. The
        actor must be an admin or owner of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFormMemberRequest'
            example:
              user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              role: admin
      responses:
        '201':
          description: Member added
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [forms]
      operationId: removeFormMember
      summary: Remove a form member
      description: |
        Removes an actor (by user ID) from the form. The actor must be
        an admin or owner of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveFormMemberRequest'
            example:
              user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/open:
    post:
      tags: [forms]
      operationId: openForm
      summary: Open a form
      description: |
        Moves a draft form to `open`, allowing public submissions. The
        actor must be an admin or owner of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Form opened
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/close:
    post:
      tags: [forms]
      operationId: closeForm
      summary: Close a form
      description: |
        Moves an open form to `closed`, stopping submissions. The actor
        must be an admin or owner of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Form closed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/archive:
    post:
      tags: [forms]
      operationId: archiveForm
      summary: Archive a form
      description: |
        Archives a closed form, moving it out of active listings. The
        actor must be an admin or owner of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Form archived
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/redraft:
    post:
      tags: [forms]
      operationId: redraftForm
      summary: Redraft a form
      description: |
        Moves an archived (or closed) form back to `draft` for editing.
        The actor must be an admin or owner of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Form redrafted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/responses/count:
    get:
      tags: [forms]
      operationId: getFormResponseCount
      summary: Count a form's responses
      description: |
        Returns the number of responses submitted to the form. The actor
        must be a member of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Response count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [count]
                        properties:
                          count:
                            type: integer
                            description: Number of responses.
              example:
                code: 200
                message: ""
                data:
                  count: 42
                timestamp: '2026-01-01T12:00:00Z'
                module: Informd
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /forms/{form_id}/steps:
    get:
      tags: [steps]
      operationId: listSteps
      summary: List a form's steps
      description: |
        Lists the steps (sections) of a form in positional order. The
        actor must be a member of the form.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormID'
      responses:
        '200':
          description: Form steps
          content:
            application/json:
              schema:
