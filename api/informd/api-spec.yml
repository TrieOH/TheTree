openapi: 3.1.0

info:
  title: Informd API
  summary: Multi-tenant forms service for TrieOH
  description: |
    Informd is TrieOH's forms service: namespaces (tenant grouping),
    forms, steps (sections), fields (question definitions), and
    responses (submissions).

    ## Authentication

    | Scheme | Header | Notes |
    |---|---|---|
    | Bearer JWT | `Authorization: Bearer <token>` | IdentityX access token. |
    | API key | `X-API-KEY: <key>` | IdentityX API key. |

    `anyAuth` endpoints accept either. Namespace routes (`/namespaces...`)
    require a JWT (`jwt` only). The following routes are public:
    `GET /forms/{form_id}/asnwerable` (public answer view — note the
    original spelling, part of the interface) and
    `POST /forms/{form_id}/responses` (public submission).

    ## Responses

    A successful response's body is the operation's payload itself; an
    operation with nothing to return answers `204 No Content`. A list is
    an object, `{ "items": [ ... ] }`, so paging fields can sit beside the
    items later.

    A failed response's body is an RFC 9457 problem, served as
    `application/problem+json`:

    ```json
    {
      "type": "https://api.informd.trieoh.com/problems/validation",
      "status": 400,
      "title": "Validation Failed",
      "detail": "invalid request body: name: this field is required",
      "instance": "/namespaces",
      "errors": [{ "field": "name", "message": "this field is required" }]
    }
    ```

    `type` identifies the problem and resolves to its documentation;
    `title` and `status` are fixed per problem, `detail` says what went
    wrong this time, and `instance` is the request path. `errors` is
    present only when the failure names request fields. Each operation
    lists the problems it can answer with; a 500 reads `Internal Server
    Error`.

    ## Form model

    A form has steps, each step has fields, each field may have a select
    configuration (when `type` is `select`). The `full` view
    (`GET /forms/{form_id}/full`) returns the form with steps, fields,
    and their answers; the `asnwerable` view returns the same shape
    without answers, for respondents.

    ### Duplicated namespaced routes

    Several form/step/field operations exist twice: anchored on the form
    (`/forms/{form_id}/...`) and on the namespace
    (`/namespaces/{namespace_id}/forms/{form_id}/...`). Both are live
    routes; the namespaced variants are scheduled for removal (the form
    already anchors via its namespace). Keep using the `/forms/...`
    variants in new code.

    ## Rate limits

    The harness applies a fixed rate limit of 400 requests/second with a
    burst of 20, keyed by client IP. Exceeded requests receive
    `429 TOO_MANY_REQUESTS`.
  version: 0.0.0-dev # set from the release tag when bundled (tools/go/problemgen)
  contact:
    name: TrieOH
    url: https://trieoh.com/support
    email: contact@trieoh.com
  license:
    name: TSAL
    url: https://github.com/TrieOH/TheTree/blob/main/api/informd/LICENSE

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.informd.trieoh.com
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Reserved for system level operations such as /health

  - name: namespaces
    description: Tenant grouping for forms and membership

  - name: forms
    description: Form lifecycle, members, and public views

  - name: steps
    description: Form sections

  - name: fields
    description: Question definitions, including select configurations

  - name: responses
    description: Public form submissions

externalDocs:
  description: Full TrieOH documentation
  url: https://docs.trieoh.com

security:
  - bearerAuth: []

paths:
  /docs/openapi.yml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: Get the OpenAPI specification
      description: |
        Returns this service's OpenAPI 3.1 specification in YAML — the
        same content as api/<svc>/api-spec.yml, embedded and served by
        the harness. Docs tooling fetches this URL to render the API
        reference. Public.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
                description: The OpenAPI 3.1 document in YAML.

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      description: Harness-owned liveness probe. Public.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: "ok"
                  service:
                    type: string
                    const: "Informd"

  /namespaces:
    $ref: './internal/features/namespaces/spec.yml#/paths/~1namespaces'

  /namespaces/{namespace_id}/members:
    $ref: './internal/features/namespaces/spec.yml#/paths/~1namespaces~1{namespace_id}~1members'

  /namespaces/{namespace_id}/forms:
    $ref: './internal/features/namespaces/spec.yml#/paths/~1namespaces~1{namespace_id}~1forms'

  /namespaces/{namespace_id}/forms/archived:
    $ref: './internal/features/namespaces/spec.yml#/paths/~1namespaces~1{namespace_id}~1forms~1archived'

  /forms:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms'

  /forms/archived:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1archived'

  /forms/{form_id}/asnwerable:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1{form_id}~1asnwerable'

  /forms/{form_id}/full:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1{form_id}~1full'

  /forms/{form_id}/members:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1{form_id}~1members'

  /forms/{form_id}/open:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1{form_id}~1open'

  /forms/{form_id}/close:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1{form_id}~1close'

  /forms/{form_id}/archive:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1{form_id}~1archive'

  /forms/{form_id}/redraft:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1{form_id}~1redraft'

  /forms/{form_id}/responses/count:
    $ref: './internal/features/forms/spec.yml#/paths/~1forms~1{form_id}~1responses~1count'

  /forms/{form_id}/steps:
    $ref: './internal/features/steps/spec.yml#/paths/~1forms~1{form_id}~1steps'

  /forms/{form_id}/steps/{step_id}/fields:
    $ref: './internal/features/fields/spec.yml#/paths/~1forms~1{form_id}~1steps~1{step_id}~1fields'

  /forms/{form_id}/steps/{step_id}/fields/{field_id}/select:
    $ref: './internal/features/fields/spec.yml#/paths/~1forms~1{form_id}~1steps~1{step_id}~1fields~1{field_id}~1select'

  /forms/{form_id}/steps/{step_id}/fields/{field_id}:
    $ref: './internal/features/fields/spec.yml#/paths/~1forms~1{form_id}~1steps~1{step_id}~1fields~1{field_id}'

  /forms/{form_id}/responses:
    $ref: './internal/features/responses/spec.yml#/paths/~1forms~1{form_id}~1responses'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by IdentityX, signed with Ed25519
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Static IdentityX API key

  parameters:
    FormID:
      name: form_id
      in: path
      required: true
      description: Form ID.
      schema:
        $ref: '#/components/schemas/UUID'

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    NullableUUID:
      type: [ string, "null" ]
      format: uuid
      x-go-type: '*uuid.UUID'
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: uuid

    FormStatus:
      x-go-type: models.FormStatus
      x-go-type-import:
        path: Informd/models
      type: string
      enum: [draft, open, closed, archived]

    Form:
      x-go-type: models.Form
      x-go-type-import:
        path: Informd/models
      type: object
      description: A form. Mirrors `models.Form`.
      required: [id, owner_id, created_by, title, status, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        namespace_id:
          $ref: '#/components/schemas/NullableUUID'
        owner_id:
          $ref: '#/components/schemas/UUID'
        created_by:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        status:
          $ref: '#/components/schemas/FormStatus'
        opened_at:
          type: [ string, "null" ]
          format: date-time
        closed_at:
          type: [ string, "null" ]
          format: date-time
        archived_at:
          type: [ string, "null" ]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateFormRequest:
      type: object
      description: Request body for form creation. Mirrors `models.CreateFormRequest`.
      required: [title]
      properties:
        title:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string

    Step:
      x-go-type: models.Step
      x-go-type-import:
        path: Informd/models
      type: object
      description: A section of a form. Mirrors `models.Step`.
      required: [id, form_id, title, position_hint]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        form_id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
        description:
          type: [ string, "null" ]
        position_hint:
          type: integer
          minimum: 1
          description: Ordering hint (1-based).

    FieldType:
      x-go-type: models.FieldType
      x-go-type-import:
        path: Informd/models
      type: string
      enum: [string, email, int, float, bool, date, time, datetime, select, file, phone, url]

    Field:
      x-go-type: models.Field
      x-go-type-import:
        path: Informd/models
      type: object
      description: A question definition. Mirrors `models.Field`.
      required: [id, step_id, key, title, position_hint, required, type, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        step_id:
          $ref: '#/components/schemas/UUID'
        key:
          type: string
          description: Stable identifier for the field within the form.
        title:
          type: string
        description:
          type: [ string, "null" ]
        position_hint:
          type: integer
          minimum: 1
        required:
          type: boolean
        type:
          $ref: '#/components/schemas/FieldType'
        placeholder:
          type: [ object, "null" ]
          description: Placeholder value, when the field type supports it.
        default_value:
          type: [ object, "null" ]
        config:
          type: [ object, "null" ]
          description: Type-specific configuration.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SelectBehaviour:
      x-go-type: models.SelectBehaviour
      x-go-type-import:
        path: Informd/models
      type: string
      enum: [checkbox, radio, dropdown-checkbox, dropdown-radio]

    SelectValueType:
      x-go-type: models.SelectValueType
      x-go-type-import:
        path: Informd/models
      type: string
      enum: [string, email, int, float, date, time, datetime, phone, url]

    FieldSelectConfig:
      x-go-type: models.FieldSelectConfig
      x-go-type-import:
        path: Informd/models
      type: object
      description: Select configuration for a `select` field. Mirrors `models.FieldSelectConfig`.
      required: [field_id, behaviour, value_type, options]
      properties:
        field_id:
          $ref: '#/components/schemas/UUID'
        behaviour:
          $ref: '#/components/schemas/SelectBehaviour'
        value_type:
          $ref: '#/components/schemas/SelectValueType'
        options:
          type: array
          description: |
            The selectable options. Opaque per the API contract (the Go
            model stores them as JSON); conventionally objects with
            `label` and `value`, where `value` is a string or number
            matching `value_type`.
          items:
            type: object
            additionalProperties: true
