# This Backend's own problems (ADR-0019); the shared ones are in
# api/problems.yml, which documents the shape. tools/problemgen generates
# them into internal/problems and bundles them into api-spec.gen.yml.
components:
  schemas:

    NamespaceOwnerAlreadyInForm:
      x-problem:
        slug: namespace-owner-already-in-form
        status: 400
        title: Namespace Owner Already In Form
        description: "Owner of the namespace is already a member of the form."
        error: ErrNamespaceOwnerAlreadyInForm
        message: "The namespace's owner already has access to every form in it, so they can't be added as a member."
    NamespaceMemberAlreadyInForm:
      x-problem:
        slug: namespace-member-already-in-form
        status: 400
        title: Namespace Member Already In Form
        description: "Namespace member is already a member of the form."
        error: ErrNamespaceMemberAlreadyInForm
        message: "This person already has access to the form through its namespace. Change their namespace role instead."
    RemoveNamespaceOwnerFromForm:
      x-problem:
        slug: remove-namespace-owner-from-form
        status: 400
        title: Remove Namespace Owner From Form
        description: "Cannot remove owner of the namespace from form."
        error: ErrRemoveNamespaceOwnerFromForm
        message: "The namespace's owner has access to every form in it and can't be removed from one."
    RemoveNamespaceMemberFromForm:
      x-problem:
        slug: remove-namespace-member-from-form
        status: 400
        title: Remove Namespace Member From Form
        description: "Cannot remove namespace member from form."
        error: ErrRemoveNamespaceMemberFromForm
        message: "This person has access to the form through its namespace. Remove them from the namespace instead."

    # not found

    # constraints
    FormNameTaken:
      x-problem:
        slug: form-name-taken
        status: 409
        title: Form Name Taken
        description: "A form with this name already exists in this namespace."
        error: ErrFormNameTaken
        message: "This namespace already has a form with this name. Choose a different name."
    APIKeyNameTaken:
      x-problem:
        slug: api-key-name-taken
        status: 409
        title: API Key Name Taken
        description: "An API key with this name already exists."
        error: ErrAPIKeyNameTaken
        message: "An API key with this name already exists. Choose a different name."
    FieldKeyTaken:
      x-problem:
        slug: field-key-taken
        status: 409
        title: Field Key Taken
        description: "A field with this key already exists in this step."
        error: ErrFieldKeyTaken
        message: "This step already has a field with this key, and keys are unique within a step. Choose a different key."
    NamespaceNameTaken:
      x-problem:
        slug: namespace-name-taken
        status: 409
        title: Namespace Name Taken
        description: "A namespace with this name already exists."
        error: ErrNamespaceNameTaken
        message: "A namespace with this name already exists. Choose a different name."
    FieldAlreadyAnswered:
      x-problem:
        slug: field-already-answered
        status: 409
        title: Field Already Answered
        description: "This field already has an answer in this response."
        error: ErrFieldAlreadyAnswered
        message: "This response already has an answer for this field. Update that answer instead of adding another."
    ResponderEmailTaken:
      x-problem:
        slug: responder-email-taken
        status: 409
        title: Responder Email Taken
        description: "A responder with this email already exists on this system."
        error: ErrResponderEmailTaken
        message: "A responder with this email already exists. Reuse that responder instead of creating another."
    InviteTokenTaken:
      x-problem:
        slug: invite-token-taken
        status: 409
        title: Invite Token Taken
        description: "An invite with this token already exists."
        error: ErrInviteTokenTaken
        message: "An invite with this token already exists. Create the invite again to get a new token."
