    name: TSAL
    url: https://github.com/TrieOH/TheTree/blob/main/api/payssage/LICENSE

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.payssage.trieoh.com
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Reserved for system level operations such as /health

  - name: orgs
    description: Organization lifecycle and membership

  - name: wallets
    description: Payment wallets — fee configuration, sandbox state, collector binding

  - name: collectors
    description: Payment-provider accounts that receive funds

  - name: sellers
    description: Payment-provider accounts that split transactions

  - name: intents
    description: Payment intents — checkout, cancellation, and status tracking

  - name: oauth
    description: Payment-provider OAuth connections (MercadoPago connect)

  - name: webhooks
    description: Provider webhook ingestion, endpoint/event/delivery management

  - name: testmode
    description: Test-mode operations (sandbox helpers)

externalDocs:
  description: Full TrieOH documentation
  url: https://docs.trieoh.com

security:
  - bearerAuth: []

paths:
  /docs/openapi.yml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: Get the OpenAPI specification
      description: |
        Returns this service's OpenAPI 3.1 specification in YAML — the
        same content as api/<svc>/api-spec.yml, embedded and served by
        the harness. Docs tooling fetches this URL to render the API
        reference. Public.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
                description: The OpenAPI 3.1 document in YAML.

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      description: Harness-owned liveness probe. Public.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: "ok"
                  service:
                    type: string
                    const: "Payssage"

  /organizations:
    $ref: './internal/features/orgs/spec.yml#/paths/~1organizations'

  /organizations/{organization_id}/members:
    $ref: './internal/features/orgs/spec.yml#/paths/~1organizations~1{organization_id}~1members'

  /organizations/{organization_id}/member/{member_id}:
    $ref: './internal/features/orgs/spec.yml#/paths/~1organizations~1{organization_id}~1member~1{member_id}'

  /organizations/{organization_id}/member/{member_email}:by_email:
    $ref: './internal/features/orgs/spec.yml#/paths/~1organizations~1{organization_id}~1member~1{member_email}:by_email'

  /wallets:
    $ref: './internal/features/wallets/spec.yml#/paths/~1wallets'

  /wallets/{wallet_id}:
    $ref: './internal/features/wallets/spec.yml#/paths/~1wallets~1{wallet_id}'

  /wallets/{wallet_id}/fee:
    $ref: './internal/features/wallets/spec.yml#/paths/~1wallets~1{wallet_id}~1fee'

  /wallets/{wallet_id}/sandbox:
    $ref: './internal/features/wallets/spec.yml#/paths/~1wallets~1{wallet_id}~1sandbox'

  /wallets/{wallet_id}/collector:
    $ref: './internal/features/wallets/spec.yml#/paths/~1wallets~1{wallet_id}~1collector'

  /organizations/{organization_id}/wallets:
    $ref: './internal/features/wallets/spec.yml#/paths/~1organizations~1{organization_id}~1wallets'

  /collectors:
    $ref: './internal/features/collectors/spec.yml#/paths/~1collectors'

  /collectors/{collector_id}:
    $ref: './internal/features/collectors/spec.yml#/paths/~1collectors~1{collector_id}'

  /organizations/{organization_id}/collectors:
    $ref: './internal/features/collectors/spec.yml#/paths/~1organizations~1{organization_id}~1collectors'

  /wallets/{wallet_id}/sellers:
    $ref: './internal/features/sellers/spec.yml#/paths/~1wallets~1{wallet_id}~1sellers'

  /intents:
    $ref: './internal/features/intents/spec.yml#/paths/~1intents'

  /intents/{intent_id}:
    $ref: './internal/features/intents/spec.yml#/paths/~1intents~1{intent_id}'

  /intents/{intent_id}/cancel:
    $ref: './internal/features/intents/spec.yml#/paths/~1intents~1{intent_id}~1cancel'

  /intents/{intent_id}/refund:
    $ref: './internal/features/intents/spec.yml#/paths/~1intents~1{intent_id}~1refund'

  /wallets/{wallet_id}/intents:
    $ref: './internal/features/intents/spec.yml#/paths/~1wallets~1{wallet_id}~1intents'

  /organizations/{organization_id}/intents:
    $ref: './internal/features/intents/spec.yml#/paths/~1organizations~1{organization_id}~1intents'

  /testmode/intents/create:
    $ref: './internal/features/intents/spec.yml#/paths/~1testmode~1intents~1create'

  /testmode/intents/{intent_id}/refund:
    $ref: './internal/features/intents/spec.yml#/paths/~1testmode~1intents~1{intent_id}~1refund'

  /providers/{provider}/connect:
    $ref: './internal/features/oauth/spec.yml#/paths/~1providers~1{provider}~1connect'

  /providers/{provider}/callback:
    $ref: './internal/features/oauth/spec.yml#/paths/~1providers~1{provider}~1callback'

  /providers/{provider}/revoke:
    $ref: './internal/features/oauth/spec.yml#/paths/~1providers~1{provider}~1revoke'

  /webhooks/{provider}:
    $ref: './internal/features/webhooks/spec.yml#/paths/~1webhooks~1{provider}'

  /wallets/{wallet_id}/webhooks/endpoints:
    $ref: './internal/features/webhook_endpoints/spec.yml#/paths/~1wallets~1{wallet_id}~1webhooks~1endpoints'

  /webhooks/endpoints/{endpoint_id}:
    $ref: './internal/features/webhook_endpoints/spec.yml#/paths/~1webhooks~1endpoints~1{endpoint_id}'

  /wallets/{wallet_id}/webhooks/events:
    $ref: './internal/features/webhook_events/spec.yml#/paths/~1wallets~1{wallet_id}~1webhooks~1events'

  /webhooks/events/{event_id}:
    $ref: './internal/features/webhook_events/spec.yml#/paths/~1webhooks~1events~1{event_id}'

  /webhooks/endpoints/{endpoint_id}/deliveries:
    $ref: './internal/features/webhook_deliveries/spec.yml#/paths/~1webhooks~1endpoints~1{endpoint_id}~1deliveries'

  /webhooks/deliveries/{delivery_id}:
    $ref: './internal/features/webhook_deliveries/spec.yml#/paths/~1webhooks~1deliveries~1{delivery_id}'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by IdentityX, signed with Ed25519
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: IdentityX access API key resolving to a service actor (server-to-server calls)

  parameters:
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Organization ID.
      schema:
        $ref: '#/components/schemas/UUID'
    WalletID:
      name: wallet_id
      in: path
      required: true
      description: Wallet ID.
      schema:
        $ref: '#/components/schemas/UUID'
    EndpointID:
      name: endpoint_id
      in: path
      required: true
      description: Webhook endpoint ID.
      schema:
        $ref: '#/components/schemas/UUID'
    Provider:
      name: provider
      in: path
      required: true
      description: Payment provider slug (e.g. `mercadopago`).
      schema:
        type: string

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    NullableUUID:
      type: [ string, "null" ]
      format: uuid
      x-go-type: '*uuid.UUID'
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: uuid
