# This Backend's own problems (ADR-0019); the shared ones are in
# api/problems.yml, which documents the shape. tools/problemgen generates
# them into internal/problems and bundles them into api-spec.gen.yml.
components:
  schemas:
    NotResourceOwner:
      x-problem:
        slug: not-resource-owner
        status: 403
        title: Not Resource Owner
        description: "Insufficient permissions."
        error: ErrNotResourceOwner
        detail: "this resource belongs to someone else's personal account, and only its owner may change it"

    ProviderRequestFailed:
      x-problem:
        slug: provider-request-failed
        status: 502
        title: Provider Request Failed
        description: "Payment provider request failed."
        # ErrProviderRequestFailed is a provider call that never got an answer
        # (network, timeout); the transport error is wrapped for the logs.
        error: ErrProviderRequestFailed
        detail: "the payment provider didn't answer (a network error or a timeout), so nothing changed on its side; retry in a moment"
    UnsupportedProvider:
      x-problem:
        slug: unsupported-provider
        status: 400
        title: Unsupported Provider
        description: "Payssage has no payment provider by this name."
        error: UnsupportedProviderError
        detail: 'unsupported provider {provider}'
      type: object
      required: [provider]
      properties:
        provider: { type: string, description: "The provider's name." }
    ProviderUnauthorized:
      x-problem:
        slug: provider-unauthorized
        status: 401
        title: Provider Unauthorized
        description: "The payment provider refused Payssage's credentials."
      type: object
      required: [provider, reason]
      properties:
        provider: { type: string, description: "The provider's name." }
        reason: { type: string, description: "Payssage's reading of the provider's cause, or empty." }
    ProviderNotFound:
      x-problem:
        slug: provider-not-found
        status: 404
        title: Provider Not Found
        description: "The payment provider does not know the resource."
      type: object
      required: [provider, reason]
      properties:
        provider: { type: string, description: "The provider's name." }
        reason: { type: string, description: "Payssage's reading of the provider's cause, or empty." }
    ProviderConflict:
      x-problem:
        slug: provider-conflict
        status: 409
        title: Provider Conflict
        description: "The payment provider answered with a conflict."
      type: object
      required: [provider, reason]
      properties:
        provider: { type: string, description: "The provider's name." }
        reason: { type: string, description: "Payssage's reading of the provider's cause, or empty." }
    ProviderRateLimited:
      x-problem:
        slug: provider-rate-limited
        status: 429
        title: Provider Rate Limited
        description: "The payment provider is rate limiting Payssage; retry later."
      type: object
      required: [provider, reason]
      properties:
        provider: { type: string, description: "The provider's name." }
        reason: { type: string, description: "Payssage's reading of the provider's cause, or empty." }
    ProviderUnavailable:
      x-problem:
        slug: provider-unavailable
        status: 502
        title: Provider Unavailable
        description: "The payment provider failed on its side."
      type: object
      required: [provider, reason]
      properties:
        provider: { type: string, description: "The provider's name." }
        reason: { type: string, description: "Payssage's reading of the provider's cause, or empty." }
    ProviderRejected:
      x-problem:
        slug: provider-rejected
        status: 400
        title: Provider Rejected
        description: "The payment provider rejected the request."
      type: object
      required: [provider, reason]
      properties:
        provider: { type: string, description: "The provider's name." }
        reason: { type: string, description: "Payssage's reading of the provider's cause, or empty." }
    NoTransactionToRefund:
      x-problem:
        slug: no-transaction-to-refund
        status: 409
        title: No Transaction To Refund
        description: "Intent has no mercadopago transaction to refund."
        error: ErrNoTransactionToRefund
        detail: "this intent never reached the payment provider, so there is no payment to refund"
    NoTransactionToCancel:
      x-problem:
        slug: no-transaction-to-cancel
        status: 409
        title: No Transaction To Cancel
        description: "Intent has no mercadopago transaction to cancel."
        error: ErrNoTransactionToCancel
        detail: "this intent never reached the payment provider, so there is no payment to cancel"
    IntentStatus:
      x-problem:
        slug: intent-status
        status: 400
        title: Intent Status
        description: "The intent's status does not allow the action."
        error: IntentStatusError
        detail: 'intent cannot be {action} from status "{intent_status}"'
      type: object
      required: [action, intent_status]
      properties:
        action: { type: string, description: "The refused action, such as refunded or cancelled." }
        intent_status: { type: string, description: "The intent's current status." }
    SellerRevokedCheckout:
      x-problem:
        slug: seller-revoked-checkout
        status: 403
        title: Seller Revoked
        description: "The seller revoked Payssage's access, so it cannot be charged."
      type: object
      required: [seller_id]
      properties:
        seller_id: { type: string, format: uuid, description: "The seller." }
    SellerRevoked:
      x-problem:
        slug: seller-revoked
        status: 409
        title: Seller Revoked
        description: "The seller revoked Payssage's access, so the payment cannot be refunded or cancelled here; it needs manual handling at the provider."
      type: object
      required: [seller_id]
      properties:
        seller_id: { type: string, format: uuid, description: "The seller." }
    SellerProviderMismatch:
      x-problem:
        slug: seller-provider-mismatch
        status: 409
        title: Seller Provider Mismatch
        description: "The seller is connected through another payment provider."
        error: SellerProviderMismatchError
        detail: 'seller {seller_id} is not a mercadopago seller (got "{provider}")'
      type: object
      required: [seller_id, provider]
      properties:
        seller_id: { type: string, format: uuid, description: "The seller." }
        provider: { type: string, description: "The provider's name." }

    WebhookPayloadInvalid:
      x-problem:
        slug: webhook-payload-invalid
        status: 400
        title: Webhook Payload Invalid
        description: "Mercadopago webhook: invalid payload."
        error: ErrWebhookPayloadInvalid
        detail: "the MercadoPago webhook's body isn't the JSON MercadoPago sends, so it was ignored"
    WebhookMissingDataID:
      x-problem:
        slug: webhook-missing-data-id
        status: 400
        title: Webhook Missing Data ID
        description: "Mercadopago webhook: missing data.id."
        error: ErrWebhookMissingDataID
        detail: "the MercadoPago webhook has no data.id, so Payssage can't tell which payment it is about"
    WebhookSignatureMissing:
      x-problem:
        slug: webhook-signature-missing
        status: 401
        title: Webhook Signature Missing
        description: "Mercadopago webhook: missing ts or v1 in x-signature header."
        error: ErrWebhookSignatureMissing
        detail: "the MercadoPago webhook's x-signature header lacks its ts or v1 part, so it can't be verified and was rejected"
    WebhookSignatureMismatch:
      x-problem:
        slug: webhook-signature-mismatch
        status: 401
        title: Webhook Signature Mismatch
        description: "Mercadopago webhook: signature mismatch."
        error: ErrWebhookSignatureMismatch
        detail: "the MercadoPago webhook's signature doesn't match its content and Payssage's secret, so it was rejected as forged or altered"
    UnhandledWebhookEvent:
      x-problem:
        slug: unhandled-webhook-event
        status: 404
        title: Unhandled Webhook Event
        description: "Payssage does not handle this webhook event type."
        error: UnhandledWebhookEventError
        detail: 'mercadopago webhook: unhandled event type "{event_type}"'
      type: object
      required: [event_type]
      properties:
        event_type: { type: string, description: "The event type." }
    WebhookIntentNotFound:
      x-problem:
        slug: webhook-intent-not-found
        status: 404
        title: Webhook Intent Not Found
        description: "No intent was created for the webhook's payment."
        error: WebhookIntentNotFoundError
        detail: 'mercadopago webhook: no intent found for payment {payment_id}'
      type: object
      required: [payment_id]
      properties:
        payment_id: { type: string, description: "The provider's payment." }
    WebhookSellerTokenMissing:
      x-problem:
        slug: webhook-seller-token-missing
        status: 409
        title: Webhook Seller Token Missing
        description: "The intent's seller has no provider access token, so the webhook cannot be resolved."
        error: WebhookSellerTokenMissingError
        detail: 'seller {seller_id} has no mercadopago access token; cannot resolve webhook for intent {intent_id}'
      type: object
      required: [seller_id, intent_id]
      properties:
        seller_id: { type: string, format: uuid, description: "The seller." }
        intent_id: { type: string, format: uuid, description: "The intent." }

    # not found

    # constraints
    OrgWalletNameTaken:
      x-problem:
        slug: org-wallet-name-taken
        status: 409
        title: Org Wallet Name Taken
        description: "A wallet with this name already exists in this organization."
        error: ErrOrgWalletNameTaken
        detail: "this organization already has a wallet with this name; choose a different name"
    PersonalWalletTaken:
      x-problem:
        slug: personal-wallet-taken
        status: 409
        title: Personal Wallet Taken
        description: "A wallet with this name already exists."
        error: ErrPersonalWalletTaken
        detail: "you already have a personal wallet with this name; choose a different name"
    DeliveryExists:
      x-problem:
        slug: delivery-exists
        status: 409
        title: Delivery Exists
        description: "A delivery for this event and endpoint already exists."
        error: ErrDeliveryExists
        detail: "this event was already queued for delivery to this endpoint; it is delivered once"
    WebhookEventExists:
      x-problem:
        slug: webhook-event-exists
        status: 409
        title: Webhook Event Exists
        description: "A webhook event for this external id and type already exists for this provider."
        error: ErrWebhookEventExists
        detail: "this provider event was already received, so the duplicate was ignored"
    OrgSlugTaken:
      x-problem:
        slug: org-slug-taken
        status: 409
        title: Org Slug Taken
        description: "An organization with this slug already exists."
        error: ErrOrgSlugTaken
        detail: "another organization already uses this slug, and slugs are unique; choose a different slug"
    OrgCollectorConnected:
      x-problem:
        slug: org-collector-connected
        status: 409
        title: Org Collector Connected
        description: "This collector is already connected to this organization."
        error: ErrOrgCollectorConnected
        detail: "this provider account is already connected to the organization as a collector; use the existing collector"
    PersonalCollectorConnected:
      x-problem:
        slug: personal-collector-connected
        status: 409
        title: Personal Collector Connected
        description: "This collector is already connected to your account."
        error: ErrPersonalCollectorConnected
        detail: "this provider account is already connected to your account as a collector; use the existing collector"
    SellerConnected:
      x-problem:
        slug: seller-connected
        status: 409
        title: Seller Connected
        description: "This seller is already connected to this wallet."
        error: ErrSellerConnected
        detail: "this provider account is already connected to the wallet as a seller; use the existing seller"

    # providerStatus answers a provider's own error by what the provider said:

    # its auth failures are ours to fix (401), a provider outage is a bad

    # gateway, and its 4xx answers pass through.

# Named errors answered by a shared problem (api/problems.yml), each
# with its text as the detail. tools/problemgen generates them into
# errs/errs.gen.go, and Mapper answers them.
x-shared-errors:
  not-found:
    ErrOAuthStateNotFound: "OAuth state not found; start the connection again"
    ErrWebhookEventNotFound: "webhook event not found"
    ErrWalletNotFound: "wallet not found"
    ErrWebhookEndpointNotFound: "webhook endpoint not found"
    ErrIntentNotFound: "intent not found"
    ErrOrganizationNotFound: "organization not found"
    ErrCollectorNotFound: "collector not found"
    ErrWebhookDeliveryNotFound: "webhook delivery not found"
    ErrSellerNotFound: "seller not found"
  validation:
    ErrInvalidAmount: "amount must be greater than zero"
    ErrInvalidIntentStatus: "intent status must be one of: pending, processing, succeeded, cancelled, failed, rejected, refunded"
    ErrInvalidIntentStatusDetail: "intent status detail must be empty or one of: insufficient_funds, high_risk, invalid_card, card_disabled, expired_card, invalid_security_code, pending_review, other"
    ErrInvalidOAuthFlowType: "OAuth flow must be one of: collector, seller"
    ErrInvalidOrgRole: "organization role must be one of: owner, admin, member"
    ErrNegativeFee: "fee (bps) must be non-negative"
    ErrInvalidDeliveryStatus: "webhook delivery status must be one of: pending, delivered, failed"
