    ProjectProfileSchemaExists:
      x-problem:
        slug: project-profile-schema-exists
        status: 409
        title: Project Profile Schema Exists
        description: "A profile schema already exists for this project."
    ProfileSchemaVersionExists:
      x-problem:
        slug: profile-schema-version-exists
        status: 409
        title: Profile Schema Version Exists
        description: "This profile schema version already exists for the scope."
    PlatformSchemaVersionExists:
      x-problem:
        slug: platform-schema-version-exists
        status: 409
        title: Platform Schema Version Exists
        description: "A platform profile schema version already exists."
    HandleTaken:
      x-problem:
        slug: handle-taken
        status: 409
        title: Handle Taken
        description: "This handle is already in use by another profile."
    EmailTemplateExists:
      x-problem:
        slug: email-template-exists
        status: 409
        title: Email Template Exists
        description: "This project already has an email template of this kind."
    TosAlreadyExists:
      x-problem:
        slug: tos-already-exists
        status: 409
        title: ToS Already Exists
        description: "This project already has terms of service."
    TosAlreadyAccepted:
      x-problem:
        slug: tos-already-accepted
        status: 409
        title: ToS Already Accepted
        description: "This actor has already accepted this terms version."
    AlreadyBlacklisted:
      x-problem:
        slug: already-blacklisted
        status: 409
        title: Already Blacklisted
        description: "This target is already blacklisted for this scope."
