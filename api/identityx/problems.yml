# This Backend's own problems (ADR-0019); the shared ones are in
# api/problems.yml, which documents the shape. tools/problemgen generates
# them into internal/problems and bundles them into api-spec.gen.yml.
components:
  schemas:
    # identity and tokens
    PlatformOnly:
      x-problem:
        slug: platform-only
        status: 401
        title: Platform Only
        description: "Platform-level authentication required."
        error: ErrPlatformOnly
        detail: "this operation manages the IdentityX platform itself, and the caller is scoped to a project; sign in with a platform account (one with no project) and try again"
    InvalidAccessToken:
      x-problem:
        slug: invalid-access-token
        status: 401
        title: Invalid Access Token
        description: "Invalid access token."
        error: ErrInvalidAccessToken
        detail: "the access token could not be verified: it is malformed, signed with the wrong algorithm, or its signature does not match; sign in again to get a new one"
    MissingKID:
      x-problem:
        slug: missing-kid
        status: 401
        title: Missing KID
        description: "Missing kid."
        error: ErrMissingKID
        detail: "the token's header has no kid, so IdentityX can't tell which key signed it; use a token IdentityX issued, unmodified"
    InvalidKID:
      x-problem:
        slug: invalid-kid
        status: 401
        title: Invalid KID
        description: "Invalid kid."
        error: ErrInvalidKID
        detail: "the token's kid is not a key id IdentityX issues (it must be a UUID); use a token IdentityX issued, unmodified"
    OutdatedToken:
      x-problem:
        slug: outdated-token
        status: 401
        title: Outdated Token
        description: "Outdated token."
        error: ErrOutdatedToken
        detail: "the key that signed this token no longer exists, so the token can't be verified; sign in again to get a token signed with a current key"
    SigningKeyRevoked:
      x-problem:
        slug: signing-key-revoked
        status: 401
        title: Signing Key Revoked
        description: "Token signing key revoked."
        error: ErrSigningKeyRevoked
        detail: "the key that signed this token was revoked, so every token it signed is rejected; sign in again to get a new token"
    SigningKeyRetired:
      x-problem:
        slug: signing-key-retired
        status: 401
        title: Signing Key Retired
        description: "Token signing key retired."
        error: ErrSigningKeyRetired
        detail: "the key that signed this token was rotated out and its grace period has ended; refresh or sign in again to get a token signed with the current key"
    TokenRevoked:
      x-problem:
        slug: token-revoked
        status: 401
        title: Token Revoked
        description: "Token has been revoked."
        error: ErrTokenRevoked
        detail: "this token was revoked, by a logout or a refresh that replaced it; sign in again, or use the newest token pair"

    PasswordOnlyForHumans:
      x-problem:
        slug: password-only-for-humans
        status: 400
        title: Password Only For Humans
        description: "Only human actors can authenticate via password."
        error: ErrPasswordOnlyForHumans
        detail: "only human actors sign in with an email and password; service and machine actors authenticate with an API key instead"
    SetupRequired:
      x-problem:
        slug: setup-required
        status: 503
        title: Setup Required
        description: "Please setup IDX first on /auth/setup."
        error: ErrSetupRequired
        detail: "IdentityX hasn't been set up yet, so it serves no other request; create the first platform admin with POST /auth/setup, then retry"
    SetupCheckFailed:
      x-problem:
        slug: setup-check-failed
        status: 503
        title: Setup Check Failed
        description: "Could not check setup state."
        error: ErrSetupCheckFailed
        detail: "IdentityX couldn't check whether setup is complete because its database didn't answer; retry in a moment"

    # action tokens
    ActionTokenInvalid:
      x-problem:
        slug: action-token-invalid
        status: 400
        title: Action Token Invalid
        description: "Invalid or expired token."
        # ErrActionTokenInvalid covers unparseable, wrongly-purposed, or
        # unknown tokens.
        error: ErrActionTokenInvalid
        detail: "this link's token isn't valid: it was altered, cut short or issued for a different action; open the link from the latest email, or request a new one"
    ActionTokenExpired:
      x-problem:
        slug: action-token-expired
        status: 400
        title: Action Token Expired
        description: "Token expired."
        # ErrActionTokenExpired covers tokens whose anti-replay record has
        # expired.
        error: ErrActionTokenExpired
        detail: "this link has expired; request a new email and use its link before it expires"
    ActionTokenUsed:
      x-problem:
        slug: action-token-used
        status: 400
        title: Action Token Used
        description: "Token already used."
        # ErrActionTokenUsed covers tokens already consumed, including a
        # concurrent consume.
        error: ErrActionTokenUsed
        detail: "this link was already used, and each link works once; if you still need to act, request a new email"

    # access
    ActorOutsideProject:
      x-problem:
        slug: actor-outside-project
        status: 403
        title: Actor Outside Project
        description: "Insufficient permissions."
        error: ErrActorOutsideProject
        detail: "that actor belongs to another project, and the caller may only see actors of its own project"

    # membership
    AddSelfToProject:
      x-problem:
        slug: add-self-to-project
        status: 400
        title: Add Self To Project
        description: "Users can't add themselves to projects."
        error: ErrAddSelfToProject
        detail: "you can't add yourself to a project; ask one of the project's admins or its owner to add you"
    AlreadyProjectMember:
      x-problem:
        slug: already-project-member
        status: 400
        title: Already Project Member
        description: "User is already a member of the project."
        error: ErrAlreadyProjectMember
        detail: "that actor is already a member of the project; to change their role, update their membership instead of adding them again"
    RemoveSelfFromProject:
      x-problem:
        slug: remove-self-from-project
        status: 400
        title: Remove Self From Project
        description: "Cannot remove yourself from the project."
        error: ErrRemoveSelfFromProject
        detail: "you can't remove yourself from a project; ask one of the project's admins or its owner to remove you"
    NotProjectMember:
      x-problem:
        slug: not-project-member
        status: 400
        title: Not Project Member
        description: "User is not a member of the project."
        error: ErrNotProjectMember
        detail: "that actor is not a member of the project, so there is no membership to change or remove"

    # email templates, terms of service, profiles
    TemplateRender:
      x-problem:
        slug: template-render
        status: 400
        title: Template Does Not Render
        description: "The email template does not render; `detail` says why."

    # not found

    # constraints
    EmailTakenForScope:
      x-problem:
        slug: email-taken-for-scope
        status: 409
        title: Email Taken For Scope
        description: "An account with this email already exists for this scope and auth method."
        error: ErrEmailTakenForScope
        detail: "an account with this email already exists here for this sign-in method; sign in to it instead, or use a different email"
    ExternalIdentityTaken:
      x-problem:
        slug: external-identity-taken
        status: 409
        title: External Identity Taken
        description: "This external identity is already linked to this account."
        error: ErrExternalIdentityTaken
        detail: "this provider account is already linked to an IdentityX account; sign in with it instead of linking it again"
    OrgSlugTaken:
      x-problem:
        slug: org-slug-taken
        status: 409
        title: Org Slug Taken
        description: "An organization with this slug already exists."
        error: ErrOrgSlugTaken
        detail: "another organization already uses this slug, and slugs are unique; choose a different slug"
    DomainTaken:
      x-problem:
        slug: domain-taken
        status: 409
        title: Domain Taken
        description: "This domain is already verified by another project."
        error: ErrDomainTaken
        detail: "another project has already verified this domain, and a domain belongs to one project; use a different domain, or remove it from the other project first"
    OAuthProviderConfigured:
      x-problem:
        slug: oauth-provider-configured
        status: 409
        title: OAuth Provider Configured
        description: "This OAuth provider is already configured for this project."
        error: ErrOAuthProviderConfigured
        detail: "this project already has this OAuth provider configured; update the existing configuration instead of creating another"
    DuplicateOAuthState:
      x-problem:
        slug: duplicate-oauth-state
        status: 409
        title: Duplicate OAuth State
        description: "Duplicate OAuth login state."
        error: ErrDuplicateOAuthState
        detail: "an OAuth login with this state is already in progress; start a new login to get a fresh state"
    APIKeyPrefixTaken:
      x-problem:
        slug: api-key-prefix-taken
        status: 409
        title: API Key Prefix Taken
        description: "An API key with this display prefix already exists."
        error: ErrAPIKeyPrefixTaken
        detail: "an API key with this display prefix already exists; create the key again to get a new prefix"
    CapabilityExists:
      x-problem:
        slug: capability-exists
        status: 409
        title: Capability Exists
        description: "A capability with this resource and action already exists for this scope."
        error: ErrCapabilityExists
        detail: "a capability with this resource and action already exists here; reuse it instead of creating a duplicate"
    ProjectProfileSchemaExists:
      x-problem:
        slug: project-profile-schema-exists
        status: 409
        title: Project Profile Schema Exists
        description: "A profile schema already exists for this project."
        error: ErrProjectProfileSchemaExists
        detail: "this project already has a profile schema; publish a new version of it instead of creating another"
    ProfileSchemaVersionExists:
      x-problem:
        slug: profile-schema-version-exists
        status: 409
        title: Profile Schema Version Exists
        description: "This profile schema version already exists for the scope."
        error: ErrProfileSchemaVersionExists
        detail: "this profile schema already has a version with this number; publish it under the next version number"
    PlatformSchemaVersionExists:
      x-problem:
        slug: platform-schema-version-exists
        status: 409
        title: Platform Schema Version Exists
        description: "A platform profile schema version already exists."
        error: ErrPlatformSchemaVersionExists
        detail: "the platform profile schema already has a version with this number; publish it under the next version number"
    HandleTaken:
      x-problem:
        slug: handle-taken
        status: 409
        title: Handle Taken
        description: "This handle is already in use by another profile."
        error: ErrHandleTaken
        detail: "another profile already uses this handle; choose a different one"
    EmailTemplateExists:
      x-problem:
        slug: email-template-exists
        status: 409
        title: Email Template Exists
        description: "This project already has an email template of this kind."
        error: ErrEmailTemplateExists
        detail: "this project already has an email template of this kind; update that template instead of creating another"
    TosAlreadyExists:
      x-problem:
        slug: tos-already-exists
        status: 409
        title: ToS Already Exists
        description: "This project already has terms of service."
        error: ErrTosAlreadyExists
        detail: "this project already has terms of service; publish a new version of them instead of creating another"
    TosAlreadyAccepted:
      x-problem:
        slug: tos-already-accepted
        status: 409
        title: ToS Already Accepted
        description: "This actor has already accepted this terms version."
        error: ErrTosAlreadyAccepted
        detail: "this actor already accepted this version of the terms; there's nothing more to accept"
    AlreadyBlacklisted:
      x-problem:
        slug: already-blacklisted
        status: 409
        title: Already Blacklisted
        description: "This target is already blacklisted for this scope."
        error: ErrAlreadyBlacklisted
        detail: "this target is already blacklisted here; there's nothing more to block"

# Named errors answered by a shared problem (api/problems.yml), each
# with its text as the detail. tools/problemgen generates them into
# errs/errs.gen.go, and Mapper answers them.
x-shared-errors:
  not-found:
    ErrActorNotFound: "actor not found"
    ErrProjectNotFound: "project not found"
    ErrProfileNotFound: "profile not found"
    ErrExternalIdentityNotFound: "external actor identity not found"
    ErrPlatformRoleNotFound: "platform role not found"
    ErrAPIKeyNotFound: "api key not found"
    ErrCryptoKeyNotFound: "crypto key not found"
    ErrCapabilityNotFound: "capability not found"
    ErrActionTokenNotFound: "action token not found"
    ErrProfileSchemaNotFound: "profile schema not found"
    ErrBlacklistEntryNotFound: "blacklist entry not found"
    ErrOrganizationNotFound: "organization not found"
    ErrOAuthProviderNotFound: "project oauth provider not found"
    ErrEmailTemplateNotFound: "email template not found"
    ErrTosNotFound: "terms of service not found"
  validation:
    ErrTermsNotAccepted: "you must accept the terms of service to register"
    ErrInvalidTemplateKind: "email template kind must be one of: verify, reset, tos"
    ErrTemplateMissingActionURL: "email template body must include the {{.ActionURL}} variable at least once"
    ErrTosEmpty: "terms of service content must not be empty"
    ErrInvalidActorType: "actor type must be one of: human, service, machine"
    ErrInvalidAuthMethod: "auth method must be one of: api_key, password, google, github"
    ErrHumanEmailRequired: "email is required for human actors"
    ErrInvalidExternalIDP: "external identity provider must be one of: google, github"
    ErrInvalidOrgRole: "organization role must be one of: owner, admin, member"
    ErrInvalidBrandSlugFormat: "brand slug must contain only lowercase letters"
    ErrInvalidBrandSlugLength: "brand slug length must be between 3 and 32 characters"
    ErrInvalidProjectRole: "project role must be one of: owner, admin, member"
    ErrInvalidPlatformRole: "platform role must be one of: super_admin, admin, support"
    ErrInvalidOAuthProvider: "OAuth provider must be one of: google, github"
    ErrInvalidCryptoKeyType: "crypto key type must be one of: encryption, signing"
    ErrInvalidCryptoKeyStat: "crypto key status must be one of: active, retiring, retired, revoked"
    ErrInvalidTemplateKindColumn: "email template kind must be one of: verify, reset"
    ErrTosContentEmpty: "terms of service content must not be empty"
    ErrInvalidTosVersion: "terms of service version must be at least 1"
    ErrInvalidAcceptanceSource: "terms acceptance source must be clickwrap or continued_use"
    ErrInvalidActionTokenPurpose: "action token purpose must be one of: email_verify, password_reset"
    ErrInvalidBlacklistType: "blacklist entry type must be one of: actor, token, api_key, email, ip"
  token-expired:
    ErrTokenExpired: "the token has expired; refresh it, or sign in again if the refresh token expired too"
