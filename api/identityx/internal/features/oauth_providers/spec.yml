# The oauth_providers feature's operations, and the components and problems only
# they use. api-spec.yml imports the paths; tools/problemgen bundles
# everything into api-spec.gen.yml.
paths:
  /auth/{provider}/connect:
    get:
      tags: [authn]
      operationId: getOAuthConnect
      summary: Start a social login
      description: |
        Starts the social login process for the given provider
        (`google` or `github`) and returns the redirect URL the client
        should send the user to. After the user authorizes, the provider
        redirects back to `/auth/{provider}/callback?code=...`.
      security: []
      parameters:
        - $ref: '../../../api-spec.yml#/components/parameters/ProjectIDQuery'
        - name: accepted_tos
          in: query
          required: false
          description: |
            Explicit consent to the project's current terms of service.
            Required (true) when the project has terms and the flow may
            register a first-time identity; ignored otherwise. The consent
            screen must precede the provider redirect.
          schema:
            type: boolean
        - name: provider
          in: path
          required: true
          description: Social identity provider
          schema:
            $ref: '#/components/schemas/SupportedOAuthProviders'
      x-problems: [400, 500, 503]
      responses:
        '200':
          description: Redirect URL for the provider consent screen
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL to redirect the user to.

  /auth/{provider}/callback:
    get:
      tags: [authn]
      operationId: getOAuthCallback
      summary: Conclude a social login
      description: |
        Receives the callback from the social login redirect, exchanges
        the authorization `code` for tokens, and finishes user
        authentication. Returns the token pair with 201 on first-time
        OAuth logins (account created implicitly).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Social identity provider
          schema:
            $ref: '#/components/schemas/SupportedOAuthProviders'
        - name: code
          in: query
          required: true
          description: Authorization code issued by the provider.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: |
            Opaque state token issued by `/auth/{provider}/connect`. Carries
            the login attempt (scope, provider) back from the provider and
            is consumed by this callback.
          schema:
            type: string
      x-problems: [400, 401, 500, 503]
      responses:
        '201':
          description: Social login concluded; token pair issued
          content:
            application/json:
              schema:
                $ref: '../../../api-spec.yml#/components/schemas/UserTokensOutput'

  /auth/oauth-providers:
    get:
      tags: [authn]
      operationId: getOAuthProviders
      summary: Discover enabled social login providers
      description: |
        Public discovery of the OAuth providers a scope currently accepts
        logins with. With `project_id`, returns the project's enabled
        providers; without it, IdentityX's own platform providers
        (env-configured). The frontend login modal renders one button per
        returned provider.
      security: []
      parameters:
        - $ref: '../../../api-spec.yml#/components/parameters/ProjectIDQuery'
      x-problems: [400, 404, 500, 503]
      responses:
        '200':
          description: Enabled providers for the scope
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthProviderDiscoveryItem'

  /projects/{project_id}/oauth-providers:
    get:
      tags: [oauthproviders]
      operationId: listProjectOAuthProviders
      summary: List the project's OAuth providers
      description: |
        Lists the OAuth providers configured for the project, including
        disabled ones and their status. The client secret is never
        returned. Requires a project membership (member or above).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '../../../api-spec.yml#/components/parameters/ProjectID'
      x-problems: [401, 403, 404, 500, 503]
      responses:
        '200':
          description: Configured OAuth providers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthProviderOutput'
    post:
      tags: [oauthproviders]
      operationId: createProjectOAuthProvider
      summary: Configure an OAuth provider for the project
      description: |
        Stores the provider's credentials for the project. The client
        secret is encrypted at rest and never returned. Requires a project
        admin or owner. Enabling/disabling happens via
        `/oauth-providers/{oauth_provider_id}/enable|disable`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '../../../api-spec.yml#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthProviderRequest'
            example:
              provider: google
              client_id: 1234567890-abc.apps.googleusercontent.com
              client_secret: GOCSPX-example
              callback_url: https://myapp.example.com/auth/callback
      x-problems: [400, 401, 403, 404, 409, 500, 503]
      responses:
        '201':
          description: Provider configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderOutput'

  /oauth-providers/{oauth_provider_id}:
    patch:
      tags: [oauthproviders]
      operationId: updateOAuthProvider
      summary: Update an OAuth provider's credentials
      description: |
        Partially updates a project's OAuth provider configuration. A
        field left out is kept as-is; the secret cannot be read back and is
        only replaced when a new one is sent. Requires a project admin or
        owner.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOAuthProviderRequest'
            example:
              client_secret: GOCSPX-new-secret
      x-problems: [400, 401, 403, 404, 500, 503]
      responses:
        '200':
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderOutput'
    delete:
      tags: [oauthproviders]
      operationId: deleteOAuthProvider
      summary: Remove an OAuth provider from the project
      description: |
        Hard-deletes the project's OAuth provider configuration. Blocks
        new logins via this provider; already-linked external identities
        remain valid. Requires a project admin or owner.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderID'
      x-problems: [401, 403, 404, 500, 503]
      responses:
        '204':
          description: Provider removed

  /oauth-providers/{oauth_provider_id}/disable:
    post:
      tags: [oauthproviders]
      operationId: disableOAuthProvider
      summary: Disable an OAuth provider
      description: |
        Blocks new logins via this provider for the project. Users who
        already linked an external identity with it can still log in.
        Requires a project admin or owner.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderID'
      x-problems: [401, 403, 404, 500, 503]
      responses:
        '200':
          description: Provider disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderOutput'

  /oauth-providers/{oauth_provider_id}/enable:
    post:
      tags: [oauthproviders]
      operationId: enableOAuthProvider
      summary: Enable an OAuth provider
      description: |
        Re-enables an OAuth provider for the project, allowing new logins
        again. Requires a project admin or owner.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderID'
      x-problems: [401, 403, 404, 500, 503]
      responses:
        '200':
          description: Provider enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderOutput'

components:
  schemas:
    SupportedOAuthProviders:
      x-go-type: models.OAuthProvider
      x-go-type-import:
        path: IdentityX/models
      type: string
      enum: [ "google", "github" ]

    OAuthProviderDiscoveryItem:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/SupportedOAuthProviders'
          description: A provider the scope currently accepts logins with.

    OAuthProviderOutput:
      x-go-type: models.ProjectOAuthProviders
      x-go-type-import:
        path: IdentityX/models
      type: object
      required: [id, project_id, provider, client_id, enabled, created_at, updated_at]
      properties:
        id:
          $ref: '../../../api-spec.yml#/components/schemas/UUID'
        project_id:
          $ref: '../../../api-spec.yml#/components/schemas/UUID'
        provider:
          $ref: '#/components/schemas/SupportedOAuthProviders'
        client_id:
          type: string
          description: The provider-side client ID. The secret is never returned.
        callback_url:
          type: string
          format: uri
          description: The provider redirect URI this project registered, called back after consent.
        enabled:
          type: boolean
          description: Whether new logins via this provider are accepted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: Mirrors `models.ProjectOAuthProviders` (secret excluded from the wire representation).

    CreateOAuthProviderRequest:
      type: object
      required: [provider, client_id, client_secret, callback_url]
      properties:
        provider:
          $ref: '#/components/schemas/SupportedOAuthProviders'
        client_id:
          type: string
          minLength: 1
          description: The provider-side client ID.
        client_secret:
          type: string
          minLength: 1
          description: The provider-side client secret. Encrypted at rest.
        callback_url:
          type: string
          format: uri
          minLength: 1
          description: |
            The provider redirect URI this project registered in the
            provider console. Called back after consent.

    UpdateOAuthProviderRequest:
      type: object
      properties:
        client_id:
          type: string
          minLength: 1
          description: The provider-side client ID. Omitted keeps the stored value.
        client_secret:
          type: string
          minLength: 1
          description: The provider-side client secret. Omitted keeps the stored value.
        callback_url:
          type: string
          format: uri
          minLength: 1
          description: The provider redirect URI. Omitted keeps the stored value.

    # oauth
    MissingOAuthCode:
      x-problem:
        slug: missing-oauth-code
        status: 400
        title: Missing OAuth Code
        description: "Missing code."
        error: ErrMissingOAuthCode
        detail: "the provider's redirect has no code; start the login again from the beginning"

    MissingOAuthState:
      x-problem:
        slug: missing-oauth-state
        status: 400
        title: Missing OAuth State
        description: "Missing state."
        error: ErrMissingOAuthState
        detail: "the provider's redirect has no state; start the login again from the beginning"

    OAuthStateNotFound:
      x-problem:
        slug: oauth-state-not-found
        status: 400
        title: OAuth State Not Found
        description: "Invalid or expired OAuth state; start a new login."
        error: ErrOAuthStateNotFound
        detail: "this login's state is unknown or has expired; start a new login"

    OAuthStateMismatch:
      x-problem:
        slug: oauth-state-mismatch
        status: 400
        title: OAuth State Mismatch
        description: "Invalid OAuth state."
        error: ErrOAuthStateMismatch
        detail: "the redirect's state doesn't match the login that was started, so it was rejected to prevent a forged login; start a new login"

    OAuthStateExpired:
      x-problem:
        slug: oauth-state-expired
        status: 400
        title: OAuth State Expired
        description: "OAuth state expired; start a new login."
        error: ErrOAuthStateExpired
        detail: "this login took too long and its state expired; start a new login"

    OAuthCodeExchange:
      x-problem:
        slug: oauth-code-exchange
        status: 401
        title: OAuth Code Exchange
        description: "Failed to exchange code."
        error: ErrOAuthCodeExchange
        detail: "the OAuth provider refused to exchange the login code for a token, most often because the code was already used or expired; start a new login"

    OAuthEmptyToken:
      x-problem:
        slug: oauth-empty-token
        status: 401
        title: OAuth Empty Token
        description: "Empty token from provider."
        error: ErrOAuthEmptyToken
        detail: "the OAuth provider answered without an access token; start a new login; if it keeps happening, check the provider's app configuration"

    OAuthUserinfo:
      x-problem:
        slug: oauth-userinfo
        status: 401
        title: OAuth Userinfo
        description: "Userinfo request failed."
        error: ErrOAuthUserinfo
        detail: "the OAuth provider didn't return the account's profile; start a new login; if it keeps happening, the provider may be down"

    OAuthIncompleteUserinfo:
      x-problem:
        slug: oauth-incomplete-userinfo
        status: 401
        title: OAuth Incomplete Userinfo
        description: "Incomplete userinfo from provider."
        error: ErrOAuthIncompleteUserinfo
        detail: "the OAuth provider's profile lacks an account id or an email, which IdentityX needs to sign you in; add an email to that account and try again"

    OAuthGitHubEmail:
      x-problem:
        slug: oauth-github-email
        status: 401
        title: OAuth GitHub Email
        description: "Could not fetch github email."
        error: ErrOAuthGitHubEmail
        detail: "GitHub didn't share a verified email for this account; verify an email on GitHub and allow the app to read it, then try again"

    UnsupportedProvider:
      x-problem:
        slug: unsupported-provider
        status: 400
        title: Unsupported Provider
        description: "IdentityX has no OAuth provider by this name."
        error: UnsupportedProviderError
        detail: 'unsupported provider: {provider}'
      type: object
      required: [provider]
      properties:
        provider: { type: string, description: "The provider's name." }

    ProviderNotConfigured:
      x-problem:
        slug: provider-not-configured
        status: 400
        title: Provider Not Configured
        description: "The OAuth provider has no credentials, for the project or the platform."
      type: object
      required: [provider]
      properties:
        provider: { type: string, description: "The provider's name." }

    ProviderDisabled:
      x-problem:
        slug: provider-disabled
        status: 403
        title: Provider Disabled
        description: "The project has disabled login with this OAuth provider."
        error: ProviderDisabledError
        detail: 'this project has disabled {provider} login; contact the project to enable it'
      type: object
      required: [provider]
      properties:
        provider: { type: string, description: "The provider's name." }

    ProviderRemoved:
      x-problem:
        slug: provider-removed
        status: 400
        title: Provider Removed
        description: "The OAuth provider was removed from the project while the login was under way."
        error: ProviderRemovedError
        detail: 'this project has disabled {provider} login; contact the project to enable it'
      type: object
      required: [provider]
      properties:
        provider: { type: string, description: "The provider's name." }

  parameters:
    OAuthProviderID:
      name: oauth_provider_id
      in: path
      required: true
      description: OAuth provider configuration ID.
      schema:
        $ref: '../../../api-spec.yml#/components/schemas/UUID'
