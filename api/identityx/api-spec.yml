openapi: 3.1.0

info:
  title: IdentityX API
  summary: Identity and authentication service for TrieOH
  description: |
    API responsible for authentication, authorization, cryptographic
    key management, and multi-tenancy across the TrieOH ecosystem.

    Supports OAuth (Google/GitHub), Ed25519-based JWT issuance, a JWKS
    endpoint, and multi-tenant project scoping.

    ## Authentication

    Every protected endpoint accepts either of:

    | Scheme | Header | Notes |
    |---|---|---|
    | Bearer JWT | `Authorization: Bearer <token>` | Ed25519-signed access token issued by `/auth/login` (or OAuth). |
    | API key | `X-API-KEY: <key>` | Static key created via `POST /projects/{project_id}/api_keys`; server-to-server access. |

    Some route groups additionally require a *platform-level* actor
    (`ClientOnly`) or a *project-scoped* actor (`ProjectClientOnly`);
    that requirement is called out per operation, since both schemes can
    satisfy the auth step itself.

    ## Response envelope

    Every JSON response (except `/.well-known/jwks.json`, which is a raw
    JWKS document) is the `fun.Response` envelope:

    ```json
    {
      "code": 200,
      "message": "",
      "data": { "...": "operation payload" },
      "error": null,
      "pagination": null,
      "timestamp": "2026-01-01T12:00:00Z",
      "module": "IdentityX"
    }
    ```

    - Success: `data` carries the payload. `message` is informational and
      often empty.
    - Failure: `error` carries an `AppError` — `{ "code", "message",
      "fields", "meta" }`. `data` is absent.
    - `pagination` is reserved for paged list endpoints (currently unused
      by IdentityX routes).

    ## Error codes → HTTP status

    The `error.code` sentinel maps to the HTTP status:

    | code | status |
    |---|---|
    | `BAD_REQUEST`, `VALIDATION_ERROR` | 400 |
    | `UNAUTHORIZED` | 401 |
    | `PAYMENT_REQUIRED` | 402 |
    | `FORBIDDEN` | 403 |
    | `NOT_FOUND` | 404 |
    | `METHOD_NOT_ALLOWED` | 405 |
    | `CONFLICT` | 409 |
    | `UNPROCESSABLE_ENTITY` | 422 |
    | `TOO_MANY_REQUESTS` | 429 |
    | `INTERNAL_ERROR` | 500 |
    | `NOT_IMPLEMENTED` | 501 |
    | `BAD_GATEWAY` | 502 |
    | `SERVICE_UNAVAILABLE` | 503 |

    ## Rate limits

    The harness applies a fixed rate limit of 400 requests/second with a
    burst of 20, keyed by client IP (`RemoteAddr`). Exceeded requests
    receive `429 TOO_MANY_REQUESTS`.
  termsOfService: https://identityx.com.br/terms
  version: 0.22.0
  contact:
    name: TrieOH
    url: https://trieoh.com/support
    email: contact@trieoh.com
  license:
    name: TSAL
    url: https://git.trieoh.com/TrieOH/TheTree/src/branch/main/api/identityx/LICENSE

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.identityx.com.br
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Reserved for system level operations such as /health

  - name: authn
    description: Authentication - login, token issuance, and session management

  - name: organizations
    description: Organization creation, membership, and settings management

  - name: projects
    description: Project creation and multi-tenant project scoping

  - name: apikeys
    description: API key issuance, rotation, and revocation

  - name: capabilities
    description: Capability and permission grants for actors and projects

  - name: actors
    description: Actor lifecycle management (creation, lookup, deactivation)

  - name: profiles
    description: Actor profile data management

  - name: profile_schemas
    description: Schema definitions for validating actor profile data

externalDocs:
  description: Full TrieOH documentation
  url: https://docs.trieoh.com

# Either bearer token OR api key satisfies auth where not overridden per
# operation. Routes with `security: []` are public.
security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /docs/openapi.yml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: Get the OpenAPI specification
      description: |
        Returns this service's OpenAPI 3.1 specification in YAML — the
        same content as api/<svc>/api-spec.yml, embedded and served by
        the harness. Docs tooling fetches this URL to render the API
        reference. Public.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
                description: The OpenAPI 3.1 document in YAML.

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      description: |
        Harness-owned liveness probe. Returns 200 with a fixed body when
        the process is up. Not covered by rate limiting or auth.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: "ok"
                  service:
                    type: string
                    const: "IdentityX"
              example:
                status: ok
                service: IdentityX

  /auth/setup:
    get:
      tags: [authn]
      operationId: getSetup
      summary: Check if IdentityX is set up
      description: |
        Returns 204 while setup is still pending (no first account yet)
        and 409 once the system has been set up — used by installers to
        decide whether to show the setup form. Public.
      security: []
      responses:
        '204':
          description: Setup still pending — the setup form should be shown
        '409':
          description: Setup already complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [authn]
      operationId: postSetup
      summary: Set up IdentityX
      description: |
        Creates the first account in the system as a super admin and
        enables authn. Succeeds only once — subsequent calls return 409
        ("setup already complete"). Returns the freshly issued token pair
        (201).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
            example:
              email: admin@trieoh.com
              password: S3curePassw0rd!
      responses:
        '201':
          description: First account created; token pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserTokensOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register:
    post:
      tags: [authn]
      operationId: postRegister
      summary: Register a user
      description: |
        Registers the credential pair, either as an IdentityX client
        (no `project_id`) or as a client of a project that consumes
        IdentityX for authn (pass `project_id`). Returns 201 with an empty
        body — the caller then logs in via `/auth/login`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
            example:
              email: user@example.com
              password: S3curePassw0rd!
      responses:
        '201':
          description: User registered successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login:
    post:
      tags: [authn]
      operationId: postLogin
      summary: Log in a user
      description: |
        Logs in the specified credentials if they exist on the requested
        target (IdentityX itself, or the project identified by
        `project_id`). Returns an access/refresh token pair. The access
        token is an Ed25519-signed JWT; verify it against
        `/.well-known/jwks.json`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
            example:
              email: user@example.com
              password: S3curePassw0rd!
      responses:
        '200':
          description: Login succeeded; token pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserTokensOutput'
              example:
                code: 200
                message: ""
                data:
                  access_token: eyJhbGciOiJFZERTQSIsImtpZCI6Ii4uLiJ9...
                  refresh_token: eyJhbGciOiJFZERTQSIsImtpZCI6Ii4uLiJ9...
                  access_expires_at: '2026-01-01T13:00:00Z'
                  refresh_expires_at: '2026-01-08T12:00:00Z'
                  domain: example.com
                timestamp: '2026-01-01T12:00:00Z'
                module: IdentityX
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      tags: [authn]
      operationId: postLogout
      summary: Log out a user
      description: |
        Logs out the current session, blacklisting the presented access
        and refresh tokens. Requires a valid bearer token; the tokens to
        blacklist are read from the request itself.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/refresh:
    post:
      tags: [authn]
      operationId: postRefresh
      summary: Refresh a user session
      description: |
        Exchanges a refresh token (sent as the bearer credential) for a
        fresh access/refresh token pair. Use when the access token is
        about to expire or has expired.
      security: []
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserTokensOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/{provider}/connect:
    get:
      tags: [authn]
      operationId: getOAuthConnect
      summary: Start a social login
      description: |
        Starts the social login process for the given provider
        (`google` or `github`) and returns the redirect URL the client
        should send the user to. After the user authorizes, the provider
        redirects back to `/auth/{provider}/callback?code=...`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
        - name: provider
          in: path
          required: true
          description: Social identity provider
          schema:
            $ref: '#/components/schemas/SupportedOAuthProviders'
      responses:
        '200':
          description: Redirect URL for the provider consent screen
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [url]
                        properties:
                          url:
                            type: string
                            format: uri
                            description: URL to redirect the user to.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/{provider}/callback:
    get:
      tags: [authn]
      operationId: getOAuthCallback
      summary: Conclude a social login
      description: |
        Receives the callback from the social login redirect, exchanges
        the authorization `code` for tokens, and finishes user
        authentication. Returns the token pair with 201 on first-time
        OAuth logins (account created implicitly).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Social identity provider
          schema:
            $ref: '#/components/schemas/SupportedOAuthProviders'
        - name: code
          in: query
          required: true
          description: Authorization code issued by the provider.
          schema:
            type: string
      responses:
        '201':
          description: Social login concluded; token pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserTokensOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/introspect:
    get:
      tags: [authn]
      operationId: getIntrospect
      summary: Introspect the current identity
      description: |
        Returns the identity resolved from the current credential — the
        actor (subject) plus the credential type used (JWT token or API
        key). API keys authenticate with their full raw key; the subject
        carries the key's capability grants.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Identity resolved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /.well-known/jwks.json:
    get:
      tags: [authn]
      operationId: getJWKS
      summary: Get a JWKS
      description: |
        Provides the JSON Web Key Set (JWKS) for verifying JWTs issued by
        the authentication service. Omit `project_id` for the platform
        keyset, or pass a project id for that project's keyset. Response
        is a raw JWKS document (RFC 7517), NOT the fun envelope, and is
        cached for 2 hours by the server.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
      responses:
        '200':
          description: JWKS document
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    description: Public keys used to verify tokens.
                    items:
                      type: object
                      additionalProperties: true
              example:
                keys:
                  - kty: OKP
                    crv: Ed25519
                    kid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: List your organizations
      description: |
        Lists the organizations the authenticated platform-level actor
        belongs to. Requires a JWT or API key bound to a platform-level
        (non-project-scoped) actor.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Organizations the actor belongs to
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an organization
      description: |
        Creates an organization owned by the authenticated platform-level
        actor. The actor becomes the organization owner.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
            example:
              name: TrieOH Labs
              slug: trieoh-labs
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /organizations/{organization_id}/members:
    get:
      tags: [organizations]
      operationId: listOrganizationMembers
      summary: List organization members
      description: |
        Lists the members of an organization. Requires a platform-level
        actor that is a member of the organization.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Organization members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [organizations]
      operationId: addOrganizationMember
      summary: Add an organization member
      description: |
        Adds an existing actor (by email) to the organization with the
        given role. The authenticated actor must be an admin or owner of
        the organization.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrganizationMemberRequest'
            example:
              actor_email: user@example.com
              role: member
      responses:
        '201':
          description: Member added
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [organizations]
      operationId: removeOrganizationMember
      summary: Remove an organization member
      description: |
        Removes an actor (by email) from the organization. The
        authenticated actor must be an admin or owner of the
        organization.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveOrganizationMemberRequest'
            example:
              actor_email: user@example.com
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /organizations/{organization_id}/projects:
    get:
      tags: [organizations]
      operationId: listOrganizationProjects
      summary: List organization projects
      description: |
        Lists the projects scoped to an organization. Requires a
        platform-level actor that is a member of the organization.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Organization projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [organizations]
      operationId: createOrganizationProject
      summary: Create an organization project
      description: |
        Creates a project inside an organization. Requires an
        organization member with admin or owner role.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgProjectRequest'
            example:
              name: Checkout Service
              domain: https://checkout.trieoh.com
              brand_slug: trieoh-checkout
      responses:
        '201':
          description: Organization project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /organizations/{org_id}/projects/{project_id}/actors:
    get:
      tags: [organizations]
      operationId: listOrganizationProjectActors
      summary: List project actors
      description: |
        Lists the actors scoped to an organization-owned project. The
        actor must belong to the organization.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Project actors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Actor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [organizations]
      operationId: createOrganizationProjectActor
      summary: Create a project actor
      description: |
        Creates an actor scoped to an organization-owned project. The
        actor must belong to the organization.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActorRequest'
            example:
              auth_method: password
              type: human
              email: user@example.com
      responses:
        '201':
          description: Project actor created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Actor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
