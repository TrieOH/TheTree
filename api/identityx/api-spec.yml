                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ActorProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [profiles]
      operationId: upsertProjectProfile
      summary: Upsert a project actor's profile
      description: |
        Sets (or replaces) the project-scoped profile of the given actor
        within the project, validating against the project's active
        profile schema. Requires a platform-level client.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/ActorID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileRequest'
      responses:
        '200':
          description: Profile upserted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ActorProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by IdentityX, signed with Ed25519
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Static API key for server-to-server / project-scoped access

  parameters:
    ProjectIDQuery:
      name: project_id
      in: query
      required: false
      description: Project to scope the operation to. Omit for IdentityX itself.
      schema:
        $ref: '#/components/schemas/UUID'
    ProjectID:
      name: project_id
      in: path
      required: true
      description: Project ID.
      schema:
        $ref: '#/components/schemas/UUID'
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Organization ID.
      schema:
        $ref: '#/components/schemas/UUID'
    OrgID:
      name: org_id
      in: path
      required: true
      description: Organization ID.
      schema:
        $ref: '#/components/schemas/UUID'
    ActorID:
      name: actor_id
      in: path
      required: true
      description: Actor ID.
      schema:
        $ref: '#/components/schemas/UUID'

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions for the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Service temporarily unavailable (e.g. IdentityX not set up yet)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid

    NullableUUID:
      type: [ string, "null" ]
      format: uuid
      x-go-type: '*uuid.UUID'
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/google/uuid

    Response:
      type: object
      description: |
        The `fun.Response` envelope wrapping every JSON payload (except
        `/.well-known/jwks.json`). On success `error` is absent and `data`
        carries the operation payload; on failure `data` is absent and
        `error` carries the AppError. `pagination` is reserved for paged
        list endpoints.
      required: [code, message, timestamp, module]
      properties:
        code:
          type: integer
          description: HTTP status code, duplicated for convenience.
          example: 200
        message:
          type: string
          description: Informational message; often empty on success.
        data:
          type: object
          description: The operation payload. Shape is documented per operation.
        error:
          allOf:
            - $ref: '#/components/schemas/Error'
          description: Present (non-null) only on failure.
        pagination:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
          description: Present only on paged list endpoints.
        timestamp:
          type: string
          format: date-time
          description: Server time the response was produced.
        module:
          type: string
          description: Service that produced the response.

    Error:
      type: object
      title: AppError
      description: |
        The `fun.AppError` object carried in the envelope's `error` field
        on failure. `code` is a machine-readable sentinel whose mapping to
        the HTTP status is documented in the top-level description.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - PAYMENT_REQUIRED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - UNPROCESSABLE_ENTITY
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
            - NOT_IMPLEMENTED
            - BAD_GATEWAY
            - SERVICE_UNAVAILABLE
        message:
          type: string
          description: Human-readable explanation of the failure.
        fields:
          type: array
          description: Per-field validation errors (validation failures only).
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Offending field name (dot notation for nested fields).
              message:
                type: string
                description: Why the field is invalid.
        meta:
          type: object
          description: Arbitrary key/value context (resource ids, request ids, ...).
          additionalProperties: true
        debug:
          type: object
          description: Development-only diagnostics; stripped outside development environments.
          properties:
            raw_error:
              type: string
            stack_trace:
              type: string

    ErrorResponse:
      type: object
      description: |
        The envelope as sent on failure: `data` absent, `error` carrying
        the AppError. Referenced by every error response in this spec.
      required: [code, message, error, timestamp, module]
      properties:
        code:
          type: integer
          description: HTTP status code.
        message:
          type: string
          description: Same message as `error.message`.
        error:
          $ref: '#/components/schemas/Error'
        timestamp:
          type: string
          format: date-time
        module:
          type: string
          const: IdentityX

    PaginationMeta:
      type: object
      description: |
        Pagination metadata attached to paged list endpoints. Currently
        unused by IdentityX routes; documented for forward compatibility.
      required: [page, limit, total, has_next, has_prev]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
        has_next:
          type: boolean
        has_prev:
          type: boolean
        next_page:
          type: integer
        prev_page:
          type: integer

    SupportedOAuthProviders:
      x-go-type: models.OAuthProvider
      x-go-type-import:
        path: IdentityX/models
      type: string
      enum: [ "google", "github" ]

    CredentialRequest:
      type: object
      required: [email, password]
      properties:
        email:
          x-go-type: string
          type: string
          format: email
          description: User's email address.
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: User's password.
      description: |
        Request body for `/auth/setup`, `/auth/register`, and
        `/auth/login`. Mirrors `models.IDXRegisterRequest` /
        `models.IDXLoginRequest`.

    UserTokensOutput:
      x-go-type: models.UserTokensOutput
      x-go-type-import:
        path: IdentityX/models
      type: object
      required: [access_token, refresh_token, access_expires_at, refresh_expires_at, domain]
      properties:
        access_token:
          type: string
          description: Ed25519-signed JWT carrying the actor identity.
        refresh_token:
          type: string
          description: JWT used to obtain a fresh token pair via /auth/refresh.
        access_expires_at:
          type: string
          format: date-time
          description: Expiration timestamp of the access token.
        refresh_expires_at:
          type: string
          format: date-time
          description: Expiration timestamp of the refresh token.
        domain:
          type: string
          description: Cookie domain the frontend should bind tokens to.
      description: Mirrors `models.UserTokensOutput`.

    Identity:
      x-go-type: models.Identity
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: |
        Identity resolved from the current credential (session JWT or API
        key), returned by `/auth/introspect`. Mirrors `models.Identity`.
      required: [subject, cred]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        cred:
          $ref: '#/components/schemas/Credential'

    Subject:
      x-go-type: models.Subject
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: The actor this identity resolves to. Mirrors `models.Subject`.
      required: [id, type, capabilities]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
          description: Unique identifier of the actor.
        project_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Project this actor is scoped to, if any.
        email:
          x-go-type: string
          type: [ string, "null" ]
          format: email
          description: Actor's email address, if applicable for this actor type.
        type:
          $ref: '#/components/schemas/ActorType'
        capabilities:
          type: [ object, "null" ]
          description: |
            Actor's capability grants as a JSON array of `resource:action`
            strings (JSON-encoded array carried in a JSON field). Shape is
            opaque to the API contract.
        metadata:
          type: [ object, "null" ]
          description: Arbitrary actor metadata, opaque to the API contract.
          additionalProperties: true

    Credential:
      x-go-type: models.Credential
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: The credential used to authenticate this request. Mirrors `models.Credential`.
      required: [type]
      properties:
        id:
          $ref: '#/components/schemas/NullableUUID'
          description: |
            Identifier of the credential, present for stateful credentials
            (e.g. API keys). Null for stateless credentials (e.g. JWTs).
        type:
          $ref: '#/components/schemas/CredentialType'

    ActorType:
      x-go-type: models.ActorType
      x-go-type-import:
        path: IdentityX/models
      type: string
      description: The kind of actor this identity represents.
      enum: [ human, service, machine ]

    CredentialType:
      x-go-type: models.CredentialType
      x-go-type-import:
        path: IdentityX/models
      type: string
      description: The mechanism used to authenticate this identity.
      enum: [ token, api_key ]

    Actor:
      x-go-type: models.Actor
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: A human, service, or machine identity. Mirrors `models.Actor`.
      required: [id, auth_method, type, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        project_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Project this actor is scoped to, if any.
        auth_method:
          type: string
          enum: [password, api_key, google_auth, github_auth]
          description: How this actor authenticates.
        verified_at:
          type: [ string, "null" ]
          format: date-time
          description: When the actor's email was verified, if ever.
        email:
          x-go-type: string
          type: [ string, "null" ]
          format: email
          description: Actor's email address.
        type:
          $ref: '#/components/schemas/ActorType'
        metadata:
          type: [ object, "null" ]
          description: Arbitrary actor metadata.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [ string, "null" ]
          format: date-time

    CreateActorRequest:
      type: object
      description: Request body for actor creation. Mirrors `models.CreateActorRequest`.
      required: [auth_method, type]
      properties:
        auth_method:
          type: string
          enum: [password, api_key]
          x-go-type: models.AuthMethod
          x-go-type-import:
            path: IdentityX/models
        type:
          $ref: '#/components/schemas/ActorType'
        email:
          x-go-type: string
          type: [ string, "null" ]
          format: email
          description: Actor's email address.

    ActorProfile:
      x-go-type: models.ActorProfile
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: An actor's profile payload. Mirrors `models.ActorProfile`.
      required: [actor_id, profile, updated_at]
      properties:
        actor_id:
          $ref: '#/components/schemas/UUID'
        profile:
          type: object
          description: The profile data, validated against the active profile schema.
          additionalProperties: true
        updated_at:
          type: string
          format: date-time

    UpsertProfileRequest:
      type: object
      description: Request body for profile upserts. Mirrors `models.UpsertProfileRequest`.
      required: [profile]
      properties:
        profile:
          type: object
          description: Profile data to store, validated against the active schema.
          additionalProperties: true

    ProjectProfileSchema:
      x-go-type: models.ProjectProfileSchema
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: A profile validation schema. Mirrors `models.ProjectProfileSchema`.
      required: [schema, version, active, created_at, updated_at]
      properties:
        project_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Project the schema applies to; null = platform-wide default.
        schema:
          type: object
          description: The JSON Schema (draft 2020-12) used to validate profiles.
          additionalProperties: true
        version:
          type: integer
          description: Monotonically increasing schema version.
        active:
          type: boolean
          description: Whether this schema is the active one for its scope.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpsertProfileSchemaRequest:
      type: object
      description: Request body for schema upserts. Mirrors `models.UpsertProfileSchemaRequest`.
      required: [schema, active]
      properties:
        schema:
          type: object
          description: The JSON Schema to store.
          additionalProperties: true
        active:
          type: boolean
          description: Whether the schema should become active immediately.

    Organization:
      x-go-type: models.Organization
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: A top-level tenant. Mirrors `models.Organization`.
      required: [id, owner_id, name, slug, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        owner_id:
          $ref: '#/components/schemas/UUID'
          description: Actor that owns the organization.
        name:
          type: string
          minLength: 3
        slug:
          type: string
          minLength: 2
        metadata:
          type: [ object, "null" ]
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: [ string, "null" ]
          format: date-time

    CreateOrganizationRequest:
      type: object
      description: Request body for organization creation. Mirrors `models.CreateOrganizationRequest`.
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 3
        slug:
          type: string
          minLength: 2

    OrganizationRole:
      x-go-type: models.OrganizationRole
      x-go-type-import:
        path: IdentityX/models
      type: string
      enum: [member, admin, owner]

    OrganizationMember:
      x-go-type: models.OrganizationMember
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: Membership of an actor in an organization. Mirrors `models.OrganizationMember`.
      required: [organization_id, actor_id, role, joined_at]
      properties:
        organization_id:
          $ref: '#/components/schemas/UUID'
        actor_id:
          $ref: '#/components/schemas/UUID'
        role:
          $ref: '#/components/schemas/OrganizationRole'
        metadata:
          type: [ object, "null" ]
          additionalProperties: true
        joined_at:
          type: string
          format: date-time

    AddOrganizationMemberRequest:
      type: object
      description: Request body for adding an organization member. Mirrors `models.AddOrganizationMemberRequest`.
      required: [actor_email, role]
      properties:
        actor_email:
          x-go-type: string
          type: string
          format: email
        role:
          $ref: '#/components/schemas/OrganizationRole'

    RemoveOrganizationMemberRequest:
      type: object
      description: Request body for removing an organization member. Mirrors `models.RemoveOrganizationMemberRequest`.
      required: [actor_email]
      properties:
        actor_email:
          x-go-type: string
          type: string
          format: email

    Project:
      x-go-type: models.Project
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: An IdentityX workspace under an organization. Mirrors `models.Project`.
      required: [id, owner_id, brand_slug, name, metadata, created_at]
      properties:
        id:
