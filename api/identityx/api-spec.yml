        organization_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Organization this project belongs to, if any.
        owner_id:
          $ref: '#/components/schemas/UUID'
        brand_slug:
          type: string
          minLength: 3
          maxLength: 32
        name:
          type: string
          minLength: 3
        domain:
          type: [ string, "null" ]
          format: uri
          description: Verified custom domain, if configured.
        domain_verified_at:
          type: [ string, "null" ]
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: [ string, "null" ]
          format: date-time

    CreateProjectRequest:
      type: object
      description: Request body for project creation. Mirrors `models.CreateProjectRequest`.
      required: [name, brand_slug]
      properties:
        name:
          type: string
          minLength: 3
        domain:
          type: [ string, "null" ]
          format: uri
        brand_slug:
          type: string
          description: Unique slug used in branding and URLs.

    CreateOrgProjectRequest:
      type: object
      description: Request body for organization project creation. Mirrors `models.CreateOrgProjectRequest`.
      required: [name, brand_slug]
      properties:
        name:
          type: string
          minLength: 3
        domain:
          type: [ string, "null" ]
          format: uri
        brand_slug:
          type: string

    ProjectRole:
      x-go-type: models.ProjectRole
      x-go-type-import:
        path: IdentityX/models
      type: string
      enum: [member, admin, owner]

    ProjectMember:
      x-go-type: models.ProjectMember
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: Membership of an actor in a project. Mirrors `models.ProjectMember`.
      required: [project_id, actor_id, role, metadata, joined_at]
      properties:
        project_id:
          $ref: '#/components/schemas/UUID'
        actor_id:
          $ref: '#/components/schemas/UUID'
        role:
          $ref: '#/components/schemas/ProjectRole'
        metadata:
          type: object
          additionalProperties: true
        joined_at:
          type: string
          format: date-time

    AddProjectMemberRequest:
      type: object
      description: Request body for adding a project member. Mirrors `models.AddProjectMemberRequest`.
      required: [actor_email, role]
      properties:
        actor_email:
          x-go-type: string
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ProjectRole'

    RemoveProjectMemberRequest:
      type: object
      description: Request body for removing a project member. Mirrors `models.RemoveProjectMemberRequest`.
      required: [actor_email]
      properties:
        actor_email:
          x-go-type: string
          type: string
          format: email

    AddOrgProjectMemberRequest:
      type: object
      description: Request body for adding an org project member. Mirrors `models.AddOrgProjectMemberRequest`.
      required: [actor_email, role]
      properties:
        actor_email:
          x-go-type: string
          type: string
          format: email
        role:
          $ref: '#/components/schemas/ProjectRole'

    RemoveOrgProjectMemberRequest:
      type: object
      description: Request body for removing an org project member. Mirrors `models.RemoveOrgProjectMemberRequest`.
      required: [actor_email]
      properties:
        actor_email:
          x-go-type: string
          type: string
          format: email

    Capability:
      x-go-type: models.Capability
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: A permission grant (`resource:action`). Mirrors `models.Capability`.
      required: [id, resource, action, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        project_id:
          $ref: '#/components/schemas/NullableUUID'
        resource:
          type: string
          minLength: 3
        action:
          type: string
          minLength: 3
        created_by:
          $ref: '#/components/schemas/UUID'
        created_at:
          type: string
          format: date-time

    CreateCapabilityRequest:
      type: object
      description: Request body for capability creation. Mirrors `models.CreateCapabilityRequest`.
      required: [resource, action]
      properties:
        resource:
          type: string
          minLength: 3
        action:
          type: string
          minLength: 3

    APIKey:
      x-go-type: models.APIKey
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: A static API key record. Mirrors `models.APIKey`.
      required: [id, subject_id, name, display_prefix, metadata, created_by, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        subject_id:
          $ref: '#/components/schemas/UUID'
          description: Actor the key is bound to.
        name:
          type: string
        display_prefix:
          type: string
          description: Short prefix for identifying the key (e.g. `idx_abc123`).
        metadata:
          type: object
          additionalProperties: true
        expires_at:
          type: [ string, "null" ]
          format: date-time
        revoked_at:
          type: [ string, "null" ]
          format: date-time
        last_used_at:
          type: [ string, "null" ]
          format: date-time
        created_by:
          $ref: '#/components/schemas/UUID'
        created_at:
          type: string
          format: date-time

    CreateAPIKeyRequest:
      type: object
      description: Request body for API key creation. Mirrors `models.CreateAPIKeyRequest`.
      properties:
        subject_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Actor the key is bound to. Defaults to the authenticated actor.
        capabilities:
          type: array
          description: Capability IDs the key is restricted to.
          items:
            $ref: '#/components/schemas/UUID'
        name:
          type: string
          description: Human-friendly key name.
        env:
          type: string
          description: Environment tag (e.g. `production`, `sandbox`).
        expires_at:
          type: [ string, "null" ]
          format: date-time
          description: Optional expiry; null = does not expire.

    CreateAPIKeyResponse:
      x-go-type: models.CreateAPIKeyResponse
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: Result of API key creation. Mirrors `models.CreateAPIKeyResponse`.
      required: [key, raw_key]
      properties:
        key:
          $ref: '#/components/schemas/APIKey'
        raw_key:
          type: string
          description: |
            The full key, returned exactly once. Store it securely; it
            cannot be retrieved again.
