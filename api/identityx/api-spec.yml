        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TosContentBody'
      x-problems: [400, 401, 403, 404, 409, 500, 503]
      responses:
        '200':
          description: Terms of service created (v1); notification enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectTos'
    put:
      tags: [projects]
      operationId: putProjectTos
      summary: Update a project's terms of service (bumps the version)
      description: |
        Replaces the content and bumps the version; the effective date is
        reset to 30 days out. Every human user of the project is emailed
        the LGPD art. 9 §6 change notice for the new version. Updating a
        project without terms is a 404 — use `POST` to introduce them.
        The authenticated actor must be an admin or owner of the project.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
