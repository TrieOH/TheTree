openapi: 3.1.0

info:
  title: IdentityX API
  summary: Identity and authentication service for TrieOH
  description: |
    API responsible for authentication, authorization, cryptographic
    key management, and multi-tenancy across the TrieOH ecosystem.

    Supports OAuth (Google/GitHub), Ed25519-based JWT issuance, a JWKS
    endpoint, and multi-tenant project scoping.

    ## Authentication

    Every protected endpoint accepts either of:

    | Scheme | Header | Notes |
    |---|---|---|
    | Bearer JWT | `Authorization: Bearer <token>` | Ed25519-signed access token issued by `/auth/login` (or OAuth). |
    | API key | `X-API-KEY: <key>` | Static key created via `POST /projects/{project_id}/api_keys`; server-to-server access. |

    Some route groups additionally require a *platform-level* actor
    (`ClientOnly`) or a *project-scoped* actor (`ProjectClientOnly`);
    that requirement is called out per operation, since both schemes can
    satisfy the auth step itself.

    ## Responses

    A successful response's body is the operation's payload itself; an
    operation with nothing to return answers `204 No Content`. A list is
    an object, `{ "items": [ ... ] }`, so paging fields can sit beside the
    items later.

    A failed response's body is an RFC 9457 problem, served as
    `application/problem+json`:

    ```json
    {
      "type": "https://api.identityx.trieoh.com/problems/validation",
      "status": 400,
      "title": "Validation Failed",
      "detail": "invalid request body: name: this field is required",
      "instance": "/namespaces",
      "errors": [{ "field": "name", "message": "this field is required" }]
    }
    ```

    `type` identifies the problem and resolves to its documentation;
    `title` and `status` are fixed per problem, `detail` says what went
    wrong this time, and `instance` is the request path. `errors` is
    present only when the failure names request fields. Each operation
    lists the problems it can answer with; a 500 reads `Internal Server
    Error`.

    ## Rate limits

    The harness applies a fixed rate limit of 400 requests/second with a
    burst of 20, keyed by client IP (`RemoteAddr`). Exceeded requests
    receive `429 TOO_MANY_REQUESTS`.
  termsOfService: https://identityx.com.br/terms
  version: 0.22.0
  contact:
    name: TrieOH
    url: https://trieoh.com/support
    email: contact@trieoh.com
  license:
    name: TSAL
    url: https://github.com/TrieOH/TheTree/blob/main/api/identityx/LICENSE

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.identityx.trieoh.com
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Reserved for system level operations such as /health

  - name: authn
    description: Authentication - login, token issuance, and session management

  - name: organizations
    description: Organization creation, membership, and settings management

  - name: projects
    description: Project creation and multi-tenant project scoping

  - name: apikeys
    description: API key issuance, rotation, and revocation

  - name: capabilities
    description: Capability and permission grants for actors and projects

  - name: actors
    description: Actor lifecycle management (creation, lookup, deactivation)

  - name: profiles
    description: Actor profile data management

  - name: profile_schemas
    description: Schema definitions for validating actor profile data

externalDocs:
  description: Full TrieOH documentation
  url: https://docs.trieoh.com

# Either bearer token OR api key satisfies auth where not overridden per
# operation. Routes with `security: []` are public.
security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /docs/openapi.yml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: Get the OpenAPI specification
      description: |
        Returns this service's OpenAPI 3.1 specification in YAML — the
        same content as api/<svc>/api-spec.yml, embedded and served by
        the harness. Docs tooling fetches this URL to render the API
        reference. Public.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
                description: The OpenAPI 3.1 document in YAML.

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      description: |
        Harness-owned liveness probe. Returns 200 with a fixed body when
        the process is up. Not covered by rate limiting or auth.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: "ok"
                  service:
                    type: string
                    const: "IdentityX"
              example:
                status: ok
                service: IdentityX

  /auth/setup:
    get:
      tags: [authn]
      operationId: getSetup
      summary: Check if IdentityX is set up
      description: |
        Returns 204 while setup is still pending (no first account yet)
        and 409 once the system has been set up — used by installers to
        decide whether to show the setup form. Public.
      security: []
      x-problems: [409, 500, 503]
      responses:
        '204':
          description: Setup still pending — the setup form should be shown
    post:
      tags: [authn]
      operationId: postSetup
      summary: Set up IdentityX
      description: |
        Creates the first account in the system as a super admin and
        enables authn. Succeeds only once — subsequent calls return 409
        ("setup already complete"). Returns the freshly issued token pair
        (201).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
            example:
              email: admin@trieoh.com
              password: S3curePassw0rd!
      x-problems: [400, 409, 500]
      responses:
        '201':
          description: First account created; token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokensOutput'

  /auth/register:
    post:
      tags: [authn]
      operationId: postRegister
      summary: Register a user
      description: |
        Registers the credential pair, either as an IdentityX client
        (no `project_id`) or as a client of a project that consumes
        IdentityX for authn (pass `project_id`). Returns 201 with an empty
        body — the caller then logs in via `/auth/login`.

        When the target project has terms of service, the registration is
        rejected unless `accepted_tos` is true — consent under LGPD art. 8
        must be express. Projects without terms ignore the flag. The
        acceptance is recorded against the current version.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: S3curePassw0rd!
              accepted_tos: true
      x-problems: [400, 409, 500, 503]
      responses:
        '201':
          description: User registered successfully

  /auth/verify-email:
    post:
      tags: [authn]
      operationId: postVerifyEmail
      summary: Verify an email address
      description: |
        Redeems the single-use JWT carried by a verification email and
        marks the actor's email as verified. The token is HMAC-signed,
        purpose-scoped, expires after a short TTL, and is consumed on
        first use (jti anti-replay). Re-clicking a consumed link on an
        already-verified account succeeds (idempotent).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            example:
              token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      x-problems: [400, 500, 503]
      responses:
        '204':
          description: Email verified

  /auth/resend-verification:
    post:
      tags: [authn]
      operationId: postResendVerification
      summary: Resend the verification email
      description: |
        Mints a fresh verification link and emails it to the given
        address. Always returns 200 — unknown emails and already-verified
        accounts are silent no-ops, so the endpoint does not leak which
        emails are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: user@example.com
      x-problems: [400, 500, 503]
      responses:
        '204':
          description: Verification email sent (or silently skipped)

  /auth/forgot-password:
    post:
      tags: [authn]
      operationId: postForgotPassword
      summary: Request a password reset link
      description: |
        Mints a single-use password-reset link and emails it to the given
        address. Always returns 200 — unknown emails and passwordless
        (OAuth-only) accounts are silent no-ops, so the endpoint does not
        leak which emails are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: user@example.com
      x-problems: [400, 500, 503]
      responses:
        '204':
          description: Reset link emailed (or silently skipped)

  /auth/reset-password:
    post:
      tags: [authn]
      operationId: postResetPassword
      summary: Set a new password with a reset link
      description: |
        Redeems the single-use JWT carried by a password-reset email and
        replaces the actor's password. The token is HMAC-signed,
        purpose-scoped, expires after a short TTL, and is consumed on
        first use — a consumed token is dead and a new link must be
        requested.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              password: S3curePassw0rd!
      x-problems: [400, 500, 503]
      responses:
        '204':
          description: Password reset

  /auth/login:
    post:
      tags: [authn]
      operationId: postLogin
      summary: Log in a user
      description: |
        Logs in the specified credentials if they exist on the requested
        target (IdentityX itself, or the project identified by
        `project_id`). Returns an access/refresh token pair. The access
        token is an Ed25519-signed JWT; verify it against
        `/.well-known/jwks.json`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
            example:
              email: user@example.com
              password: S3curePassw0rd!
      x-problems: [400, 401, 500, 503]
      responses:
        '200':
          description: Login succeeded; token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokensOutput'
              example:
                access_token: <access token, a JWT>
                refresh_token: <refresh token, a JWT>
                access_expires_at: '2026-01-01T13:00:00Z'
                refresh_expires_at: '2026-01-08T12:00:00Z'
                domain: example.com

  /auth/logout:
    post:
      tags: [authn]
      operationId: postLogout
      summary: Log out a user
      description: |
        Logs out the current session, blacklisting the presented access
        and refresh tokens. Requires a valid bearer token; the tokens to
        blacklist are read from the request headers.
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          description: The access token to blacklist, as `Bearer <token>`.
          schema:
            type: string
        - name: Refresh-Token
          in: header
          required: true
          description: The refresh token to blacklist.
          schema:
            type: string
      x-problems: [401, 500, 503]
      responses:
        '204':
          description: Logged out successfully

  /auth/refresh:
    post:
      tags: [authn]
      operationId: postRefresh
      summary: Refresh a user session
      description: |
        Exchanges a refresh token (sent in the `Refresh-Token` header) for
        a fresh access/refresh token pair. Use when the access token is
        about to expire or has expired.
      security: []
      parameters:
        - name: Refresh-Token
          in: header
          required: true
          description: The refresh token to exchange.
          schema:
            type: string
      x-problems: [401, 500, 503]
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokensOutput'

  /auth/{provider}/connect:
    get:
      tags: [authn]
      operationId: getOAuthConnect
      summary: Start a social login
      description: |
        Starts the social login process for the given provider
        (`google` or `github`) and returns the redirect URL the client
        should send the user to. After the user authorizes, the provider
        redirects back to `/auth/{provider}/callback?code=...`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
        - name: accepted_tos
          in: query
          required: false
          description: |
            Explicit consent to the project's current terms of service.
            Required (true) when the project has terms and the flow may
            register a first-time identity; ignored otherwise. The consent
            screen must precede the provider redirect.
          schema:
            type: boolean
        - name: provider
          in: path
          required: true
          description: Social identity provider
          schema:
            $ref: '#/components/schemas/SupportedOAuthProviders'
      x-problems: [400, 500, 503]
      responses:
        '200':
          description: Redirect URL for the provider consent screen
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL to redirect the user to.

  /auth/{provider}/callback:
    get:
      tags: [authn]
      operationId: getOAuthCallback
      summary: Conclude a social login
      description: |
        Receives the callback from the social login redirect, exchanges
        the authorization `code` for tokens, and finishes user
        authentication. Returns the token pair with 201 on first-time
        OAuth logins (account created implicitly).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Social identity provider
          schema:
            $ref: '#/components/schemas/SupportedOAuthProviders'
        - name: code
          in: query
          required: true
          description: Authorization code issued by the provider.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: |
            Opaque state token issued by `/auth/{provider}/connect`. Carries
            the login attempt (scope, provider) back from the provider and
            is consumed by this callback.
          schema:
            type: string
      x-problems: [400, 401, 500, 503]
      responses:
        '201':
          description: Social login concluded; token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokensOutput'

  /auth/oauth-providers:
    get:
      tags: [authn]
      operationId: getOAuthProviders
      summary: Discover enabled social login providers
      description: |
        Public discovery of the OAuth providers a scope currently accepts
        logins with. With `project_id`, returns the project's enabled
        providers; without it, IdentityX's own platform providers
        (env-configured). The frontend login modal renders one button per
        returned provider.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
      x-problems: [400, 404, 500, 503]
      responses:
        '200':
          description: Enabled providers for the scope
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthProviderDiscoveryItem'

  /auth/introspect:
    get:
      tags: [authn]
      operationId: getIntrospect
      summary: Introspect the current identity
      description: |
        Returns the identity resolved from the current credential — the
        actor (subject) plus the credential type used (JWT token or API
        key). API keys authenticate with their full raw key; the subject
        carries the key's capability grants.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-problems: [401, 500, 503]
      responses:
        '200':
          description: Identity resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'

  /.well-known/jwks.json:
    get:
      tags: [authn]
      operationId: getJWKS
      summary: Get a JWKS
      description: |
        Provides the JSON Web Key Set (JWKS) for verifying JWTs issued by
        the authentication service. Omit `project_id` for the platform
        keyset, or pass a project id for that project's keyset. Response
        is a raw JWKS document (RFC 7517), and is
        cached for 2 hours by the server.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIDQuery'
      x-problems: [500, 503]
      responses:
        '200':
          description: JWKS document
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    description: Public keys used to verify tokens.
                    items:
                      type: object
                      additionalProperties: true
              example:
                keys:
                  - kty: OKP
                    crv: Ed25519
                    kid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo

  /organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      x-scope: platform-only
      summary: List your organizations
      description: |
        Lists the organizations the authenticated platform-level actor
        belongs to. Requires a JWT or API key bound to a platform-level
        (non-project-scoped) actor.
      security:
        - bearerAuth: []
      x-problems: [401, 500, 503]
      responses:
        '200':
          description: Organizations the actor belongs to
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
    post:
      tags: [organizations]
      operationId: createOrganization
      x-scope: platform-only
      summary: Create an organization
      description: |
        Creates an organization owned by the authenticated platform-level
        actor. The actor becomes the organization owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
            example:
              name: TrieOH Labs
              slug: trieoh-labs
      x-problems: [400, 401, 409, 500, 503]
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

  /organizations/{organization_id}/members:
    get:
      tags: [organizations]
      operationId: listOrganizationMembers
      x-scope: platform-only
      summary: List organization members
      description: |
        Lists the members of an organization. Requires a platform-level
        actor that is a member of the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      x-problems: [401, 403, 404, 500, 503]
      responses:
        '200':
          description: Organization members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMember'
    post:
      tags: [organizations]
      operationId: addOrganizationMember
      x-scope: platform-only
      summary: Add an organization member
      description: |
        Adds an existing actor (by email) to the organization with the
        given role. The authenticated actor must be an admin or owner of
        the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrganizationMemberRequest'
            example:
              actor_email: user@example.com
              role: member
      x-problems: [400, 401, 403, 404, 409, 500, 503]
      responses:
        '201':
          description: Member added
    delete:
      tags: [organizations]
      operationId: removeOrganizationMember
      x-scope: platform-only
      summary: Remove an organization member
      description: |
        Removes an actor (by email) from the organization. The
        authenticated actor must be an admin or owner of the
        organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveOrganizationMemberRequest'
            example:
              actor_email: user@example.com
      x-problems: [400, 401, 403, 404, 500, 503]
      responses:
        '204':
          description: Member removed

  /organizations/{organization_id}/projects:
    get:
      tags: [organizations]
      operationId: listOrganizationProjects
      x-scope: platform-only
      summary: List organization projects
      description: |
        Lists the projects scoped to an organization. Requires a
        platform-level actor that is a member of the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      x-problems: [401, 403, 404, 500, 503]
      responses:
        '200':
          description: Organization projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
    post:
      tags: [organizations]
      operationId: createOrganizationProject
      x-scope: platform-only
      summary: Create an organization project
      description: |
        Creates a project inside an organization. Requires an
        organization member with admin or owner role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgProjectRequest'
            example:
              name: Checkout Service
              domain: https://checkout.trieoh.com
              brand_slug: trieoh-checkout
      x-problems: [400, 401, 403, 404, 409, 500, 503]
      responses:
        '201':
          description: Organization project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /organizations/{org_id}/projects/{project_id}/actors:
    get:
      tags: [organizations]
      operationId: listOrganizationProjectActors
      x-scope: platform-only
      summary: List project actors
      description: |
        Lists the actors scoped to an organization-owned project. The
        actor must belong to the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ProjectID'
      x-problems: [401, 403, 404, 500, 503]
      responses:
        '200':
          description: Project actors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actor'
    post:
      tags: [organizations]
      operationId: createOrganizationProjectActor
      x-scope: platform-only
      summary: Create a project actor
      description: |
        Creates an actor scoped to an organization-owned project. The
        actor must belong to the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActorRequest'
            example:
              auth_method: password
              type: human
              email: user@example.com
      x-problems: [400, 401, 403, 404, 500, 503]
      responses:
        '201':
          description: Project actor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'

  /organizations/{organization_id}/projects/{project_id}/members:
    get:
      tags: [organizations]
      operationId: listOrganizationProjectMembers
      x-scope: platform-only
      summary: List project members
      description: |
        Lists the members of an organization-owned project. The actor
        must belong to the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ProjectID'
      x-problems: [401, 403, 404, 500, 503]
      responses:
        '200':
          description: Project members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMember'
    post:
      tags: [organizations]
      operationId: addOrganizationProjectMember
      x-scope: platform-only
      summary: Add a project member
      description: |
        Adds an existing actor (by email) to an organization-owned
        project with the given role. The actor must be an admin or owner
        of the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
