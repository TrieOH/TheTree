components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by IdentityX, signed with Ed25519
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Static API key for server-to-server / project-scoped access

  parameters:
    ProjectIDQuery:
      name: project_id
      in: query
      required: false
      description: Project to scope the operation to. Omit for IdentityX itself.
      schema:
        $ref: '#/components/schemas/UUID'
    ProjectID:
      name: project_id
      in: path
      required: true
      description: Project ID.
      schema:
        $ref: '#/components/schemas/UUID'
    OAuthProviderID:
      name: oauth_provider_id
      in: path
      required: true
      description: OAuth provider configuration ID.
      schema:
        $ref: '#/components/schemas/UUID'
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Organization ID.
      schema:
        $ref: '#/components/schemas/UUID'
    OrgID:
      name: org_id
      in: path
      required: true
      description: Organization ID.
      schema:
        $ref: '#/components/schemas/UUID'
    ActorID:
      name: actor_id
      in: path
      required: true
      description: Actor ID.
      schema:
        $ref: '#/components/schemas/UUID'
    ProfileHandle:
      name: handle
      in: path
      required: true
      description: Unique profile handle.
      schema:
        type: string
    EmailTemplateKind:
      name: kind
      in: path
      required: true
      description: Email template kind.
      schema:
        $ref: '#/components/schemas/EmailTemplateKind'

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions for the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Service temporarily unavailable (e.g. IdentityX not set up yet)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid

    NullableUUID:
      type: [ string, "null" ]
      format: uuid
      x-go-type: '*uuid.UUID'
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/google/uuid

    Response:
      type: object
      description: |
        The `fun.Response` envelope wrapping every JSON payload (except
        `/.well-known/jwks.json`). On success `error` is absent and `data`
        carries the operation payload; on failure `data` is absent and
        `error` carries the AppError. `pagination` is reserved for paged
        list endpoints.
      required: [code, message, timestamp, module]
      properties:
        code:
          type: integer
          description: HTTP status code, duplicated for convenience.
          example: 200
        message:
          type: string
          description: Informational message; often empty on success.
        data:
          type: object
          description: The operation payload. Shape is documented per operation.
        error:
          allOf:
            - $ref: '#/components/schemas/Error'
          description: Present (non-null) only on failure.
        pagination:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
          description: Present only on paged list endpoints.
        timestamp:
          type: string
          format: date-time
          description: Server time the response was produced.
        module:
          type: string
          description: Service that produced the response.

    Error:
      type: object
      title: AppError
      description: |
        The `fun.AppError` object carried in the envelope's `error` field
        on failure. `code` is a machine-readable sentinel whose mapping to
        the HTTP status is documented in the top-level description.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - PAYMENT_REQUIRED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - UNPROCESSABLE_ENTITY
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
            - NOT_IMPLEMENTED
            - BAD_GATEWAY
            - SERVICE_UNAVAILABLE
        message:
          type: string
          description: Human-readable explanation of the failure.
        fields:
          type: array
          description: Per-field validation errors (validation failures only).
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Offending field name (dot notation for nested fields).
              message:
                type: string
                description: Why the field is invalid.
        meta:
          type: object
          description: Arbitrary key/value context (resource ids, request ids, ...).
          additionalProperties: true
        debug:
          type: object
          description: Development-only diagnostics; stripped outside development environments.
          properties:
            raw_error:
              type: string
            stack_trace:
              type: string

    ErrorResponse:
      type: object
      description: |
        The envelope as sent on failure: `data` absent, `error` carrying
        the AppError. Referenced by every error response in this spec.
      required: [code, message, error, timestamp, module]
      properties:
        code:
          type: integer
          description: HTTP status code.
        message:
          type: string
          description: Same message as `error.message`.
        error:
          $ref: '#/components/schemas/Error'
        timestamp:
          type: string
          format: date-time
        module:
          type: string
          const: IdentityX

    PaginationMeta:
      type: object
      description: |
        Pagination metadata attached to paged list endpoints. Currently
        unused by IdentityX routes; documented for forward compatibility.
      required: [page, limit, total, has_next, has_prev]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
        has_next:
          type: boolean
        has_prev:
          type: boolean
        next_page:
          type: integer
        prev_page:
          type: integer

    SupportedOAuthProviders:
      x-go-type: models.OAuthProvider
      x-go-type-import:
        path: IdentityX/models
      type: string
      enum: [ "google", "github" ]

    OAuthProviderDiscoveryItem:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/SupportedOAuthProviders'
          description: A provider the scope currently accepts logins with.

