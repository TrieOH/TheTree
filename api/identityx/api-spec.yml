  version: 0.22.0
  contact:
    name: TrieOH
    url: https://trieoh.com/support
    email: contact@trieoh.com
  license:
    name: TSAL
    url: https://github.com/TrieOH/TheTree/blob/main/api/identityx/LICENSE

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.identityx.trieoh.com
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Reserved for system level operations such as /health

  - name: authn
    description: Authentication - login, token issuance, and session management

  - name: organizations
    description: Organization creation, membership, and settings management

  - name: projects
    description: Project creation and multi-tenant project scoping

  - name: apikeys
    description: API key issuance, rotation, and revocation

  - name: capabilities
    description: Capability and permission grants for actors and projects

  - name: actors
    description: Actor lifecycle management (creation, lookup, deactivation)

  - name: profiles
    description: Actor profile data management

  - name: profile_schemas
    description: Schema definitions for validating actor profile data

externalDocs:
  description: Full TrieOH documentation
  url: https://docs.trieoh.com

# Either bearer token OR api key satisfies auth where not overridden per
# operation. Routes with `security: []` are public.
security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /docs/openapi.yml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: Get the OpenAPI specification
      description: |
        Returns this service's OpenAPI 3.1 specification in YAML — the
        same content as api/<svc>/api-spec.yml, embedded and served by
        the harness. Docs tooling fetches this URL to render the API
        reference. Public.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
                description: The OpenAPI 3.1 document in YAML.

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      description: |
        Harness-owned liveness probe. Returns 200 with a fixed body when
        the process is up. Not covered by rate limiting or auth.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: "ok"
                  service:
                    type: string
                    const: "IdentityX"
              example:
                status: ok
                service: IdentityX

  /auth/setup:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1setup'

  /auth/register:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1register'

  /auth/verify-email:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1verify-email'

  /auth/resend-verification:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1resend-verification'

  /auth/forgot-password:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1forgot-password'

  /auth/reset-password:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1reset-password'

  /auth/login:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1login'

  /auth/logout:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1logout'

  /auth/refresh:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1refresh'

  /auth/{provider}/connect:
    $ref: './internal/features/oauth_providers/spec.yml#/paths/~1auth~1{provider}~1connect'

  /auth/{provider}/callback:
    $ref: './internal/features/oauth_providers/spec.yml#/paths/~1auth~1{provider}~1callback'

  /auth/oauth-providers:
    $ref: './internal/features/oauth_providers/spec.yml#/paths/~1auth~1oauth-providers'

  /auth/introspect:
    $ref: './internal/features/authn/spec.yml#/paths/~1auth~1introspect'

  /.well-known/jwks.json:
    $ref: './internal/features/authn/spec.yml#/paths/~1.well-known~1jwks.json'

  /organizations:
    $ref: './internal/features/organizations/spec.yml#/paths/~1organizations'

  /organizations/{organization_id}/members:
    $ref: './internal/features/organizations/spec.yml#/paths/~1organizations~1{organization_id}~1members'

  /organizations/{organization_id}/projects:
    $ref: './internal/features/organizations/spec.yml#/paths/~1organizations~1{organization_id}~1projects'

  /organizations/{org_id}/projects/{project_id}/actors:
    $ref: './internal/features/organizations/spec.yml#/paths/~1organizations~1{org_id}~1projects~1{project_id}~1actors'

  /organizations/{organization_id}/projects/{project_id}/members:
    $ref: './internal/features/organizations/spec.yml#/paths/~1organizations~1{organization_id}~1projects~1{project_id}~1members'

  /organizations/{organization_id}/projects/{project_id}/actors/{actor_id}:
    $ref: './internal/features/organizations/spec.yml#/paths/~1organizations~1{organization_id}~1projects~1{project_id}~1actors~1{actor_id}'

  /projects:
    $ref: './internal/features/projects/spec.yml#/paths/~1projects'

  /projects/{project_id}/members:
    $ref: './internal/features/projects/spec.yml#/paths/~1projects~1{project_id}~1members'

  /projects/{project_id}/actors:
    $ref: './internal/features/actors/spec.yml#/paths/~1projects~1{project_id}~1actors'

  /projects/{project_id}/actors/{actor_id}:
    $ref: './internal/features/actors/spec.yml#/paths/~1projects~1{project_id}~1actors~1{actor_id}'

  /projects/{project_id}/actors/{actor_email}:by_email:
    $ref: './internal/features/actors/spec.yml#/paths/~1projects~1{project_id}~1actors~1{actor_email}:by_email'

  /projects/{project_id}/email-templates:
    $ref: './internal/features/email_templates/spec.yml#/paths/~1projects~1{project_id}~1email-templates'

  /projects/{project_id}/email-templates/{kind}:
    $ref: './internal/features/email_templates/spec.yml#/paths/~1projects~1{project_id}~1email-templates~1{kind}'

  /projects/{project_id}/terms-of-service:
    $ref: './internal/features/tos/spec.yml#/paths/~1projects~1{project_id}~1terms-of-service'

  /projects/{project_id}/terms-of-service/acceptances:
    $ref: './internal/features/tos/spec.yml#/paths/~1projects~1{project_id}~1terms-of-service~1acceptances'

  /projects/{project_id}/api_keys:
    $ref: './internal/features/api_keys/spec.yml#/paths/~1projects~1{project_id}~1api_keys'

  /projects/{project_id}/oauth-providers:
    $ref: './internal/features/oauth_providers/spec.yml#/paths/~1projects~1{project_id}~1oauth-providers'

  /oauth-providers/{oauth_provider_id}:
    $ref: './internal/features/oauth_providers/spec.yml#/paths/~1oauth-providers~1{oauth_provider_id}'

  /oauth-providers/{oauth_provider_id}/disable:
    $ref: './internal/features/oauth_providers/spec.yml#/paths/~1oauth-providers~1{oauth_provider_id}~1disable'

  /oauth-providers/{oauth_provider_id}/enable:
    $ref: './internal/features/oauth_providers/spec.yml#/paths/~1oauth-providers~1{oauth_provider_id}~1enable'

  /projects/{project_id}/capabilities:
    $ref: './internal/features/capabilities/spec.yml#/paths/~1projects~1{project_id}~1capabilities'

  /profile-schema:
    $ref: './internal/features/profile_schemas/spec.yml#/paths/~1profile-schema'

  /projects/{project_id}/profile-schema:
    $ref: './internal/features/profile_schemas/spec.yml#/paths/~1projects~1{project_id}~1profile-schema'

  /actors/{actor_id}/profile:
    $ref: './internal/features/profiles/spec.yml#/paths/~1actors~1{actor_id}~1profile'

  /projects/{project_id}/actors/{actor_id}/profile:
    $ref: './internal/features/profiles/spec.yml#/paths/~1projects~1{project_id}~1actors~1{actor_id}~1profile'

  /profiles/by-handle/{handle}:
    $ref: './internal/features/profiles/spec.yml#/paths/~1profiles~1by-handle~1{handle}'

  /profiles/outdated:
    $ref: './internal/features/profiles/spec.yml#/paths/~1profiles~1outdated'

  /projects/{project_id}/profiles/outdated:
    $ref: './internal/features/profiles/spec.yml#/paths/~1projects~1{project_id}~1profiles~1outdated'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by IdentityX, signed with Ed25519
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Static API key for server-to-server / project-scoped access

  parameters:
    ProjectIDQuery:
      name: project_id
      in: query
      required: false
      description: Project to scope the operation to. Omit for IdentityX itself.
      schema:
        $ref: '#/components/schemas/UUID'
    ProjectID:
      name: project_id
      in: path
      required: true
      description: Project ID.
      schema:
        $ref: '#/components/schemas/UUID'
    ActorID:
      name: actor_id
      in: path
      required: true
      description: Actor ID.
      schema:
        $ref: '#/components/schemas/UUID'

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    NullableUUID:
      type: [ string, "null" ]
      format: uuid
      x-go-type: '*uuid.UUID'
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: uuid

    UserTokensOutput:
      x-go-type: models.UserTokensOutput
      x-go-type-import:
        path: IdentityX/models
      type: object
      required: [access_token, refresh_token, access_expires_at, refresh_expires_at, domain]
      properties:
        access_token:
          type: string
          description: Ed25519-signed JWT carrying the actor identity.
        refresh_token:
          type: string
          description: JWT used to obtain a fresh token pair via /auth/refresh.
        access_expires_at:
          type: string
          format: date-time
          description: Expiration timestamp of the access token.
        refresh_expires_at:
          type: string
          format: date-time
          description: Expiration timestamp of the refresh token.
        domain:
          type: string
          description: Cookie domain the frontend should bind tokens to.
      description: Mirrors `models.UserTokensOutput`.

    ActorType:
      x-go-type: models.ActorType
      x-go-type-import:
        path: IdentityX/models
      type: string
      description: The kind of actor this identity represents.
      enum: [ human, service, machine ]

    Actor:
      x-go-type: models.Actor
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: A human, service, or machine identity. Mirrors `models.Actor`.
      required: [id, auth_method, type, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        project_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Project this actor is scoped to, if any.
        auth_method:
          type: string
          enum: [password, api_key, google_auth, github_auth]
          description: How this actor authenticates.
        verified_at:
          type: [ string, "null" ]
          format: date-time
          description: When the actor's email was verified, if ever.
        email:
          x-go-type: string
          type: [ string, "null" ]
          format: email
          description: Actor's email address.
        type:
          $ref: '#/components/schemas/ActorType'
        metadata:
          type: [ object, "null" ]
          description: Arbitrary actor metadata.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [ string, "null" ]
          format: date-time

    CreateActorRequest:
      type: object
      description: Request body for actor creation. Mirrors `models.CreateActorRequest`.
      required: [auth_method, type]
      properties:
        auth_method:
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=password api_key"
          type: string
          enum: [password, api_key]
          x-go-type: models.AuthMethod
          x-go-type-import:
            path: IdentityX/models
        type:
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=human service machine"
          $ref: '#/components/schemas/ActorType'
        email:
          x-oapi-codegen-extra-tags:
            validate: "omitempty,email"
          x-go-type: string
          type: [ string, "null" ]
          format: email
          description: Actor's email address.

    Project:
      x-go-type: models.Project
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: An IdentityX workspace under an organization. Mirrors `models.Project`.
      required: [id, owner_id, brand_slug, name, metadata, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        organization_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Organization this project belongs to, if any.
        owner_id:
          $ref: '#/components/schemas/UUID'
        brand_slug:
          type: string
          minLength: 3
          maxLength: 32
        name:
          type: string
          minLength: 3
        domain:
          type: [ string, "null" ]
          format: uri
          description: Verified custom domain, if configured.
        domain_verified_at:
          type: [ string, "null" ]
          format: date-time
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: [ string, "null" ]
          format: date-time

    ProjectRole:
      x-go-type: models.ProjectRole
      x-go-type-import:
        path: IdentityX/models
      type: string
      enum: [member, admin, owner]

    ProjectMember:
      x-go-type: models.ProjectMember
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: Membership of an actor in a project. Mirrors `models.ProjectMember`.
      required: [project_id, actor_id, role, metadata, joined_at]
      properties:
        project_id:
          $ref: '#/components/schemas/UUID'
        actor_id:
          $ref: '#/components/schemas/UUID'
        role:
          $ref: '#/components/schemas/ProjectRole'
        metadata:
          type: object
          additionalProperties: true
        joined_at:
          type: string
          format: date-time
