      summary: Upsert a platform actor's profile
      description: |
        Sets (or replaces) the platform-scoped profile of the given
        actor, validating against the active platform profile schema.
        Requires a platform-level client.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileRequest'
            example:
              profile:
                full_name: Jane Doe
      responses:
        '200':
          description: Profile upserted
          content:
