      operationId: getProjectProfileSchema
      summary: Get the project profile schema
      description: |
        Fetches the JSON Schema used to validate actor profiles within
        the project. Public read.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      x-problems: [401, 404, 500, 503]
      responses:
        '200':
          description: Project profile schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProfileSchema'
    put:
      tags: [profile_schemas]
      operationId: upsertProjectProfileSchema
      x-scope: platform-only
      summary: Upsert the project profile schema
      description: |
        Sets (or replaces) the JSON Schema for actor profiles within the
        project. Requires a platform-level client.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileSchemaRequest'
      x-problems: [400, 401, 404, 500, 503]
      responses:
        '200':
          description: Schema upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProfileSchema'

  /actors/{actor_id}/profile:
    get:
      tags: [profiles]
      operationId: getPlatformProfile
      x-scope: platform-only
      summary: Get a platform actor's profile
      description: |
        Fetches the platform-scoped profile (actor with no project) of
        the given actor. Public read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorID'
      x-problems: [401, 404, 500, 503]
      responses:
        '200':
          description: Actor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorProfile'
    put:
      tags: [profiles]
      operationId: upsertPlatformProfile
      x-scope: platform-only
      summary: Upsert a platform actor's profile
      description: |
        Sets (or replaces) the platform-scoped profile of the given
        actor, validating against the active platform profile schema.
        Requires a platform-level client.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileRequest'
            example:
              profile:
                full_name: Jane Doe
      x-problems: [400, 401, 404, 500, 503]
      responses:
        '200':
          description: Profile upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorProfile'

  /projects/{project_id}/actors/{actor_id}/profile:
    get:
      tags: [profiles]
      operationId: getProjectProfile
      summary: Get a project actor's profile
      description: |
        Fetches the project-scoped profile of the given actor within the
        project. Public read.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/ActorID'
      x-problems: [401, 404, 500, 503]
      responses:
        '200':
          description: Actor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorProfile'
    put:
      tags: [profiles]
      operationId: upsertProjectProfile
      summary: Upsert a project actor's profile
      description: |
        Sets (or replaces) the project-scoped profile of the given actor
        within the project, validating against the project's active
        profile schema. Project users may update their own profile;
        project admins/owners may update any profile in the project.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/ActorID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileRequest'
      x-problems: [400, 401, 403, 404, 409, 500, 503]
      responses:
        '200':
          description: Profile upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorProfile'

  /profiles/by-handle/{handle}:
    get:
      tags: [profiles]
      operationId: getProfileByHandle
      summary: Get a profile by handle
      description: |
        Fetches the profile with the given handle. Handles are unique when
        present, so at most one profile matches. Public read.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProfileHandle'
      x-problems: [401, 404, 500, 503]
      responses:
        '200':
          description: Actor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorProfile'

  /profiles/outdated:
    get:
      tags: [profiles]
      operationId: listOutdatedPlatformProfiles
      x-scope: platform-only
      summary: List outdated platform actor profiles
      description: |
        Lists platform-scoped actor profiles that failed to migrate to the
        active platform schema version and are flagged as outdated. The
        admin resolves them manually (edit via the profile upsert, or fix
        the schema). Requires a platform-level client.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-problems: [401, 500, 503]
      responses:
        '200':
          description: Outdated platform actor profiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActorProfile'
                    x-go-type: '[]ActorProfile'
                    x-go-type-skip-optional-pointer: true

  /projects/{project_id}/profiles/outdated:
    get:
      tags: [profiles]
      operationId: listOutdatedProjectProfiles
      summary: List outdated project actor profiles
      description: |
        Lists the project's actor profiles that failed to migrate to the
        active project schema version and are flagged as outdated. The
        admin resolves them manually. Requires a project admin.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      x-problems: [401, 403, 500, 503]
      responses:
        '200':
          description: Outdated project actor profiles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActorProfile'
                    x-go-type: '[]ActorProfile'
                    x-go-type-skip-optional-pointer: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by IdentityX, signed with Ed25519
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Static API key for server-to-server / project-scoped access

  parameters:
    ProjectIDQuery:
      name: project_id
      in: query
      required: false
      description: Project to scope the operation to. Omit for IdentityX itself.
      schema:
        $ref: '#/components/schemas/UUID'
    ProjectID:
      name: project_id
      in: path
      required: true
      description: Project ID.
      schema:
        $ref: '#/components/schemas/UUID'
    OAuthProviderID:
      name: oauth_provider_id
      in: path
      required: true
      description: OAuth provider configuration ID.
      schema:
        $ref: '#/components/schemas/UUID'
    OrganizationID:
      name: organization_id
      in: path
      required: true
      description: Organization ID.
      schema:
        $ref: '#/components/schemas/UUID'
    OrgID:
      name: org_id
      in: path
      required: true
      description: Organization ID.
      schema:
        $ref: '#/components/schemas/UUID'
    ActorID:
      name: actor_id
      in: path
      required: true
      description: Actor ID.
      schema:
        $ref: '#/components/schemas/UUID'
    ProfileHandle:
      name: handle
      in: path
      required: true
      description: Unique profile handle.
      schema:
        type: string
    EmailTemplateKind:
      name: kind
      in: path
      required: true
      description: Email template kind.
      schema:
        $ref: '#/components/schemas/EmailTemplateKind'

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid

    NullableUUID:
      type: [ string, "null" ]
      format: uuid
      x-go-type: '*uuid.UUID'
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/google/uuid

    SupportedOAuthProviders:
      x-go-type: models.OAuthProvider
      x-go-type-import:
        path: IdentityX/models
      type: string
      enum: [ "google", "github" ]

    OAuthProviderDiscoveryItem:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/SupportedOAuthProviders'
          description: A provider the scope currently accepts logins with.

    OAuthProviderOutput:
      x-go-type: models.ProjectOAuthProviders
      x-go-type-import:
        path: IdentityX/models
      type: object
      required: [id, project_id, provider, client_id, enabled, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        project_id:
          $ref: '#/components/schemas/UUID'
        provider:
          $ref: '#/components/schemas/SupportedOAuthProviders'
        client_id:
          type: string
          description: The provider-side client ID. The secret is never returned.
        callback_url:
          type: string
          format: uri
          description: The provider redirect URI this project registered, called back after consent.
        enabled:
          type: boolean
          description: Whether new logins via this provider are accepted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: Mirrors `models.ProjectOAuthProviders` (secret excluded from the wire representation).

    CreateOAuthProviderRequest:
      type: object
      required: [provider, client_id, client_secret, callback_url]
      properties:
        provider:
          $ref: '#/components/schemas/SupportedOAuthProviders'
        client_id:
          type: string
          minLength: 1
          description: The provider-side client ID.
        client_secret:
          type: string
          minLength: 1
          description: The provider-side client secret. Encrypted at rest.
        callback_url:
          type: string
          format: uri
          minLength: 1
          description: |
            The provider redirect URI this project registered in the
            provider console. Called back after consent.

    UpdateOAuthProviderRequest:
      type: object
      properties:
        client_id:
          type: string
          minLength: 1
          description: The provider-side client ID. Omitted keeps the stored value.
        client_secret:
          type: string
          minLength: 1
          description: The provider-side client secret. Omitted keeps the stored value.
        callback_url:
          type: string
          format: uri
          minLength: 1
          description: The provider redirect URI. Omitted keeps the stored value.

    CredentialRequest:
      type: object
      required: [email, password]
      properties:
        email:
          x-oapi-codegen-extra-tags:
            validate: "required,email,min=3,max=254"
          x-go-type: string
          type: string
          format: email
          description: User's email address.
          minLength: 3
          maxLength: 254
        password:
          x-oapi-codegen-extra-tags:
            validate: "required,passwd,min=8,max=72"
          type: string
          minLength: 8
          maxLength: 72
          description: User's password.
      description: |
        Request body for `/auth/setup`, `/auth/register`, and
        `/auth/login`. Mirrors `models.IDXRegisterRequest` /
        `models.IDXLoginRequest`.

    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/CredentialRequest'
        - type: object
          properties:
            accepted_tos:
              type: boolean
              description: |
                Explicit consent to the project's current terms of service
                (clickwrap). Required when the target project has terms —
                LGPD art. 8 requires express consent; a missing flag is a
                400. Ignored for platform registrations and projects
                without terms.
      description: Request body for `/auth/register`.

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: The HMAC JWT from the verification link.
      description: Request body for `POST /auth/verify-email`.

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          x-oapi-codegen-extra-tags:
            validate: "required,email,min=3,max=254"
          x-go-type: string
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Email address to (re)send the verification link to.
        project_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Project the actor belongs to. Omit for IdentityX itself.
      description: Request body for `POST /auth/resend-verification`.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          x-oapi-codegen-extra-tags:
            validate: "required,email,min=3,max=254"
          x-go-type: string
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Email address to send the reset link to.
        project_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Project the actor belongs to. Omit for IdentityX itself.
      description: Request body for `POST /auth/forgot-password`.

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          description: The HMAC JWT from the reset link.
        password:
          x-oapi-codegen-extra-tags:
            validate: "required,passwd,min=8,max=72"
          type: string
          minLength: 8
          maxLength: 72
          description: New password.
      description: Request body for `POST /auth/reset-password`.

    EmailTemplateKind:
      type: string
      enum: [verify, reset, tos]
      description: The kind of auth email. `verify`, `reset`, and the ToS-change notice `tos`.

    EmailTemplateBody:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Email subject. A Go template rendered with the same variables
            as the body (`ActionURL`, `ProjectName`, `Expiry`,
            `ProjectDomain`, `Email`).
        body:
          type: string
          minLength: 1
          description: |
            HTML email body. A Go template rendered with the same
            variables; must include `{{.ActionURL}}` at least once — the
            actionable link always comes from IdentityX.
      description: Request body for `PUT /projects/{project_id}/email-templates/{kind}`.

    EffectiveEmailTemplate:
      type: object
      required: [kind, subject, body, source]
      properties:
        kind:
          $ref: '#/components/schemas/EmailTemplateKind'
        subject:
          type: string
          description: Effective subject (override or default).
        body:
          type: string
          description: Effective body (override or default).
        source:
          type: string
          enum: [default, override]
          description: Whether this is the project's override or the built-in default.
      description: |
        The effective template for one kind, as served by the email
        template endpoints.

    TosContentBody:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: The full terms document (plain text or HTML).
      description: Request body for introducing or updating a project's terms of service.

    ProjectTos:
      type: object
      required: [id, project_id, version, content, effective_at, created_at, updated_at]
      properties:
        id:
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          type: string
          format: uuid
        project_id:
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Monotonically increasing; bumped on every update.
        content:
          type: string
          description: The full terms document.
        effective_at:
          type: string
          format: date-time
          description: When this version takes effect for existing users (30 days after the announcement).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: A project's current terms of service.

    TosAcceptance:
      type: object
      required: [id, actor_id, project_id, tos_version, content_hash, source, accepted_at]
      properties:
        id:
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          type: string
          format: uuid
        actor_id:
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          type: string
          format: uuid
        project_id:
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
          type: string
          format: uuid
        tos_version:
          type: integer
          description: The terms version the actor agreed to.
        content_hash:
          type: string
          description: SHA-256 of the accepted content — the consent proof artifact (LGPD art. 8 §2).
        source:
          type: string
          enum: [clickwrap, continued_use]
          description: |
            How consent was given. `clickwrap` is an explicit box-check
            (registration or the accept endpoint); `continued_use` is the
            first login after the version's effective date.
        accepted_at:
          type: string
          format: date-time
        actor_email:
          type: string
          nullable: true
          description: The accepting actor's email (present on the admin listing).
      description: One actor's recorded agreement to one terms version.

    UserTokensOutput:
      x-go-type: models.UserTokensOutput
      x-go-type-import:
        path: IdentityX/models
      type: object
      required: [access_token, refresh_token, access_expires_at, refresh_expires_at, domain]
      properties:
        access_token:
          type: string
          description: Ed25519-signed JWT carrying the actor identity.
        refresh_token:
          type: string
          description: JWT used to obtain a fresh token pair via /auth/refresh.
        access_expires_at:
          type: string
          format: date-time
          description: Expiration timestamp of the access token.
        refresh_expires_at:
          type: string
          format: date-time
          description: Expiration timestamp of the refresh token.
        domain:
          type: string
          description: Cookie domain the frontend should bind tokens to.
      description: Mirrors `models.UserTokensOutput`.

    Identity:
      x-go-type: models.Identity
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: |
        Identity resolved from the current credential (session JWT or API
        key), returned by `/auth/introspect`. Mirrors `models.Identity`.
      required: [subject, cred]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        cred:
          $ref: '#/components/schemas/Credential'

    Subject:
      x-go-type: models.Subject
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: The actor this identity resolves to. Mirrors `models.Subject`.
      required: [id, type, capabilities]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
          description: Unique identifier of the actor.
        project_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Project this actor is scoped to, if any.
        email:
          x-go-type: string
          type: [ string, "null" ]
          format: email
          description: Actor's email address, if applicable for this actor type.
        type:
          $ref: '#/components/schemas/ActorType'
        verified_at:
          type: [ string, "null" ]
          format: date-time
          description: |
            When the actor's email was verified (via the verification link
            or an OAuth provider). Null means unverified; downstream
            applications decide what to do with it.
        capabilities:
          type: [ object, "null" ]
          description: |
            Actor's capability grants as a JSON array of `resource:action`
            strings (JSON-encoded array carried in a JSON field). Shape is
            opaque to the API contract.
        metadata:
          type: [ object, "null" ]
          description: Arbitrary actor metadata, opaque to the API contract.
          additionalProperties: true

    Credential:
      x-go-type: models.Credential
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: The credential used to authenticate this request. Mirrors `models.Credential`.
      required: [type]
      properties:
        id:
          $ref: '#/components/schemas/NullableUUID'
          description: |
            Identifier of the credential, present for stateful credentials
            (e.g. API keys). Null for stateless credentials (e.g. JWTs).
        type:
          $ref: '#/components/schemas/CredentialType'

    ActorType:
      x-go-type: models.ActorType
      x-go-type-import:
        path: IdentityX/models
      type: string
      description: The kind of actor this identity represents.
      enum: [ human, service, machine ]

    CredentialType:
      x-go-type: models.CredentialType
      x-go-type-import:
        path: IdentityX/models
      type: string
      description: The mechanism used to authenticate this identity.
      enum: [ token, api_key ]

    Actor:
      x-go-type: models.Actor
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: A human, service, or machine identity. Mirrors `models.Actor`.
      required: [id, auth_method, type, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        project_id:
          $ref: '#/components/schemas/NullableUUID'
          description: Project this actor is scoped to, if any.
        auth_method:
          type: string
          enum: [password, api_key, google_auth, github_auth]
          description: How this actor authenticates.
        verified_at:
          type: [ string, "null" ]
          format: date-time
          description: When the actor's email was verified, if ever.
        email:
          x-go-type: string
          type: [ string, "null" ]
          format: email
          description: Actor's email address.
        type:
          $ref: '#/components/schemas/ActorType'
        metadata:
          type: [ object, "null" ]
          description: Arbitrary actor metadata.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [ string, "null" ]
          format: date-time

    CreateActorRequest:
      type: object
      description: Request body for actor creation. Mirrors `models.CreateActorRequest`.
      required: [auth_method, type]
      properties:
        auth_method:
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=password api_key"
          type: string
          enum: [password, api_key]
          x-go-type: models.AuthMethod
          x-go-type-import:
            path: IdentityX/models
        type:
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=human service machine"
          $ref: '#/components/schemas/ActorType'
        email:
          x-oapi-codegen-extra-tags:
            validate: "omitempty,email"
          x-go-type: string
          type: [ string, "null" ]
          format: email
          description: Actor's email address.

    ActorProfile:
      x-go-type: models.ActorProfile
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: An actor's profile payload. Mirrors `models.ActorProfile`.
      required: [actor_id, profile, schema_version, outdated, updated_at]
      properties:
        actor_id:
          $ref: '#/components/schemas/UUID'
        handle:
          type: string
          nullable: true
          description: Unique handle for the profile. Null when not set.
        pfp_url:
          type: string
          nullable: true
          description: Profile picture URL, first-class column. Null when not set.
        profile:
          type: object
          description: The profile data, validated against the active profile schema.
          additionalProperties: true
        schema_version:
          type: integer
          description: Profile schema version the profile was validated against.
        outdated:
          type: boolean
          description: Whether the profile failed to migrate to the active schema.
        updated_at:
          type: string
          format: date-time

    UpsertProfileRequest:
      type: object
      description: Request body for profile upserts. Mirrors `models.UpsertProfileRequest`.
      required: [profile]
      properties:
        handle:
          type: string
          nullable: true
          description: >
            Optional unique handle for the profile. Setting a handle that is
            already in use fails; sending null or omitting the field leaves
            the handle unchanged.
        pfp_url:
          type: string
          nullable: true
          description: >
            Profile picture URL, first-class column. Sending null or omitting
            the field leaves it unchanged.
        profile:
          type: object
          description: Profile data to store, validated against the active schema.
          additionalProperties: true
          x-go-type: 'json.RawMessage'

    ProjectProfileSchema:
      x-go-type: models.ProjectProfileSchema
      x-go-type-import:
        path: IdentityX/models
      type: object
      description: A profile validation schema. Mirrors `models.ProjectProfileSchema`.
      required: [schema, version, active, created_at, updated_at]
      properties:
        project_id:
          $ref: '#/components/schemas/NullableUUID'
