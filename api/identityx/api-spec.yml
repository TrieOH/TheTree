          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [projects]
      operationId: putEmailTemplate
      summary: Upsert a project's email template override
      description: |
        Saves the project's override for one kind. The body is a Go
        template rendered with the same variables as the built-in
        defaults: `ActionURL`, `ProjectName`, `Expiry`, `ProjectDomain`,
        `Email`. The body must reference `{{.ActionURL}}` at least once
        (the actionable link always comes from IdentityX) and must render;
        violations are rejected with 422-style validation errors. The
        authenticated actor must be an admin or owner of the project.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/EmailTemplateKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateBody'
            example:
              subject: Welcome to Acme — confirm your email
              body: |
                <p>Hi there!</p>
                <p><a href="{{.ActionURL}}">Confirm my email</a></p>
      responses:
        '200':
          description: Email template override saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EffectiveEmailTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Template fails the mandate (missing ActionURL) or does not render
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [projects]
      operationId: deleteEmailTemplate
      summary: Delete a project's email template override
      description: |
        Removes the project's override for one kind, restoring the
        built-in default. Deleting a kind that has no override is a
        no-op. The authenticated actor must be an admin or owner of the
        project.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/EmailTemplateKind'
      responses:
        '200':
          description: Email template override removed (default restored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/{project_id}/api_keys:
    post:
      tags: [apikeys]
      operationId: createAPIKey
      summary: Create an API key
      description: |
        Creates an API key bound to a subject (actor) in the project,
        optionally scoped to a set of capability IDs and an expiry. The
        full raw key is returned exactly once in `data.raw_key` — store
        it, it cannot be retrieved again. The authenticated actor must be
        a platform-level client.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
            example:
              subject_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              capabilities:
                - 3fa85f64-5717-4562-b3fc-2c963f66afa7
              name: checkout-prod
              env: production
              expires_at: '2027-01-01T00:00:00Z'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateAPIKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/{project_id}/oauth-providers:
    get:
      tags: [oauthproviders]
      operationId: listProjectOAuthProviders
      summary: List the project's OAuth providers
      description: |
        Lists the OAuth providers configured for the project, including
        disabled ones and their status. The client secret is never
        returned. Requires a project membership (member or above).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Configured OAuth providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OAuthProviderOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [oauthproviders]
      operationId: createProjectOAuthProvider
      summary: Configure an OAuth provider for the project
      description: |
        Stores the provider's credentials for the project. The client
        secret is encrypted at rest and never returned. Requires a project
        admin or owner. Enabling/disabling happens via
        `/oauth-providers/{oauth_provider_id}/enable|disable`.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuthProviderRequest'
            example:
              provider: google
              client_id: 1234567890-abc.apps.googleusercontent.com
              client_secret: GOCSPX-example
              callback_url: https://myapp.example.com/auth/callback
      responses:
        '201':
          description: Provider configured
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthProviderOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /oauth-providers/{oauth_provider_id}:
    patch:
      tags: [oauthproviders]
      operationId: updateOAuthProvider
      summary: Update an OAuth provider's credentials
      description: |
        Partially updates a project's OAuth provider configuration. A
        field left out is kept as-is; the secret cannot be read back and is
        only replaced when a new one is sent. Requires a project admin or
        owner.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOAuthProviderRequest'
            example:
              client_secret: GOCSPX-new-secret
      responses:
        '200':
          description: Provider updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthProviderOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [oauthproviders]
      operationId: deleteOAuthProvider
      summary: Remove an OAuth provider from the project
      description: |
        Hard-deletes the project's OAuth provider configuration. Blocks
        new logins via this provider; already-linked external identities
        remain valid. Requires a project admin or owner.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderID'
      responses:
        '200':
          description: Provider removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /oauth-providers/{oauth_provider_id}/disable:
    post:
      tags: [oauthproviders]
      operationId: disableOAuthProvider
      summary: Disable an OAuth provider
      description: |
        Blocks new logins via this provider for the project. Users who
        already linked an external identity with it can still log in.
        Requires a project admin or owner.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderID'
      responses:
        '200':
          description: Provider disabled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthProviderOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /oauth-providers/{oauth_provider_id}/enable:
    post:
      tags: [oauthproviders]
      operationId: enableOAuthProvider
      summary: Enable an OAuth provider
      description: |
        Re-enables an OAuth provider for the project, allowing new logins
