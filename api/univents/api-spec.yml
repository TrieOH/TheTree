              signatory_title: Head of Education
              signatory_email: jane@example.com
              expires_in_days: 14
      responses:
        '201':
          description: Signature request created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
