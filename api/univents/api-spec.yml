components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by IdentityX, signed with Ed25519

  parameters:
    EventID:
      name: event_id
      in: path
      required: true
      description: Event ID.
      schema:
        $ref: '#/components/schemas/UUID'
    EditionID:
      name: edition_id
      in: path
      required: true
      description: Edition ID.
      schema:
        $ref: '#/components/schemas/UUID'

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: uuid

    NullableUUID:
      type: [ string, "null" ]
      format: uuid
      x-go-type: '*uuid.UUID'
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: uuid

    EventStatus:
      x-go-type: models.EventStatus
      x-go-type-import:
        path: univents/models
      type: string
      enum: [draft, active, discontinued]

    Event:
      x-go-type: models.Event
      x-go-type-import:
        path: univents/models
      type: object
      description: An event. Mirrors `models.Event`.
      required: [id, owner_id, full_name, slug, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        owner_id:
          $ref: '#/components/schemas/UUID'
        full_name:
          type: string
        acronym:
          type: [ string, "null" ]
        slug:
          type: string
        description:
          type: [ string, "null" ]
        style:
          type: [ object, "null" ]
          description: Styling hints for the event's public pages.
          additionalProperties: true
        status:
          $ref: '#/components/schemas/EventStatus'
        payssage_seller_id:
          $ref: '#/components/schemas/NullableUUID'
        payssage_public_key:
          type: [ string, "null" ]
        logo_url:
          type: [ string, "null" ]
          format: uri
        banner_url:
          type: [ string, "null" ]
          format: uri
        contact_email:
          x-go-type: string
          type: [ string, "null" ]
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [ string, "null" ]
          format: date-time
        deleted_at:
          type: [ string, "null" ]
          format: date-time

    PurchaseStatus:
      type: string
      description: Lifecycle of a purchase (D4). `pending` is a reservation; the webhook receiver (split 4) approves, the expiry worker (split 7) expires, and a failed/rejected payment lands in `failed`/`rejected` — distinct from `cancelled`, which is reserved for the customer (or the seller) cancelling an order. `refunded` (refund plan slice 3) is an approved order whose payment was reversed, webhook-confirmed via `payment.refunded`.
      enum: [pending, approved, expired, cancelled, failed, rejected, refunded]

    PurchaseItemType:
      type: string
      description: What kind of item a purchase line refers to — one of the three purchasable tables (D4).
      enum: [ticket, product, program_occurrence]

    PurchaseItem:
      type: object
      description: One line of a purchase — a reserved/ordered item; `purchase_items` is the availability ledger (D4).
      required: [item_type, item_id, quantity, unit_price_cents]
      properties:
        item_type:
          $ref: '#/components/schemas/PurchaseItemType'
        item_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: integer
          minimum: 1
          description: How many units of this item the purchase holds.
        unit_price_cents:
          type: integer
          format: int64
          description: Server-computed unit price at checkout, in cents.

    Purchase:
      type: object
      description: |
        One purchase with its items — the shared read shape (used by
        `listMyPurchases` and, plus `intent_status`, by `getCheckout`).
        Mirrors the split-6 WS snapshot and split-7 checkout response so the
        front treats resume == snapshot == checkout uniformly.
      required: [purchase_id, edition_id, status, total_cents, currency, expires_at, items]
      properties:
        purchase_id:
          $ref: '#/components/schemas/UUID'
        edition_id:
          $ref: '#/components/schemas/UUID'
        status:
          $ref: '#/components/schemas/PurchaseStatus'
        status_reason:
          type: [ string, "null" ]
          description: Why the purchase is in its current status (e.g. `refunded_after_expiry`, D1).
        total_cents:
          type: integer
          format: int64
        currency:
          type: string
        payment_method:
          type: [ string, "null" ]
        payssage_intent_id:
          $ref: '#/components/schemas/NullableUUID'
          description: The Payssage intent correlation key (D2). Null for free orders and pre-checkout seeds.
        payer_email:
          type: [ string, "null" ]
          description: The checkout payer's email — the person the payment provider will refund (refund plan B3). Surfaced on the organizer orders read. Null for free orders.
        qr_code:
          type: [ string, "null" ]
        qr_code_base64:
          type: [ string, "null" ]
        expires_at:
          type: string
          format: date-time
          description: Reservation deadline (checkout time + 10:01, split 7).
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'

    TicketType:
      x-go-type: models.TicketType
      x-go-type-import:
        path: univents/models
      type: object
      description: A purchasable ticket type. `price_cents` is integer cents. Mirrors `models.TicketType`.
      required: [id, edition_id, name, access_level, price_cents, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        edition_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        description:
          type: [ string, "null" ]
        access_level:
          type: integer
          description: Minimum access level the ticket grants (gates areas/programs).
        price_cents:
          type: integer
          format: int64
          description: Price in integer cents.
        max_quantity:
          type: [ integer, "null" ]
          description: Maximum number of tickets for sale; null = unlimited.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [ string, "null" ]
          format: date-time
        deleted_at:
          type: [ string, "null" ]
          format: date-time

    BadgeEmission:
      x-go-type: models.BadgeEmission
      x-go-type-import:
        path: univents/models
      type: object
      description: One badge awarded to a person for an edition. Mirrors `models.BadgeEmission`.
      required: [id, edition_id, user_id, origin, status, emitted_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        edition_id:
