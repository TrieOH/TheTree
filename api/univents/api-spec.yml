openapi: 3.1.0

info:
  title: Univents API
  summary: Events, editions, ticketing, and certifications service for TrieOH
  description: |
    Univents is TrieOH's events service: events and editions (runs),
    ticket types and products, programs (schedules), badge and
    certification templates, and signature workflows for certificates.

    ## Authentication

    All protected endpoints require a bearer JWT issued by IdentityX:

    | Scheme | Header |
    |---|---|
    | Bearer JWT | `Authorization: Bearer <token>` |

    Public (read-only) endpoints take no auth: event/edition browsing,
    products, programs, signatures, and certification verification.

    ### Signature-request tokens

    The signature fulfillment routes — `POST /signature-requests/fulfill`,
    `POST /signature-requests/deny`, `POST /signatures/revoke` — are NOT
    JWT-authenticated. They are authenticated by an HMAC-signed JWT passed
    as the `token` query parameter (issued when the signature request was
    created). The token binds the request to a single signature
    request/edition.

    ## Responses

    A successful response's body is the operation's payload itself; an
    operation with nothing to return answers `204 No Content`. A list is
    an object, `{ "items": [ ... ] }`, so paging fields can sit beside the
    items later.

    A failed response's body is an RFC 9457 problem, served as
    `application/problem+json`:

    ```json
    {
      "type": "https://api.univents.com.br/problems/validation",
      "status": 400,
      "title": "Validation Failed",
      "detail": "invalid request body: name: this field is required",
      "instance": "/namespaces",
      "errors": [{ "field": "name", "message": "this field is required" }]
    }
    ```

    `type` identifies the problem and resolves to its documentation;
    `title` and `status` are fixed per problem, `detail` says what went
    wrong this time, and `instance` is the request path. `errors` is
    present only when the failure names request fields. Each operation
    lists the problems it can answer with; a 500 reads `Internal Server
    Error`.

    ## Custom methods

    A few lookups are AIP custom methods (`:verb` suffix, AIP-136): they
    look up a resource by a natural key instead of its ID:

    - `GET /events/{event_slug}:by-slug`
    - `GET /events/{event_slug}:by-slug/editions/{edition_slug}:by-slug`
    - `GET /editions/{edition_id}/products/{vendor_code}:by-code`
    - `GET /editions/{edition_id}/variants/{vendor_code}:by-code`

    These are part of the public interface — the frontend depends on
    them — and must not be renamed or removed.

    ## Amounts

    Prices are integer cents (`price_cents`, `price`) — `int64`, never
    floats.

    ## Raw realtime routes (not spec ops)

    Two live surfaces are **raw routes** — deliberately NOT OpenAPI
    operations: WebSocket handshakes cannot carry Authorization headers,
    and streaming responses must bypass the strict server's validation
    machinery (which buffers the body). They are documented here instead.

    ### `WS /ws?token=...` — per-purchase socket (one-time token)

    The only live-update channel for a buyer. Opens with the one-time token
    from `GET /ws/token` (proves prior REST auth for this purchase);
    missing/already-used/expired tokens are rejected (401). The socket
    first receives the current state, then live frames until a terminal
    event closes it:

    ```json
    {"type":"purchase.snapshot","payload":{"purchase_id":"…","edition_id":"…","status":"pending","intent_id":"…","intent_status":"pending","total_cents":1234,"items":[],"expires_at":"…"}}
    {"type":"intent.updated","payload":{"purchase_id":"…","intent_id":"…","status":"succeeded"}}
    {"type":"purchase.confirmed","payload":{"purchase_id":"…"}}
    {"type":"purchase.expired","payload":{"purchase_id":"…"}}
    {"type":"purchase.cancelled","payload":{"purchase_id":"…","status_detail":"insufficient_funds"}}
    ```

    The snapshot mirrors the `getCheckout` resume shape (front treats
    resume == snapshot == checkout uniformly) and carries `intent_status`
    best-effort when the purchase is pending. A reconnect always uses a
    fresh token and restores context from the snapshot — no resume polling.
    The socket closes on any terminal event (confirmed/expired/cancelled)
    and on the cancelled frame the `status_detail` is the provider's
    failure vocabulary fetched via `GetIntent` (best-effort).

    ### `GET /editions/{edition_id}/store/stream` — storefront SSE (public)

    One stream per edition: on connect it sends `event: snapshot` with a
    JSON array of every purchasable item's stock position, then relays
    `event: stock` deltas — `{"id": "…", "item_type": "ticket", "stock": 12}`
    (`item_type` is one of `ticket | product | program_occurrence`; `stock`
    is `null` when the item is unlimited). Numbers are always recomputed
    from the DB by the relay — publishers never send stock values. A `: ping`
    comment line keeps the stream alive every ~30s.

    ## Rate limits

    The harness applies a fixed rate limit of 400 requests/second with a
    burst of 20, keyed by client IP. Exceeded requests receive
    `429 TOO_MANY_REQUESTS`.
