  /signature-requests/fulfill:
    post:
      tags: [signatures]
      operationId: fulfillSignatureRequest
      summary: Fulfill a signature request
      description: |
        Completes a pending signature request by uploading the signatory's
        signature image. Authenticated by the signature-request token
        passed as the `token` query parameter (NOT a JWT). The token
        binds this call to a single request/edition.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: HMAC-signed signature-request token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_url]
              properties:
                image_url:
                  type: string
                  format: uri
                  description: URL of the uploaded signature image.
            example:
              image_url: https://cdn.trieoh.com/signatures/jane.png
      responses:
        '201':
          description: Signature created from the fulfilled request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Signature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

