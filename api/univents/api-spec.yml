  contact:
    name: TrieOH
    url: https://trieoh.com/support
    email: contact@trieoh.com
  license:
    name: TSAL
    url: https://github.com/TrieOH/TheTree/blob/main/api/univents/LICENSE

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.univents.com.br
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Reserved for system level operations such as /health

  - name: events
    description: Event lifecycle, members, and public browsing

  - name: editions
    description: Edition (event run) lifecycle, drafts, and publication

  - name: ticket_types
    description: Ticket types for an edition

  - name: products
    description: Products and variants (merchandise) for an edition

  - name: programs
    description: Program schedules and occurrences

  - name: badges
    description: Badge templates for an edition

  - name: signatures
    description: Signature records, signature requests, and fulfillment

  - name: certifications
    description: Certification templates, emission, and verification

  - name: webhooks
    description: Payssage webhook ingestion (payment confirmation)

  - name: checkouts
    description: Checkout resume — the buyer's source of truth (read-only)

  - name: purchases
    description: The buyer's purchase history (read-only)

  - name: realtime
    description: Live surfaces — the WebSocket token endpoint (the sockets
      themselves are raw routes, documented in the top-level description)

  - name: store
    description: Storefront stock — snapshot availability reads (the live
      SSE stream itself is a raw route, documented in the top-level description)

externalDocs:
  description: Full TrieOH documentation
  url: https://docs.trieoh.com

security:
  - bearerAuth: []

paths:
  /docs/openapi.yml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: Get the OpenAPI specification
      description: |
        Returns this service's OpenAPI 3.1 specification in YAML — the
        same content as api/<svc>/api-spec.yml, embedded and served by
        the harness. Docs tooling fetches this URL to render the API
        reference. Public.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
                description: The OpenAPI 3.1 document in YAML.

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      description: Harness-owned liveness probe. Public.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: "ok"
                  service:
                    type: string
                    const: "Univents"

  /events:
    $ref: './internal/features/events/spec.yml#/paths/~1events'

  /events/{event_slug}:by-slug:
    $ref: './internal/features/events/spec.yml#/paths/~1events~1{event_slug}:by-slug'

