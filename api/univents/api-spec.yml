  /webhooks/payssage:
    post:
      tags: [webhooks]
      operationId: receivePayssageWebhook
      summary: Receive a Payssage webhook delivery
      description: |
        Ingestion endpoint called by Payssage when a payment event occurs on
        an intent. The body is the Payssage delivery envelope (D2) — the
        correlation key is `intent_id`, never a provider-specific id:

        ```json
        {
          "intent_id": "...", "wallet_id": "...", "provider": "mercadopago",
          "external_id": "<provider_payment_id>",
          "event_type": "payment.succeeded",
          "payload": { "...": "raw provider payload" }
        }
        ```

        Authenticated by the `X-Payssage-Signature` header — hex
        (HMAC-SHA256(raw body, `PAYSSAGE_WEBHOOK_SECRET`)). A signature
        mismatch is rejected with 400 (Payssage does not retry). Returns 200
        after successful processing so Payssage stops retrying; returns
        non-2xx when the purchase cannot be correlated yet (card race, D3)
        so Payssage retries. This is the only component that confirms
        payment — checkout never self-approves (D3). Public: Payssage
        cannot send an Authorization header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivePayssageWebhookRequest'
      responses:
        '200':
          description: Webhook acknowledged (processed or expected-ignored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by IdentityX, signed with Ed25519

  parameters:
    EventID:
      name: event_id
      in: path
      required: true
      description: Event ID.
      schema:
        $ref: '#/components/schemas/UUID'
    EditionID:
      name: edition_id
      in: path
      required: true
      description: Edition ID.
      schema:
        $ref: '#/components/schemas/UUID'

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions for the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid

    NullableUUID:
      type: [ string, "null" ]
      format: uuid
      x-go-type: '*uuid.UUID'
      x-go-type-skip-optional-pointer: true
      x-go-type-import:
        path: github.com/google/uuid

    Response:
      type: object
      description: |
        The `fun.Response` envelope wrapping every JSON payload. On
        success `data` carries the operation payload; on failure `error`
        carries the AppError.
      required: [code, message, timestamp, module]
      properties:
        code:
          type: integer
          description: HTTP status code, duplicated for convenience.
        message:
          type: string
          description: Informational message; often empty on success.
        data:
          type: object
          description: The operation payload. Shape is documented per operation.
        error:
          allOf:
            - $ref: '#/components/schemas/Error'
          description: Present (non-null) only on failure.
        pagination:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
          description: Present only on paged list endpoints.
        timestamp:
          type: string
          format: date-time
        module:
          type: string
          description: Service that produced the response.

    Error:
      type: object
      title: AppError
      description: The `fun.AppError` object carried in the envelope's `error` field.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - PAYMENT_REQUIRED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - CONFLICT
            - UNPROCESSABLE_ENTITY
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
            - NOT_IMPLEMENTED
            - BAD_GATEWAY
            - SERVICE_UNAVAILABLE
        message:
          type: string
        fields:
          type: array
          description: Per-field validation errors (validation failures only).
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        meta:
          type: object
          description: Arbitrary key/value context.
          additionalProperties: true
        debug:
          type: object
          description: Development-only diagnostics; stripped outside development environments.
          properties:
            raw_error:
              type: string
            stack_trace:
              type: string

    ErrorResponse:
      type: object
      description: The envelope as sent on failure.
      required: [code, message, error, timestamp, module]
      properties:
        code:
          type: integer
        message:
          type: string
        error:
          $ref: '#/components/schemas/Error'
        timestamp:
          type: string
          format: date-time
        module:
          type: string
          description: Service that produced the response.

    PaginationMeta:
      type: object
      description: Pagination metadata for paged list endpoints (currently unused by Univents routes).
      required: [page, limit, total, has_next, has_prev]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
        has_next:
          type: boolean
        has_prev:
          type: boolean
        next_page:
          type: integer
        prev_page:
          type: integer

    EventStatus:
