openapi: 3.1.0

info:
  title: Univents API
  summary: Events, editions, ticketing, and certifications service for TrieOH
  description: |
    Univents is TrieOH's events service: events and editions (runs),
    ticket types and products, programs (schedules), badge and
    certification templates, and signature workflows for certificates.

    ## Authentication

    All protected endpoints require a bearer JWT issued by IdentityX:

    | Scheme | Header |
    |---|---|
    | Bearer JWT | `Authorization: Bearer <token>` |

    Public (read-only) endpoints take no auth: event/edition browsing,
    products, programs, signatures, and certification verification.

    ### Signature-request tokens

    The signature fulfillment routes — `POST /signature-requests/fulfill`,
    `POST /signature-requests/deny`, `POST /signatures/revoke` — are NOT
    JWT-authenticated. They are authenticated by an HMAC-signed JWT passed
    as the `token` query parameter (issued when the signature request was
    created). The token binds the request to a single signature
    request/edition.

    ## Response envelope

    Every JSON response is the `fun.Response` envelope:

    ```json
    {
      "code": 200,
      "message": "",
      "data": { "...": "operation payload" },
      "error": null,
      "pagination": null,
      "timestamp": "2026-01-01T12:00:00Z",
      "module": "Univents"
    }
    ```

    - Success: `data` carries the payload. Errors: `error` carries an
      `AppError` — `{ "code", "message", "fields", "meta" }`.
    - `pagination` is reserved for paged list endpoints (currently
      unused by Univents routes).

    ## Error codes → HTTP status

    The `error.code` sentinel maps to the HTTP status:

    | code | status |
    |---|---|
    | `BAD_REQUEST`, `VALIDATION_ERROR` | 400 |
    | `UNAUTHORIZED` | 401 |
    | `PAYMENT_REQUIRED` | 402 |
    | `FORBIDDEN` | 403 |
    | `NOT_FOUND` | 404 |
    | `METHOD_NOT_ALLOWED` | 405 |
    | `CONFLICT` | 409 |
    | `UNPROCESSABLE_ENTITY` | 422 |
    | `TOO_MANY_REQUESTS` | 429 |
    | `INTERNAL_ERROR` | 500 |
    | `NOT_IMPLEMENTED` | 501 |
    | `BAD_GATEWAY` | 502 |
    | `SERVICE_UNAVAILABLE` | 503 |

    ## Custom methods

    A few lookups are AIP custom methods (`:verb` suffix, AIP-136): they
    look up a resource by a natural key instead of its ID:

    - `GET /events/{event_slug}:by-slug`
    - `GET /events/{event_slug}:by-slug/editions/{edition_slug}:by-slug`
    - `GET /editions/{edition_id}/products/{vendor_code}:by-code`
    - `GET /editions/{edition_id}/variants/{vendor_code}:by-code`

    These are part of the public interface — the frontend depends on
    them — and must not be renamed or removed.

    ## Amounts

    Prices are integer cents (`price_cents`, `price`) — `int64`, never
    floats.

    ## Rate limits

    The harness applies a fixed rate limit of 400 requests/second with a
    burst of 20, keyed by client IP. Exceeded requests receive
    `429 TOO_MANY_REQUESTS`.
  version: 0.1.0
  contact:
    name: TrieOH
    url: https://trieoh.com/support
    email: contact@trieoh.com
  license:
    name: TSAL
    url: https://git.trieoh.com/TrieOH/TheTree/src/branch/main/api/univents/LICENSE

jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: https://api.univents.com.br
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Reserved for system level operations such as /health

  - name: events
    description: Event lifecycle, members, and public browsing

  - name: editions
    description: Edition (event run) lifecycle, drafts, and publication

  - name: ticket_types
    description: Ticket types for an edition

  - name: products
    description: Products and variants (merchandise) for an edition

  - name: programs
    description: Program schedules and occurrences

  - name: badges
    description: Badge templates for an edition

  - name: signatures
    description: Signature records, signature requests, and fulfillment

  - name: certifications
    description: Certification templates, emission, and verification

  - name: webhooks
    description: Payssage webhook ingestion (payment confirmation)

externalDocs:
  description: Full TrieOH documentation
  url: https://docs.trieoh.com

security:
  - bearerAuth: []

paths:
  /docs/openapi.yml:
    get:
      tags: [system]
      operationId: getOpenAPISpec
      summary: Get the OpenAPI specification
      description: |
        Returns this service's OpenAPI 3.1 specification in YAML — the
        same content as api/<svc>/api-spec.yml, embedded and served by
        the harness. Docs tooling fetches this URL to render the API
        reference. Public.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
                description: The OpenAPI 3.1 document in YAML.

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      description: Harness-owned liveness probe. Public.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: "ok"
                  service:
                    type: string
                    const: "Univents"

  /events:
    get:
      tags: [events]
      operationId: listPublicEvents
      summary: List public events
      description: |
        Lists publicly visible events (active events with published
        editions). Public.
      security: []
      responses:
        '200':
          description: Public events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [events]
      operationId: createEvent
      summary: Create an event
      description: |
        Creates an event owned by the authenticated actor. The creator
        becomes the event owner. New events start in `draft` status.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              full_name: TrieOH Developers Conference
              acronym: TDC
              slug: trieoh-dev-conf
              description: A yearly gathering of TrieOH developers.
              contact_email: events@trieoh.com
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_slug}:by-slug:
    get:
      tags: [events]
      operationId: getEventBySlug
      summary: Get an event by slug
      description: |
        AIP custom method (`:verb` suffix per AIP-136). Fetches a single
        event by its slug. Public.
      security: []
      parameters:
        - name: event_slug
          in: path
          required: true
          description: Event slug.
          schema:
            type: string
      responses:
        '200':
          description: The requested event
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/owned:
    get:
      tags: [events]
      operationId: listOwnedEvents
      summary: List events you own
      description: |
        Lists the events owned by the authenticated actor.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Events owned by the actor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/joined:
    get:
      tags: [events]
      operationId: listJoinedEvents
      summary: List events you are a member of
      description: |
        Lists the events the authenticated actor is a member of (any
        role: owner, admin, or staff).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Events the actor belongs to
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}:
    patch:
      tags: [events]
      operationId: patchEvent
      summary: Update an event
      description: |
        Updates event details. The actor must be an owner or admin of the
        event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/payments/connect:
    post:
      tags: [events]
      operationId: connectEventPayments
      summary: Connect a Payssage seller to the event
      description: |
        Ensures the event's Payssage wallet exists (created lazily under the
        platform identity, with the 5% marketplace fee) and starts the
        provider OAuth flow for a seller on that wallet. Returns the provider
        consent URL to send the user to, plus the event's wallet id. The
        actor must be an owner or admin of the event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectEventPaymentsRequest'
      responses:
        '200':
          description: Provider consent URL and event wallet
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConnectEventPaymentsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/payments/complete:
    post:
      tags: [events]
      operationId: completeEventPayments
      summary: Persist the connected seller on the event
      description: |
        Persists the seller and provider public key delivered by the OAuth
        callback (seller_id is payssage's credential_id) on the event, after
        verifying the seller belongs to the event's wallet. The actor must be
        an owner or admin of the event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteEventPaymentsRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/payments:
    delete:
      tags: [events]
      operationId: disconnectEventPayments
      summary: Disconnect the event's seller (unlink only)
      description: |
        Clears the seller and provider public key from the event. The wallet
        is kept — it is the event's permanent payment container — and can be
        reconnected later. The actor must be an owner or admin of the event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '204':
          description: Seller unlinked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/publish:
    post:
      tags: [events]
      operationId: publishEvent
      summary: Publish an event
      description: |
        Moves the event from `draft` to `active`. Requires an owner or
        admin role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '204':
          description: Event published
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/discontinue:
    post:
      tags: [events]
      operationId: discontinueEvent
      summary: Discontinue an event
      description: |
        Discontinues an active event (status becomes `discontinued`).
        Requires an owner or admin role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '204':
          description: Event discontinued
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/members:
    get:
      tags: [events]
      operationId: listEventMembers
      summary: List event members
      description: |
        Lists the members of an event with their roles. Requires an
        owner, admin, or staff role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Event members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [events]
      operationId: addEventMember
      summary: Add an event member
      description: |
        Adds an actor (by email) to the event with the given role. The
        authenticated actor must be an owner or admin.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEventMemberRequest'
            example:
              email: user@example.com
              role: staff
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/members/{user_id}:
    delete:
      tags: [events]
      operationId: removeEventMember
      summary: Remove an event member
      description: |
        Removes a member from the event by email. The authenticated actor
        must be an owner or admin. NOTE: the `user_id` path parameter is
        part of the interface but the member to remove is identified by
        the request body email.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
        - name: user_id
          in: path
          required: true
          description: User (actor) ID of the member to remove.
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  x-go-type: string
                  x-oapi-codegen-extra-tags:
                    validate: "required,email"
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_slug}:by-slug/editions/{edition_slug}:by-slug:
    get:
      tags: [editions]
      operationId: getEditionBySlug
      summary: Get an edition by event slug and edition slug
      description: |
        AIP custom method (`:verb` suffix per AIP-136). Fetches a single
        edition by its slug nested under its event's slug. Public.
      security: []
      parameters:
        - name: event_slug
          in: path
          required: true
          description: Event slug.
          schema:
            type: string
        - name: edition_slug
          in: path
          required: true
          description: Edition slug.
          schema:
            type: string
      responses:
        '200':
          description: The requested edition
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Edition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/editions:
    get:
      tags: [editions]
      operationId: listPublicEditions
      summary: List an event's public editions
      description: |
        Lists the published (non-draft) editions of an event. Public.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Public editions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Edition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [editions]
      operationId: createEdition
      summary: Create an edition
      description: |
        Creates a draft edition (run) of the event. The actor must be an
        owner or admin of the event. Draft editions are invisible to
        public listing until published.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEditionRequest'
            example:
              name: TrieOH Dev Conf 2026
              slug: "2026"
              starts_at: '2026-05-04T09:00:00Z'
              ends_at: '2026-05-06T18:00:00Z'
      responses:
        '201':
          description: Edition created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Edition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/editions/active:
    get:
      tags: [editions]
      operationId: getActiveEdition
      summary: Get the event's active edition
      description: |
        Fetches the currently running (or next upcoming) published
        edition of the event. Public.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: The active edition
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Edition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/editions/past:
    get:
      tags: [editions]
      operationId: listPastEditions
      summary: List the event's past editions
      description: |
        Lists the published editions that already ended. Public.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Past editions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Edition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/editions/upcoming:
    get:
      tags: [editions]
      operationId: listUpcomingEditions
      summary: List the event's upcoming editions
      description: |
        Lists the published editions that have not started yet. Public.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Upcoming editions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Edition'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/editions/draft:
    get:
      tags: [editions]
      operationId: listDraftEditions
      summary: List the event's draft editions
      description: |
        Lists the unpublished (draft) editions of an event. The actor
        must be an owner or admin of the event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventID'
      responses:
        '200':
          description: Draft editions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Edition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{event_id}/editions/{edition_id}:
    patch:
      tags: [editions]
      operationId: patchEdition
      summary: Update an edition
      description: |
        Updates edition details (dates, location, branding). The actor
        must be an owner or admin of the event.
      security:
        - bearerAuth: []
      parameters:
