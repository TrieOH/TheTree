        status: 409
        title: Pending Purchase Exists
        description: "This person already has a pending purchase for this edition."
    TicketUnitInPurchase:
      x-problem:
        slug: ticket-unit-in-purchase
        status: 409
        title: Ticket Unit In Purchase
        description: "This ticket is already in this purchase for this person."
    ProductLineInPurchase:
      x-problem:
        slug: product-line-in-purchase
        status: 409
        title: Product Line In Purchase
        description: "This product is already in this purchase."
    ProgramLineInPurchase:
