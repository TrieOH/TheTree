# This Backend's own problems (ADR-0019); the shared ones are in
# api/problems.yml, which documents the shape. tools/problemgen generates
# them into internal/problems and bundles them into api-spec.gen.yml.
components:
  schemas:
    # request shapes
    InvalidRequest:
      x-problem:
        slug: invalid-request
        status: 400
        title: Invalid Request
        description: "Invalid request."
    InvalidDesignData:
      x-problem:
        slug: invalid-design-data
        status: 400
        title: Invalid Design Data
        description: "Invalid design_data."
    InvalidGalleryURLs:
      x-problem:
        slug: invalid-gallery-urls
        status: 400
        title: Invalid Gallery URLs
        description: "Invalid gallery_urls."

    # events, editions, templates, payments
    EventNotDraft:
      x-problem:
        slug: event-not-draft
        status: 400
        title: Event Not Draft
        description: "Cannot publish non draft event."
    EventNotActive:
      x-problem:
        slug: event-not-active
        status: 400
        title: Event Not Active
        description: "Cannot discontinue non active event."
    EditionAlreadyPublished:
      x-problem:
        slug: edition-already-published
        status: 400
        title: Edition Already Published
        description: "Edition is already published."
    InvalidBadgeOrigin:
      x-problem:
        slug: invalid-badge-origin
        status: 400
        title: Invalid Badge Origin
        description: "Origin must be null or \"staff\"."
    StaffTemplateWithTicketType:
      x-problem:
        slug: staff-template-with-ticket-type
        status: 400
        title: Staff Template With Ticket Type
        description: "A staff badge template cannot target a ticket type."
    SellerNotInPlatformWallet:
      x-problem:
        slug: seller-not-in-platform-wallet
        status: 400
        title: Seller Not In Platform Wallet
        description: "Seller does not belong to the platform payssage wallet."
    InvalidPayssageWebhookSignature:
      x-problem:
        slug: invalid-payssage-webhook-signature
        status: 400
        title: Invalid Payssage Webhook Signature
        description: "Invalid webhook signature."

    # checkout
    EditionNotPublished:
      x-problem:
        slug: edition-not-published
        status: 400
        title: Edition Not Published
        description: "Edition is not published."
    NoPaymentConfig:
      x-problem:
        slug: no-payment-config
        status: 400
        title: No Payment Config
        description: "Event has no payment config."
    NoItems:
      x-problem:
        slug: no-items
        status: 400
        title: No Items
        description: "Checkout requires at least one item."
    QuantityBelowOne:
      x-problem:
        slug: quantity-below-one
        status: 400
        title: Quantity Below One
        description: "Item quantity must be at least 1."
    TicketQuantity:
      x-problem:
        slug: ticket-quantity
        status: 400
        title: Ticket Quantity
        description: "Ticket lines are one per person (quantity must be 1)."
    TicketNeedsAttendee:
      x-problem:
        slug: ticket-needs-attendee
        status: 400
        title: Ticket Needs Attendee
        description: "Ticket lines require an attendee."
    TicketNeedsAttendeeEmail:
      x-problem:
        slug: ticket-needs-attendee-email
        status: 400
        title: Ticket Needs Attendee Email
        description: "Ticket lines require an attendee email."
    OneTicketPerPerson:
      x-problem:
        slug: one-ticket-per-person
        status: 400
        title: One Ticket Per Person
        description: "Only one ticket per person."
    DuplicateProductLine:
      x-problem:
        slug: duplicate-product-line
        status: 400
        title: Duplicate Product Line
        description: "Duplicate product line."
    ProgramQuantity:
      x-problem:
        slug: program-quantity
        status: 400
        title: Program Quantity
        description: "Program lines are one session per purchase (quantity must be 1)."
    DuplicateProgramLine:
      x-problem:
        slug: duplicate-program-line
        status: 400
        title: Duplicate Program Line
        description: "Duplicate program line."
    InvalidItemType:
      x-problem:
        slug: invalid-item-type
        status: 400
        title: Invalid Item Type
        description: "Invalid item_type."
    ProgramNeedsTicket:
      x-problem:
        slug: program-needs-ticket
        status: 400
        title: Program Needs Ticket
        description: "Program items require a ticket item."
