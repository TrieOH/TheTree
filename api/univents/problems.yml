      x-problem:
        slug: program-needs-ticket-in-cart
        status: 400
        title: Program Needs Ticket In Cart
        description: "Program items require a ticket item in the same cart."
    AttendeeEmailUnknown:
      x-problem:
        slug: attendee-email-unknown
        status: 400
        title: Attendee Email Unknown
        description: "Attendee email does not match an account."
    AttendeeUserMismatch:
      x-problem:
        slug: attendee-user-mismatch
        status: 400
        title: Attendee User Mismatch
        description: "Attendee user_id does not match the email."
    CardTokenRequired:
      x-problem:
        slug: card-token-required
        status: 400
        title: Card Token Required
        description: "Card_token is required for card payments."
    PaymentMethodIDRequired:
      x-problem:
        slug: payment-method-id-required
        status: 400
        title: Payment Method ID Required
        description: "Payment_method_id is required for card payments."
    InstallmentsBelowOne:
      x-problem:
        slug: installments-below-one
        status: 400
        title: Installments Below One
        description: "Installments must be at least 1."
    InvalidPaymentMethod:
      x-problem:
        slug: invalid-payment-method
        status: 400
        title: Invalid Payment Method
        description: "Invalid payment_method."
    UnknownItem:
      x-problem:
        slug: unknown-item
        status: 400
        title: Unknown Item
        description: "Unknown item."
    ItemNotInEdition:
      x-problem:
        slug: item-not-in-edition
        status: 400
        title: Item Not In Edition
        description: "Item does not belong to this edition."
    PersonHasTicket:
      x-problem:
        slug: person-has-ticket
        status: 409
        title: Person Has Ticket
        description: "This person already has a ticket for this edition."
    ItemsUnavailable:
      x-problem:
        slug: items-unavailable
        status: 409
        title: Items Unavailable
        description: "Some items are no longer available."
    PaymentRejected:
      x-problem:
        slug: payment-rejected
        status: 400
        title: Payment Rejected
        description: "The payment provider refused the payment."
      type: object
      required: [message]
      properties:
        message: { type: string, description: "The provider's reason." }

    # refunds
    AlreadyRefunded:
      x-problem:
        slug: already-refunded
        status: 409
        title: Already Refunded
        description: "Purchase already refunded."
    FreeOrderRefund:
      x-problem:
        slug: free-order-refund
        status: 400
        title: Free Order Refund
        description: "Purchase has no payment intent (free order) and cannot be refunded."
    PurchaseStatus:
      x-problem:
        slug: purchase-status
        status: 409
        title: Purchase Status
        description: "The purchase's status does not allow a refund."
      type: object
      required: [purchase_status]
      properties:
        purchase_status: { type: string, description: "The purchase's current status." }

    # programs
    TicketRequiredForActivity:
      x-problem:
        slug: ticket-required-for-activity
        status: 403
        title: Ticket Required For Activity
        description: "A confirmed ticket is required to register for activities."
    TicketRequiredForCheckpoint:
      x-problem:
        slug: ticket-required-for-checkpoint
        status: 403
        title: Ticket Required For Checkpoint
        description: "A confirmed ticket is required to pass this checkpoint."
    AccessLevel:
      x-problem:
        slug: access-level
        status: 403
        title: Access Level
        description: "The caller's ticket level does not grant access."
      type: object
      required: [kind]
      properties:
        kind: { type: string, description: "What was refused: activity or checkpoint." }
