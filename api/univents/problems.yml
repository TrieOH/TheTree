    VariantCodeTaken:
      x-problem:
        slug: variant-code-taken
        status: 409
        title: Variant Code Taken
        description: "A product variant with this vendor code already exists in this edition."
    OccurrenceRegistrationTaken:
      x-problem:
        slug: occurrence-registration-taken
        status: 409
        title: Occurrence Registration Taken
        description: "This person is already registered for this activity occurrence."
    IdempotencyKeyUsed:
      x-problem:
        slug: idempotency-key-used
        status: 409
        title: Idempotency Key Used
        description: "This idempotency key has already been used."
    BadgeEmitted:
      x-problem:
        slug: badge-emitted
