      x-problem:
        slug: already-registered
        status: 409
        title: Already Registered
        description: "You are already registered for this activity."
    OccurrenceFull:
      x-problem:
        slug: occurrence-full
        status: 409
        title: Occurrence Full
        description: "This activity occurrence is full."
    NotRegistered:
      x-problem:
        slug: not-registered
        status: 404
        title: Not Registered
        description: "You are not registered for this activity."
    RegistrationLocked:
      x-problem:
        slug: registration-locked
        status: 409
        title: Registration Locked
        description: "Registration is locked: attendance has been marked."
    CheckInNotCheckpoint:
      x-problem:
        slug: check-in-not-checkpoint
        status: 400
        title: Check In Not Checkpoint
        description: "Check-in is only for checkpoint occurrences."
    ParticipationCancelled:
      x-problem:
        slug: participation-cancelled
        status: 409
        title: Participation Cancelled
        description: "Cannot mark attendance: participation was cancelled."

    # signatures
    InvalidSignatureToken:
      x-problem:
        slug: invalid-signature-token
        status: 403
        title: Invalid Signature Token
        description: "Invalid or expired token."
    SignatureRequestNotPending:
      x-problem:
        slug: signature-request-not-pending
        status: 409
        title: Signature Request Not Pending
        description: "Signature request is no longer pending."
    TokenRequestEditionMismatch:
      x-problem:
        slug: token-request-edition-mismatch
        status: 403
        title: Token Request Edition Mismatch
        description: "Token does not match request edition."
    TokenSignatureEditionMismatch:
      x-problem:
        slug: token-signature-edition-mismatch
        status: 403
        title: Token Signature Edition Mismatch
        description: "Token does not match signature edition."
    SignatureRequestHandled:
      x-problem:
        slug: signature-request-handled
        status: 404
        title: Signature Request Handled
        description: "Signature request not found or already handled."
    SignatureRequestCompleted:
      x-problem:
        slug: signature-request-completed
        status: 404
        title: Signature Request Completed
        description: "Signature request not found or already completed."

    # not found

    # constraints
    EditionOverlap:
      x-problem:
        slug: edition-overlap
        status: 409
        title: Edition Overlap
        description: "This edition's dates overlap with another edition of the same event."
    TicketHeld:
      x-problem:
        slug: ticket-held
        status: 409
        title: Ticket Held
        description: "This person already has a ticket for this edition."
    ProductCodeTaken:
      x-problem:
        slug: product-code-taken
        status: 409
