# The checkouts feature's operations, and the components and problems only
# they use. api-spec.yml imports the paths; tools/problemgen bundles
# everything into api-spec.gen.yml.
paths:
  /editions/{edition_id}/checkout:
    post:
      tags: [checkouts]
      operationId: createEditionCheckout
      summary: Check out an edition cart (reserve + create payment intent)
      description: |
        The money path (issue #61, split 7): reserves the requested items
        and creates the Payssage payment intent in one request. Prices are
        always server-computed from the DB (never trusted from the client).
        `purchase_items` is the availability ledger: the item rows are
        locked `FOR UPDATE` inside the checkout transaction before
        availability is checked, so two concurrent checkouts cannot oversell
        the last unit (the loser gets 409 listing the unavailable items).

        Flow: one transaction materializes the pending purchase (`purchases`
        + `purchase_items` + `registrations` / `product_purchases` /
        `program_participations`) and schedules the expiry job
        (`purchases.expire`, +10:01); the Payssage intent is created after
        commit; the intent id is stored back on the purchase in a second
        transaction. Only the Payssage webhook confirms payment (D3) —
        checkout never self-approves. Cards charge synchronously: the
        intent comes back `succeeded` but the purchase stays `pending`
        until the webhook confirms. Pix returns the QR (`qr_code` /
        `qr_code_base64`) in the response.

        Free orders (`total_cents == 0`) confirm immediately — no intent,
        no expiry job: the purchase is `approved` and materialized rows are
        created confirmed (badge emitted).

        Gifting: ticket lines are one-per-person (`quantity: 1`, one
        `attendee` each) — self-purchase sends the purchaser's own
        user_id/email/name; a gifted ticket sends the recipient's. The server
        resolves every ticket attendee's email against IdentityX: an attendee
        without `user_id` is tied to the account when one exists (or stays
        email-only — no account yet); an attendee with both id and email is
        verified to be the same user (mismatch → 400). Buying N tickets for
        the same ticket type sends N lines. One active ticket per person per
        edition is enforced — the same attendee cannot appear twice in the
        cart (400), and any attendee who already holds a pending/confirmed
        registration for the edition is rejected (409); cancelled/expired
        registrations free the slot. Program lines require ≥1 ticket line in
        the same cart (a participation attaches to the ticket's
        registration); program quantity is fixed at 1.

        One active `pending` purchase per user+edition is enforced by a
        partial unique index — a second checkout returns 409 with the
        existing purchase's id (client-key idempotency is a follow-up).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../../api-spec.yml#/components/parameters/EditionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutRequest'
            example:
              payment_method: pix
              payer:
                email: buyer@example.com
                identification_type: CPF
                identification_number: '12345678900'
              items:
                - item_type: ticket
                  item_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  quantity: 1
                  attendee:
                    user_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    email: buyer@example.com
                    name: Jane Doe
                - item_type: ticket
                  item_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  quantity: 1
                  attendee:
                    user_id: 4fa85f64-5717-4562-b3fc-2c963f66afa6
                    email: friend@example.com
                    name: John Doe
                - item_type: product
                  item_id: 5fa85f64-5717-4562-b3fc-2c963f66afa6
                  quantity: 2
      x-problems: [400, 401, 404, 409, 500]
      responses:
        '201':
          description: Purchase created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'

  /checkouts/{purchase_id}:
    get:
      tags: [checkouts]
      operationId: getCheckout
      summary: Resume a purchase
      description: |
        The buyer's single source of truth for a purchase (issue #61: "fonte
        da verdade: tabela de purchases"): reads `purchases` + `purchase_items`
        and, when the purchase is still `pending` and carries a Payssage
        intent, the intent's current status — so a resume surfaces
        `intent.updated` without polling. Owner-only: the caller must be the
        purchase's `purchaser_id`; anything else is 404 (no existence leak).
        Strictly a read — the webhook receiver and the expiry worker own all
        status changes.
      security:
        - bearerAuth: []
      parameters:
        - name: purchase_id
          in: path
          required: true
          description: Purchase ID.
          schema:
            $ref: '../../../api-spec.yml#/components/schemas/UUID'
      x-problems: [401, 404, 500]
      responses:
        '200':
          description: Purchase state with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'

  /purchases/{purchase_id}/refund:
    post:
      tags: [checkouts]
      operationId: refundPurchase
      summary: Refund an approved purchase (organizer, full refund)
      description: |
        Initiates a full refund of an `approved` purchase. Event owner/admin
        only (non-members 404, staff 403). Calls Payssage's refund for the
        purchase's intent and returns the purchase — which stays `approved`
        until the `payment.refunded` webhook flips it to `refunded`
        (webhook-confirmed, single writer). Full refund only in v1 (no
        amount).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseID'
      x-problems: [400, 401, 403, 404, 409, 500]
      responses:
        '200':
          description: Refund initiated (purchase still approved until the webhook confirms)
          content:
            application/json:
              schema:
                $ref: '../../../api-spec.yml#/components/schemas/Purchase'

  /editions/{edition_id}/purchases:
    get:
      tags: [checkouts]
      operationId: listEditionPurchases
      summary: List an edition's purchases (organizer orders read)
      description: |
        Lists every purchase of an edition with its items and ticket
        attendees, newest first — the organizer orders page (refund plan
        B3). Event owner/admin only (non-members 404, staff 403).
        `payer_email` identifies who the payment provider will refund;
        attendees are the people the tickets were assigned to (gifted
        tickets show the recipient).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../../api-spec.yml#/components/parameters/EditionID'
      x-problems: [401, 403, 404, 500]
      responses:
        '200':
          description: The edition's purchases
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EditionPurchase'

  /editions/{edition_id}/my-ticket:
    get:
      tags: [checkouts]
      operationId: getEditionMyTicket
      summary: The caller's current ticket for an edition
      description: |
        The authenticated user's active ticket for the edition — their own
        registration (`attendee_user_id` = caller) in `pending` (reserved,
        unpaid) or `confirmed` (paid) state — with its ticket type, so the
        front can show upgrade options on the more expensive ticket types.
        `data` is `null` when the caller holds no ticket (normal flow: they
        buy fresh). Read-only; never transitions state. The upgrade itself
        is a follow-up — this is only the "what do I hold" read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../../api-spec.yml#/components/parameters/EditionID'
      x-problems: [401, 404, 500]
      responses:
        '200':
          description: The caller's ticket, or null when they hold none
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MyTicket'
                nullable: true

  /editions/{edition_id}/attendees/count:
    get:
      tags: [checkouts]
      operationId: getEditionAttendeeCount
      summary: The number of confirmed attendees of an edition
      description: |
        The storefront's "N people already registered" number: how many
        confirmed (paid) registrations the edition has. Pending
        reservations and cancelled/expired rows do not count. Public, like
        the edition browsing and store stock reads; unknown editions are
        NOT_FOUND.
      security: []
      parameters:
        - $ref: '../../../api-spec.yml#/components/parameters/EditionID'
      x-problems: [404, 500]
      responses:
        '200':
          description: The confirmed attendee count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeCount'

components:
  schemas:
    CheckoutPaymentMethod:
      type: string
      description: How the buyer intends to pay. `pix` has no tokenization; `credit_card`/`debit_card` carry a MercadoPago card token from the front's SDK tokenization.
      enum: [pix, credit_card, debit_card]

    CheckoutPayer:
      type: object
      description: Payer identity passed through to the provider (MercadoPago requires email + CPF/CNPJ identification).
      required: [email, identification_type, identification_number]
      properties:
        email:
          x-oapi-codegen-extra-tags:
            validate: "required,email"
          x-go-type: string
          type: string
          format: email
        identification_type:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
          description: e.g. CPF, CNPJ.
        identification_number:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string

    CheckoutAttendee:
      type: object
      description: |
        One person a ticket unit is assigned to — the purchaser themselves or
        a gifted recipient. `email` is always required; `user_id` is optional
        and, when present, must belong to the email (the server resolves the
        email against IdentityX and verifies the pair — a mismatch is 400).
        An attendee without a `user_id` is a gift to someone with no account
        yet: the server looks the email up and ties the actor id when the
        account exists, otherwise the ticket stays email-only until the
        recipient creates an account under that email.
      required: [email, name]
      properties:
        user_id:
          $ref: '../../../api-spec.yml#/components/schemas/NullableUUID'
        email:
          x-oapi-codegen-extra-tags:
            validate: "required,email"
          x-go-type: string
          type: string
          format: email
        name:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string

    CheckoutItem:
      type: object
      description: "One requested cart line. Ticket lines are one-per-person: `quantity` is fixed at 1 and `attendee` carries the assigned person (self or gifted). Product lines carry quantity and no attendee; program lines are quantity=1 (one session) with no attendee."
      required: [item_type, item_id, quantity]
      properties:
        item_type:
          $ref: '../../../api-spec.yml#/components/schemas/PurchaseItemType'
        item_id:
          $ref: '../../../api-spec.yml#/components/schemas/UUID'
        quantity:
          x-oapi-codegen-extra-tags:
            validate: "min=1"
          type: integer
          minimum: 1
          description: Product lines may exceed 1; ticket and program lines must be 1.
        attendee:
          allOf:
            - $ref: '#/components/schemas/CheckoutAttendee'
          description: Required on ticket lines (the person the ticket is assigned to).

    CreateCheckoutRequest:
      type: object
      description: |
        The cart + payment request (split 7). Prices are never trusted from
        the client — the server recomputes them from the DB. For cards,
        `payment_method_id` comes from the front's MercadoPago tokenization
        (visa/master/...); for pix the server derives `pix` (no
        tokenization). `card_token` is required for cards; `installments`
        defaults to 1 when omitted.
      required: [items]
      properties:
        payment_method:
          $ref: '#/components/schemas/CheckoutPaymentMethod'
        card_token:
          type: [ string, "null" ]
          description: MercadoPago card token from the front's SDK tokenization; required for cards.
        payment_method_id:
          type: [ string, "null" ]
          description: From the front's MP tokenization (cards only); pix is derived server-side.
        issuer_id:
          type: [ string, "null" ]
          description: MP issuing bank id from the front's card tokenization (cardForm); optional, cards only.
        installments:
          type: [ integer, "null" ]
          minimum: 1
          description: Card installments; defaults to 1 when omitted.
        payer:
          $ref: '#/components/schemas/CheckoutPayer'
        items:
          x-oapi-codegen-extra-tags:
            validate: "required,min=1"
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutItem'

    CheckoutResult:
      allOf:
        - $ref: '../../../api-spec.yml#/components/schemas/Purchase'
        - type: object
          description: |
            The createEditionCheckout response — the created purchase plus
            the one-time WS handshake token (split 6) so the front can open
            the socket immediately.
          required: [ws_token]
          properties:
            ws_token:
              type: string
              description: One-time WS handshake token; pass to `WS /ws?token=...`.
            ws_token_expires_at:
              type: string
              format: date-time
              description: When `ws_token` stops being valid.

    EditionPurchase:
      type: object
      description: |
        One purchase in the organizer orders read (refund plan B3): the
        shared purchase fields plus its items and the ticket attendees.
        `payer_email` identifies who the payment provider will refund;
        attendees are the people the tickets were assigned to.
      required: [purchase_id, edition_id, status, total_cents, currency, expires_at, items, attendees]
      properties:
        purchase_id:
          $ref: '../../../api-spec.yml#/components/schemas/UUID'
        edition_id:
          $ref: '../../../api-spec.yml#/components/schemas/UUID'
        status:
          $ref: '../../../api-spec.yml#/components/schemas/PurchaseStatus'
        status_reason:
          type: [ string, "null" ]
        total_cents:
          type: integer
          format: int64
        currency:
          type: string
        payment_method:
          type: [ string, "null" ]
        payer_email:
          type: [ string, "null" ]
        payssage_intent_id:
          $ref: '../../../api-spec.yml#/components/schemas/NullableUUID'
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '../../../api-spec.yml#/components/schemas/PurchaseItem'
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseAttendee'

    PurchaseAttendee:
      type: object
      description: One person a ticket line was assigned to (from the registration).
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string

    Checkout:
      allOf:
        - $ref: '../../../api-spec.yml#/components/schemas/Purchase'
        - type: object
          description: The getCheckout resume payload — the purchase plus the intent's current status when it is pending (surfaces `intent.updated` on resume).
          properties:
            intent_status:
              type: [ string, "null" ]
              description: |
                The Payssage intent's current status (pending/processing/
                succeeded/cancelled/rejected/failed/refunded). Present only
                when the purchase is pending and has an intent; best-effort —
                omitted when Payssage is unreachable.

    MyTicket:
      type: object
      description: The caller's held ticket for an edition (their own registration).
      required: [registration_id, ticket_type, status]
      properties:
        registration_id:
          $ref: '../../../api-spec.yml#/components/schemas/UUID'
        ticket_type:
          $ref: '../../../api-spec.yml#/components/schemas/TicketType'
        status:
          type: string
          enum: [pending, confirmed]
          description: |
            `pending` = reserved but unpaid; `confirmed` = paid (or a free
            order). Cancelled/expired registrations are never returned —
            those do not count as holding a ticket.

    AttendeeCount:
      type: object
      description: The number of confirmed attendees of an edition.
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          description: |
            Confirmed (paid) registrations of the edition; pending
            reservations and cancelled/expired rows are excluded.

    # checkout
    EditionNotPublished:
      x-problem:
        slug: edition-not-published
        status: 400
        title: Edition Not Published
        description: "Edition is not published."

    NoPaymentConfig:
      x-problem:
        slug: no-payment-config
        status: 400
        title: No Payment Config
        description: "Event has no payment config."

    NoItems:
      x-problem:
        slug: no-items
        status: 400
        title: No Items
        description: "Checkout requires at least one item."

    QuantityBelowOne:
      x-problem:
        slug: quantity-below-one
        status: 400
        title: Quantity Below One
        description: "Item quantity must be at least 1."

    TicketQuantity:
      x-problem:
        slug: ticket-quantity
        status: 400
        title: Ticket Quantity
        description: "Ticket lines are one per person (quantity must be 1)."

    TicketNeedsAttendee:
      x-problem:
        slug: ticket-needs-attendee
        status: 400
        title: Ticket Needs Attendee
        description: "Ticket lines require an attendee."

    TicketNeedsAttendeeEmail:
      x-problem:
        slug: ticket-needs-attendee-email
        status: 400
        title: Ticket Needs Attendee Email
        description: "Ticket lines require an attendee email."

    OneTicketPerPerson:
      x-problem:
        slug: one-ticket-per-person
        status: 400
        title: One Ticket Per Person
        description: "Only one ticket per person."

    DuplicateProductLine:
      x-problem:
        slug: duplicate-product-line
        status: 400
        title: Duplicate Product Line
        description: "Duplicate product line."

    ProgramQuantity:
      x-problem:
        slug: program-quantity
        status: 400
        title: Program Quantity
        description: "Program lines are one session per purchase (quantity must be 1)."

    DuplicateProgramLine:
      x-problem:
        slug: duplicate-program-line
        status: 400
        title: Duplicate Program Line
        description: "Duplicate program line."

    InvalidItemType:
      x-problem:
        slug: invalid-item-type
        status: 400
        title: Invalid Item Type
        description: "Invalid item_type."

    ProgramNeedsTicket:
      x-problem:
        slug: program-needs-ticket
        status: 400
        title: Program Needs Ticket
        description: "Program items require a ticket item."

    ProgramNeedsTicketInCart:
      x-problem:
        slug: program-needs-ticket-in-cart
        status: 400
        title: Program Needs Ticket In Cart
        description: "Program items require a ticket item in the same cart."

    AttendeeEmailUnknown:
      x-problem:
        slug: attendee-email-unknown
        status: 400
        title: Attendee Email Unknown
        description: "Attendee email does not match an account."

    AttendeeUserMismatch:
      x-problem:
        slug: attendee-user-mismatch
        status: 400
        title: Attendee User Mismatch
        description: "Attendee user_id does not match the email."

    CardTokenRequired:
      x-problem:
        slug: card-token-required
        status: 400
        title: Card Token Required
        description: "Card_token is required for card payments."

    PaymentMethodIDRequired:
      x-problem:
        slug: payment-method-id-required
        status: 400
        title: Payment Method ID Required
        description: "Payment_method_id is required for card payments."

    InstallmentsBelowOne:
      x-problem:
        slug: installments-below-one
        status: 400
        title: Installments Below One
        description: "Installments must be at least 1."

    InvalidPaymentMethod:
      x-problem:
        slug: invalid-payment-method
        status: 400
        title: Invalid Payment Method
        description: "Invalid payment_method."

    UnknownItem:
      x-problem:
        slug: unknown-item
        status: 400
        title: Unknown Item
        description: "Unknown item."

    ItemNotInEdition:
      x-problem:
        slug: item-not-in-edition
        status: 400
        title: Item Not In Edition
        description: "Item does not belong to this edition."

    PersonHasTicket:
      x-problem:
        slug: person-has-ticket
        status: 409
        title: Person Has Ticket
        description: "This person already has a ticket for this edition."

    ItemsUnavailable:
      x-problem:
        slug: items-unavailable
        status: 409
        title: Items Unavailable
        description: "Some items are no longer available."

    PaymentRejected:
      x-problem:
        slug: payment-rejected
        status: 400
        title: Payment Rejected
        description: "The payment provider refused the payment."
      type: object
      required: [message]
      properties:
        message: { type: string, description: "The provider's reason." }

    # refunds
    AlreadyRefunded:
      x-problem:
        slug: already-refunded
        status: 409
        title: Already Refunded
        description: "Purchase already refunded."

    FreeOrderRefund:
      x-problem:
        slug: free-order-refund
        status: 400
        title: Free Order Refund
        description: "Purchase has no payment intent (free order) and cannot be refunded."

    PurchaseStatus:
      x-problem:
        slug: purchase-status
        status: 409
        title: Purchase Status
        description: "The purchase's status does not allow a refund."
      type: object
      required: [purchase_status]
      properties:
        purchase_status: { type: string, description: "The purchase's current status." }

  parameters:
    PurchaseID:
      name: purchase_id
      in: path
      required: true
      description: Purchase ID.
      schema:
        $ref: '../../../api-spec.yml#/components/schemas/UUID'
