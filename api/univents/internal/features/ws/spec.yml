# The ws feature's operations, and the components and problems only
# they use. api-spec.yml imports the paths; tools/problemgen bundles
# everything into api-spec.gen.yml.
paths:
  /ws/token:
    get:
      tags: [realtime]
      operationId: getWsToken
      summary: Issue a one-time WebSocket handshake token
      description: |
        Owner-only: the caller must be the purchase's `purchaser_id`
        (anything else is 404 — no existence leak). Issues a fresh one-time
        token for the raw `WS /ws?token=...` socket: a 32-byte random value
        stored as its SHA-256 hash, valid 10 minutes, consumed by the first
        handshake. The token is a handshake-auth shim — it proves prior REST
        auth for this purchase and nothing more (no refresh dance, no
        scopes). Reconnect = fresh token: the front re-requests before the
        10-minute expiry and re-opens the socket.
      security:
        - bearerAuth: []
      parameters:
        - name: purchase_id
          in: query
          required: true
          description: Purchase to bind the token to.
          schema:
            $ref: '../../../api-spec.yml#/components/schemas/UUID'
      x-problems: [401, 404, 500]
      responses:
        '200':
          description: The one-time handshake token and its expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsToken'

components:
  schemas:
    WsToken:
      type: object
      description: |
        A one-time WebSocket handshake token for one purchase (split 6):
        the raw value is returned exactly once here and stored only as its
        SHA-256 hash, valid 10 minutes, consumed by the first
        `WS /ws?token=...` handshake. The front re-requests before
        `expires_at` when it needs to reconnect.
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: The one-time token — pass to `WS /ws?token=...`.
        expires_at:
          type: string
          format: date-time
          description: When the token stops being valid.
