# =============================================================
# compose.yml  (dev, entry point)
#
# Development environment. Builds images from local source,
# exposes ports directly (no Caddy TLS needed locally), adds
# Mailpit for email testing. Fully self-contained — no other
# compose files needed. Observability services stay behind
# --profile obs so lean runs skip them.
#
# Usage:
#   docker compose up --build
#   docker compose --profile obs up -d beszel grafana ...
#
# Or via just: just dev, just api <svc>, just obs
# =============================================================

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  rustfs_data:
  rustfs_logs:
  grafana_data:
  victoria_metrics_data:
  victoria_logs_data:
  victoria_traces_data:
  beszel_data:
  beszel_agent_data:
  beszel_socket:

services:

  # =============================================================
  # 🗄️ POSTGRES
  # =============================================================

  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .tree.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TheTree -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================
  # 🌐 CADDY (dev)
  # =============================================================

  caddy:
    image: caddy:latest
    container_name: caddy-dev
    restart: unless-stopped
    env_file:
      - .tree.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"        # API gateway
      - "8080:8080"    # identityx
      - "8081:8081"    # univents
      - "8082:8082"    # payssage
      - "8083:8083"    # informd
      - "8090:8090"    # beszel
      - "9000:9000"    # rustfs API
      - "9001:9001"    # rustfs console
      - "3000:3000"    # grafana
      - "8025:8025"    # mailpit
      - "8428:8428"    # victoria-metrics
      - "9428:9428"    # victoria-logs
      - "10428:10428"  # victoria-traces
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:2019/"]
      interval: 3s
      timeout: 5s
      retries: 5

  # =============================================================
  # 📂 RUSTFS (S3-compatible object storage)
  # =============================================================

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    env_file:
      - .tree.env
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health && wget -qO- http://localhost:9001/rustfs/console/health"]
      interval: 3s
      timeout: 5s
      retries: 5

  # =============================================================
  # 🔐 IDENTITY-X
  # =============================================================

  identityx:
    container_name: identityx
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/identityx/Dockerfile
    networks:
      - internal
    ports:
      - "6060:6060"
    depends_on:
      caddy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    env_file:
      - .tree.env
      - api/identityx/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 2s

  # =============================================================
  # 💳 PAYSSAGE
  # =============================================================

  payssage:
    container_name: payssage
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/payssage/Dockerfile
    networks:
      - internal
    ports:
      - "6061:6061"
    depends_on:
      caddy:
        condition: service_healthy
      identityx:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .tree.env
      - api/payssage/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 2s

  # =============================================================
  # 📢 INFORMD
  # =============================================================

  informd:
    container_name: informd
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/informd/Dockerfile
    networks:
      - internal
    ports:
      - "6062:6062"
    depends_on:
      caddy:
        condition: service_healthy
      identityx:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    env_file:
      - .tree.env
      - api/informd/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 2s

  # =============================================================
  # 🎟️ UNIVENTS
  # =============================================================

  univents:
    container_name: univents
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/univents/Dockerfile
    networks:
      - internal
    ports:
      - "6063:6063"
    depends_on:
      caddy:
        condition: service_healthy
      identityx:
        condition: service_healthy
      payssage:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    env_file:
      - .tree.env
      - api/univents/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 2s

  # =============================================================
  # 📧 MAILPIT
  # =============================================================

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/livez || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5

  # =============================================================
  # 📊 BESZEL (system monitoring)
  # =============================================================

  beszel:
    profiles: [obs]
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s

  beszel-agent:
    profiles: [obs]
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - infra/beszel/.env
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =============================================================
  # 📊 VICTORIA METRICS (metrics)
  # =============================================================

  victoria-metrics:
    profiles: [obs]
    image: victoriametrics/victoria-metrics:latest
    container_name: victoria-metrics
    restart: unless-stopped
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:8428
      - --promscrape.config=/etc/victoria-metrics/scrape.yml
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
      - ./infra/victoria-metrics/scrape.yml:/etc/victoria-metrics/scrape.yml:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================
  # 📝 VICTORIA LOGS (logs)
  # =============================================================

  victoria-logs:
    profiles: [obs]
    image: victoriametrics/victoria-logs:latest
    container_name: victoria-logs
    restart: unless-stopped
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:9428
    volumes:
      - victoria_logs_data:/victoria-logs-data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================
  # 🔍 VICTORIA TRACES (traces)
  # =============================================================

  victoria-traces:
    profiles: [obs]
    image: victoriametrics/victoria-traces:latest
    container_name: victoria-traces
    restart: unless-stopped
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:10428
    volumes:
      - victoria_traces_data:/victoria-traces-data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:10428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================
  # 📝 VECTOR (log collector)
  # =============================================================

  vector:
    profiles: [obs]
    image: timberio/vector:latest-alpine
    container_name: vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./infra/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    depends_on:
      - victoria-logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8686/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================
  # 📊 GRAFANA
  # =============================================================

  grafana:
    profiles: [obs]
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .tree.env
    environment:
      GF_INSTALL_PLUGINS: victoriametrics-metrics-datasource,victoriametrics-logs-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - internal
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s