services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TheTree -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    # Pinned 2026-08-18. NOTE: rustfs has no 1.0 stable; newest release is 1.0.0-rc.2.
    # (Conservative alt: 1.0.0-beta.12, what :latest currently points to.)
    image: rustfs/rustfs:1.0.0-rc.2
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health && wget -qO- http://localhost:9001/rustfs/console/health"]
      interval: 3s
      timeout: 5s
      retries: 5

  identityx:
    container_name: identityx
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/identityx/Dockerfile
    networks:
      - internal
      - obs-net
    ports:
      - "8080:8080"
      - "6060:6060"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - api/identityx/.env

  univents:
    container_name: univents
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/univents/Dockerfile
    networks:
      - internal
      - obs-net
    ports:
      - "8081:8080"
      - "6061:6061"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - api/univents/.env

  payssage:
    container_name: payssage
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/payssage/Dockerfile
    networks:
      - internal
      - obs-net
    ports:
      - "8082:8080"
      - "6062:6062"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - api/payssage/.env

  informd:
    container_name: informd
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/informd/Dockerfile
    networks:
      - internal
      - obs-net
    ports:
      - "8083:8080"
      - "6063:6063"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - api/informd/.env

  mailpit:
    # Pinned 2026-08-18 (latest stable).
    image: axllent/mailpit:v1.30.7
    container_name: mailpit
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/livez || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge
  obs-net:
    external: true

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
