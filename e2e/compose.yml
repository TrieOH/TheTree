# Isolated end-to-end stack. Started by `just e2e-up` as compose project
# `thetree-e2e`, so it never touches the dev stack's containers or volumes:
# its own ports (1xxxx), tmpfs Postgres (every `up` starts from an empty
# database) and no obs-net. Secrets are minted per run by the recipe.
name: thetree-e2e

services:
  identityx-db:
    image: postgres:18
    environment:
      POSTGRES_DB: identityx
      POSTGRES_USER: identityx
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?run through just e2e-up}
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identityx -d identityx"]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    # Same pin as the dev stack (compose.yml).
    image: axllent/mailpit:v1.30.7
    ports:
      - "18025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/livez || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15

  identityx:
    build:
      context: ..
      dockerfile: api/identityx/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:?run through just e2e-up}
    ports:
      - "18080:8080"
    depends_on:
      identityx-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      APP_NAME: IdentityX
      API_URL: http://localhost:18080
      # Links in verify/reset emails point at the e2e front.
      APP_URL: http://localhost:13001
      ISSUER: http://localhost:18080
      IDX_POSTGRES_HOST: identityx-db
      IDX_POSTGRES_PORT: "5432"
      IDX_POSTGRES_DB: identityx
      IDX_POSTGRES_USER: identityx
      IDX_POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD}
      IDX_POSTGRES_SSLMODE: disable
      IDX_POSTGRES_CHANNEL_BINDING: prefer
      IDX_POSTGRES_MAX_CONNS: "4"
      JOBS_URL: ""
      ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?run through just e2e-up}
      HMAC_SECRET: ${E2E_HMAC_SECRET:?run through just e2e-up}
      IDENTITY_X_KEY_LIFETIME: 168h
      ROTATE_KEYS_JOB_DURATION: 24h
      ACCESS_TOKEN_LIFETIME: 15m
      REFRESH_TOKEN_LIFETIME: 168h
      CORS_ALLOWED_ORIGINS: http://localhost:13001
      CORS_ALLOWED_HEADERS: Content-Type,X-Request-ID,Authorization,Refresh-Token,X-API-KEY
      # Every scenario logs in several times from one IP.
      DISABLE_RATE_LIMIT: "true"
      EMAIL_FROM: noreply@e2e.trieoh.test
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_STARTTLS: "false"
