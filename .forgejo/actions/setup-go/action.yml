name: Setup Go
description: >
  Go toolchain + workspace module/build cache. Run before setup-go-tools
  (which needs the go toolchain for `go install`). Self-reports the cache
  outcome as `[cache] setup-go: HIT|MISS key=...` so any run can be
  diagnosed from logs alone.
inputs:
  go-version:
    description: Go version (keep in sync with the Dockerfiles' golang image)
    required: false
    default: "1.26.4"
runs:
  using: composite
  steps:
    - name: Toolchain
      uses: https://github.com/actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false # built-in cache wants a root go.sum (warning); we cache explicitly below

    - name: Restore module cache
      id: cache
      uses: https://code.forgejo.org/actions/cache@v4
      with:
        # single path — keep it one dir; content fills during R0–R2, so the
        # combined action's post-save is the correct save moment
        path: ~/go/pkg/mod
        key: go-mod-${{ inputs.go-version }}-${{ hashFiles('go.work.sum', '**/go.mod', '**/go.sum') }}

    - name: Report
      shell: bash
      run: |
        KEY="go-mod-${{ inputs.go-version }}-${{ hashFiles('go.work.sum', '**/go.mod', '**/go.sum') }}"
        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "[cache] setup-go: HIT key=$KEY"
        else
          echo "[cache] setup-go: MISS key=$KEY → cold, will save at end of job"
        fi
        go version
