name: Setup Go tools
description: >
  Pinned Go-ecosystem tools into ~/.local/thetree-tools/bin (added to PATH):
  sqlc, oapi-codegen, golangci-lint, gotestsum — the same versions `just setup`
  installs on dev machines. Requires setup-go to run first (needs `go install`).
  Whole dir is cached as one unit: cache hit = zero network. Self-reports as
  `[cache] setup-go-tools: HIT|MISS key=...`.
inputs:
  sqlc-version:
    description: sqlc version (no leading v — matches the tarball name)
    required: false
    default: "1.31.1"
  oapi-codegen-version:
    description: oapi-codegen module version (with leading v)
    required: false
    default: "v2.8.0"
  golangci-lint-version:
    description: golangci-lint version (no leading v — tag gets v-prefix)
    required: false
    default: "2.12.2"
  gotestsum-version:
    description: gotestsum version (WITH leading v — go install needs it)
    required: false
    default: "v1.13.0"
runs:
  using: composite
  steps:
    - name: Compute cache key
      id: key
      shell: bash
      run: |
        echo "key=go-tools-${{ inputs.sqlc-version }}-${{ inputs.oapi-codegen-version }}-${{ inputs.golangci-lint-version }}-${{ inputs.gotestsum-version }}-linux-amd64" >> "$GITHUB_OUTPUT"

    - name: Restore tools
      id: cache
      uses: https://code.forgejo.org/actions/cache@v1
      with:
        path: ~/.local/thetree-tools
        key: ${{ steps.key.outputs.key }}

    - name: Install (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        DIR="$HOME/.local/thetree-tools"
        mkdir -p "$DIR/bin"
        # sqlc — tarball name uses underscores (matches old ci.yml recipe)
        curl -sSL "https://downloads.sqlc.dev/sqlc_${{ inputs.sqlc-version }}_linux_amd64.tar.gz" \
          | tar -xz -C "$DIR/bin" sqlc
        # golangci-lint — release tag gets the v-prefix, dirname doesn't
        GCL="${{ inputs.golangci-lint-version }}"
        curl -sSL "https://github.com/golangci/golangci-lint/releases/download/v${GCL}/golangci-lint-${GCL}-linux-amd64.tar.gz" \
          | tar -xz --strip-components=1 -C "$DIR/bin" "golangci-lint-${GCL}-linux-amd64/golangci-lint"
        # oapi-codegen + gotestsum — via go install (needs the go toolchain)
        GOBIN="$DIR/bin" go install "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${{ inputs.oapi-codegen-version }}"
        GOBIN="$DIR/bin" go install "gotest.tools/gotestsum@${{ inputs.gotestsum-version }}"

    - name: Add to PATH
      shell: bash
      run: echo "$HOME/.local/thetree-tools/bin" >> "$GITHUB_PATH"

    - name: Report + smoke test
      shell: bash
      run: |
        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "[cache] setup-go-tools: HIT key=${{ steps.key.outputs.key }}"
        else
          echo "[cache] setup-go-tools: MISS key=${{ steps.key.outputs.key }} → installed fresh, will save at end of job"
        fi
        sqlc version
        oapi-codegen --version
        golangci-lint version
        gotestsum --version
