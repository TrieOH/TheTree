name: Trivy Scan
on:
  pull_request:
    branches:
      - main
concurrency:
  group: trivy-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.filter.outputs.changes }}
      any: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://github.com/dorny/paths-filter@v3
        id: filter
        with:
          list-files: none
          filters: |
            front/identityx:
              - 'front/identityx/**'
            front/informd:
              - 'front/informd/**'
            front/payssage:
              - 'front/payssage/**'
            front/univents:
              - 'front/univents/**'
            api/identityx:
              - 'api/identityx/**'
              - 'lib/go/**'
            api/informd:
              - 'api/informd/**'
              - 'lib/go/**'
            api/payssage:
              - 'api/payssage/**'
              - 'lib/go/**'
            api/univents:
              - 'api/univents/**'
              - 'lib/go/**'
            lib/go:
              - 'lib/go/**'
            lib/ts:
              - 'lib/ts/**'
            sdk/go/IdentityX:
              - 'sdk/go/IdentityX/**'
            sdk/go/Payssage:
              - 'sdk/go/Payssage/**'
            sdk/ts/identityx:
              - 'sdk/ts/identityx/**'
            sdk/ts/identityx-access:
              - 'sdk/ts/identityx-access/**'
            sdk/ts/payssage:
              - 'sdk/ts/payssage/**'
            sdk/ts/Payssage:
              - 'sdk/ts/Payssage/**'
  trivy:
    name: trivy
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: build project list
        id: projects
        run: |
          # changes is a compact JSON array like ["api/identityx","lib/go"].
          # Convert to a comma list.
          list='${{ needs.detect-changes.outputs.projects }}'
          list="${list#[}"
          list="${list%]}"
          list="${list//\"/}"
          echo "list=${list}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker
        run: curl -fsSL https://get.docker.com | sh
      - uses: https://github.com/dagger/dagger-for-github@v6
        with:
          version: "v0.21.7"
          verb: call
          module: .dagger
          args: trivy --source=. --projects=${{ steps.projects.outputs.list }}
