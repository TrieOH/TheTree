name: Trivy Scan
on:
  pull_request:
    branches:
      - main
concurrency:
  group: trivy-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.filter.outputs.changes }}
      any: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://github.com/dorny/paths-filter@v3
        id: filter
        with:
          list-files: none
          filters: |
            front/identityx:
              - 'front/identityx/**'
            front/informd:
              - 'front/informd/**'
            front/payssage:
              - 'front/payssage/**'
            front/univents:
              - 'front/univents/**'
            api/identityx:
              - 'api/identityx/**'
              - 'lib/go/**'
            api/informd:
              - 'api/informd/**'
              - 'lib/go/**'
            api/payssage:
              - 'api/payssage/**'
              - 'lib/go/**'
            api/univents:
              - 'api/univents/**'
              - 'lib/go/**'
            lib/go:
              - 'lib/go/**'
            lib/ts:
              - 'lib/ts/**'
            sdk/go/IdentityX:
              - 'sdk/go/IdentityX/**'
            sdk/go/Payssage:
              - 'sdk/go/Payssage/**'
            sdk/ts/identityx:
              - 'sdk/ts/identityx/**'
            sdk/ts/identityx-access:
              - 'sdk/ts/identityx-access/**'
            sdk/ts/payssage:
              - 'sdk/ts/payssage/**'
            sdk/ts/Payssage:
              - 'sdk/ts/Payssage/**'
  prepare:
    name: prepare trivy
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIVY_VERSION: "0.71.2"
    steps:
      - run: |
          mkdir -p /tmp/trivybin
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivybin trivy
          chmod +x /tmp/trivybin/trivy
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: trivy-bin
          path: /tmp/trivybin
  trivy:
    name: trivy (${{ matrix.project }})
    needs: [detect-changes, prepare]
    if: ${{ needs.detect-changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect-changes.outputs.projects) }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: trivy-bin
          path: /tmp/trivybin
      - run: chmod +x /tmp/trivybin/trivy && echo "/tmp/trivybin" >> "$GITHUB_PATH"
      - name: cache trivy db
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-
      - name: trivy scan
        run: |
          trivy fs \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            --exit-code 1 \
            "${{ matrix.project }}"
  trivy-ok:
    name: Trivy OK
    needs: [detect-changes, trivy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ needs.detect-changes.outputs.any }}" == "true" ]; then
            [ "${{ needs.trivy.result }}" == "success" ] || exit 1
          fi