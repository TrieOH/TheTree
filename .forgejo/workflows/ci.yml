name: CI
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      identityx: ${{ steps.filter.outputs.identityx }}
      informd: ${{ steps.filter.outputs.informd }}
      payssage: ${{ steps.filter.outputs.payssage }}
      univents: ${{ steps.filter.outputs.univents }}
      any: ${{ steps.filter.outputs.identityx == 'true' || steps.filter.outputs.informd == 'true' || steps.filter.outputs.payssage == 'true' || steps.filter.outputs.univents == 'true' }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://github.com/dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identityx:
              - 'api/identityx/**'
              - 'lib/go/**'
            informd:
              - 'api/informd/**'
              - 'lib/go/**'
            payssage:
              - 'api/payssage/**'
              - 'lib/go/**'
            univents:
              - 'api/univents/**'
              - 'lib/go/**'

  prepare:
    name: prepare tools
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SQLC_VERSION: "1.31.1"
      GOTESTSUM_VERSION: "1.13.0"
    steps:
      - run: |
          mkdir -p /tmp/gobin
          curl -sSL "https://downloads.sqlc.dev/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/sqlc.tar.gz
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/gobin sqlc
          curl -sSL "https://github.com/gotestyourself/gotestsum/releases/download/v${GOTESTSUM_VERSION}/gotestsum_${GOTESTSUM_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/gotestsum.tar.gz
          tar -xzf /tmp/gotestsum.tar.gz -C /tmp/gobin gotestsum
          chmod +x /tmp/gobin/sqlc /tmp/gobin/gotestsum
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: ci-tools
          path: /tmp/gobin

  compile:
    needs: [changes, prepare]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: ${{ github.workspace }}/go.work
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: ci-tools
          path: /tmp/gobin
      - run: chmod +x /tmp/gobin/* && echo "/tmp/gobin" >> "$GITHUB_PATH"
      - name: sqlc identityx
        if: ${{ needs.changes.outputs.identityx == 'true' }}
        run: |
          if [ -f api/identityx/sqlc.yaml ]; then cd api/identityx && sqlc generate; fi
      - name: build identityx
        if: ${{ needs.changes.outputs.identityx == 'true' }}
        run: cd api/identityx && go build ./...
      - name: sqlc informd
        if: ${{ needs.changes.outputs.informd == 'true' }}
        run: |
          if [ -f api/informd/sqlc.yaml ]; then cd api/informd && sqlc generate; fi
      - name: build informd
        if: ${{ needs.changes.outputs.informd == 'true' }}
        run: cd api/informd && go build ./...
      - name: sqlc payssage
        if: ${{ needs.changes.outputs.payssage == 'true' }}
        run: |
          if [ -f api/payssage/sqlc.yaml ]; then cd api/payssage && sqlc generate; fi
      - name: build payssage
        if: ${{ needs.changes.outputs.payssage == 'true' }}
        run: cd api/payssage && go build ./...
      - name: sqlc univents
        if: ${{ needs.changes.outputs.univents == 'true' }}
        run: |
          if [ -f api/univents/sqlc.yaml ]; then cd api/univents && sqlc generate; fi
      - name: build univents
        if: ${{ needs.changes.outputs.univents == 'true' }}
        run: cd api/univents && go build ./...

  lint:
    needs: [changes, compile]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: ci-tools
          path: /tmp/gobin
      - run: chmod +x /tmp/gobin/* && echo "/tmp/gobin" >> "$GITHUB_PATH"
      - name: sqlc identityx
        if: ${{ needs.changes.outputs.identityx == 'true' }}
        run: |
          if [ -f api/identityx/sqlc.yaml ]; then cd api/identityx && sqlc generate; fi
      - name: lint identityx
        if: ${{ needs.changes.outputs.identityx == 'true' }}
        uses: https://github.com/golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: api/identityx
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: sqlc informd
        if: ${{ needs.changes.outputs.informd == 'true' }}
        run: |
          if [ -f api/informd/sqlc.yaml ]; then cd api/informd && sqlc generate; fi
      - name: lint informd
        if: ${{ needs.changes.outputs.informd == 'true' }}
        uses: https://github.com/golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: api/informd
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: sqlc payssage
        if: ${{ needs.changes.outputs.payssage == 'true' }}
        run: |
          if [ -f api/payssage/sqlc.yaml ]; then cd api/payssage && sqlc generate; fi
      - name: lint payssage
        if: ${{ needs.changes.outputs.payssage == 'true' }}
        uses: https://github.com/golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: api/payssage
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: sqlc univents
        if: ${{ needs.changes.outputs.univents == 'true' }}
        run: |
          if [ -f api/univents/sqlc.yaml ]; then cd api/univents && sqlc generate; fi
      - name: lint univents
        if: ${{ needs.changes.outputs.univents == 'true' }}
        uses: https://github.com/golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: api/univents
          args: --config=${{ github.workspace }}/.golangci.yml

  build:
    needs: [changes, compile]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: curl -fsSL https://get.docker.com | sh
      - uses: https://github.com/docker/setup-buildx-action@v3
      - name: build identityx
        if: ${{ needs.changes.outputs.identityx == 'true' }}
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: api/identityx/Dockerfile
          push: false
          cache-from: type=gha,scope=identityx
          cache-to: type=gha,mode=max,scope=identityx
      - name: build informd
        if: ${{ needs.changes.outputs.informd == 'true' }}
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: api/informd/Dockerfile
          push: false
          cache-from: type=gha,scope=informd
          cache-to: type=gha,mode=max,scope=informd
      - name: build payssage
        if: ${{ needs.changes.outputs.payssage == 'true' }}
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: api/payssage/Dockerfile
          push: false
          cache-from: type=gha,scope=payssage
          cache-to: type=gha,mode=max,scope=payssage
      - name: build univents
        if: ${{ needs.changes.outputs.univents == 'true' }}
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: api/univents/Dockerfile
          push: false
          cache-from: type=gha,scope=univents
          cache-to: type=gha,mode=max,scope=univents

  test:
    needs: [changes, build]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: ci-tools
          path: /tmp/gobin
      - run: chmod +x /tmp/gobin/* && echo "/tmp/gobin" >> "$GITHUB_PATH"
      - name: sqlc identityx
        if: ${{ needs.changes.outputs.identityx == 'true' }}
        run: |
          if [ -f api/identityx/sqlc.yaml ]; then cd api/identityx && sqlc generate; fi
      - name: test identityx
        if: ${{ needs.changes.outputs.identityx == 'true' }}
        run: cd api/identityx && gotestsum --format testdox --format-hide-empty-pkg ./...
      - name: sqlc informd
        if: ${{ needs.changes.outputs.informd == 'true' }}
        run: |
          if [ -f api/informd/sqlc.yaml ]; then cd api/informd && sqlc generate; fi
      - name: test informd
        if: ${{ needs.changes.outputs.informd == 'true' }}
        run: cd api/informd && gotestsum --format testdox --format-hide-empty-pkg ./...
      - name: sqlc payssage
        if: ${{ needs.changes.outputs.payssage == 'true' }}
        run: |
          if [ -f api/payssage/sqlc.yaml ]; then cd api/payssage && sqlc generate; fi
      - name: test payssage
        if: ${{ needs.changes.outputs.payssage == 'true' }}
        run: cd api/payssage && gotestsum --format testdox --format-hide-empty-pkg ./...
      - name: sqlc univents
        if: ${{ needs.changes.outputs.univents == 'true' }}
        run: |
          if [ -f api/univents/sqlc.yaml ]; then cd api/univents && sqlc generate; fi
      - name: test univents
        if: ${{ needs.changes.outputs.univents == 'true' }}
        run: cd api/univents && gotestsum --format testdox --format-hide-empty-pkg ./...

  ci-ok:
    name: CI OK
    needs: [changes, compile, lint, build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ needs.changes.outputs.any }}" == "true" ]; then
            [ "${{ needs.compile.result }}" == "success" ] || exit 1
            [ "${{ needs.lint.result }}" == "success" ] || exit 1
            [ "${{ needs.build.result }}" == "success" ] || exit 1
            [ "${{ needs.test.result }}" == "success" ] || exit 1
          fi