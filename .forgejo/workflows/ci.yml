name: CI
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      any: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://github.com/dorny/paths-filter@v3
        id: filter
        with:
          list-files: none
          filters: |
            identityx:
              - 'api/identityx/**'
              - 'lib/go/**'
            informd:
              - 'api/informd/**'
              - 'lib/go/**'
            payssage:
              - 'api/payssage/**'
              - 'lib/go/**'
            univents:
              - 'api/univents/**'
              - 'lib/go/**'

  prepare:
    name: prepare tools
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: |
          mkdir -p /tmp/gobin
          GOBIN=/tmp/gobin go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          GOBIN=/tmp/gobin go install gotest.tools/gotestsum@latest
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /tmp/gobin
      - uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: ci-tools
          path: /tmp/gobin

  compile:
    name: compile (${{ matrix.service }})
    needs: [changes, prepare]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: https://code.forgejo.org/actions/download-artifact@v4
        with:
          name: ci-tools
          path: /tmp/gobin
      - run: chmod +x /tmp/gobin/* && echo "/tmp/gobin" >> "$GITHUB_PATH"
      - run: |
          if [ -f api/${{ matrix.service }}/sqlc.yaml ]; then
            cd api/${{ matrix.service }} && sqlc generate
          fi
      - run: go build ./api/${{ matrix.service }}/...

  lint:
    name: lint (${{ matrix.service }})
    needs: [changes, compile]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: https://code.forgejo.org/actions/download-artifact@v4
        with:
          name: ci-tools
          path: /tmp/gobin
      - run: chmod +x /tmp/gobin/* && echo "/tmp/gobin" >> "$GITHUB_PATH"
      - run: |
          if [ -f api/${{ matrix.service }}/sqlc.yaml ]; then
            cd api/${{ matrix.service }} && sqlc generate
          fi
      - run: golangci-lint run ./api/${{ matrix.service }}/...

  build:
    name: build (${{ matrix.service }})
    needs: [changes, compile]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: curl -fsSL https://get.docker.com | sh
      - uses: https://github.com/docker/setup-buildx-action@v3
      - uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: api/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  test:
    name: test (${{ matrix.service }})
    needs: [changes, build]
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: https://code.forgejo.org/actions/download-artifact@v4
        with:
          name: ci-tools
          path: /tmp/gobin
      - run: chmod +x /tmp/gobin/* && echo "/tmp/gobin" >> "$GITHUB_PATH"
      - run: |
          if [ -f api/${{ matrix.service }}/sqlc.yaml ]; then
            cd api/${{ matrix.service }} && sqlc generate
          fi
      - run: cd api/${{ matrix.service }} && gotestsum --format testdox --format-icons hivis --format-hide-empty-pkg ./...

  ci-ok:
    name: CI OK
    needs: [changes, compile, lint, build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ needs.changes.outputs.any }}" == "true" ]; then
            [ "${{ needs.compile.result }}" == "success" ] || exit 1
            [ "${{ needs.lint.result }}" == "success" ] || exit 1
            [ "${{ needs.build.result }}" == "success" ] || exit 1
            [ "${{ needs.test.result }}" == "success" ] || exit 1
          fi