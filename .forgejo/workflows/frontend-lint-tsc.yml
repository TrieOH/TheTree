name: Frontend Lint & TypeScript

on:
  pull_request:
    branches:
      - main
    paths:
      - 'front/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      identityx: ${{ steps.filter.outputs.identityx }}
      informd: ${{ steps.filter.outputs.informd }}
      payssage: ${{ steps.filter.outputs.payssage }}
      univents: ${{ steps.filter.outputs.univents }}
      any: ${{ steps.filter.outputs.identityx == 'true' || steps.filter.outputs.informd == 'true' || steps.filter.outputs.payssage == 'true' || steps.filter.outputs.univents == 'true' }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7

      - uses: https://github.com/dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            identityx:
              - 'front/identityx/**'
            informd:
              - 'front/informd/**'
            payssage:
              - 'front/payssage/**'
            univents:
              - 'front/univents/**'

  lint-tsc:
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7

      - name: Build service list
        id: services
        run: |
          list=""
          [ "${{ needs.changes.outputs.identityx }}" == "true" ] && list="$list,identityx"
          [ "${{ needs.changes.outputs.informd }}" == "true" ] && list="$list,informd"
          [ "${{ needs.changes.outputs.payssage }}" == "true" ] && list="$list,payssage"
          [ "${{ needs.changes.outputs.univents }}" == "true" ] && list="$list,univents"
          echo "list=${list#,}" >> "$GITHUB_OUTPUT"

      - uses: https://github.com/dagger/dagger-for-github@v6
        with:
          verb: call
          module: .dagger
          args: frontend-lint-tsc --source=. --services=${{ steps.services.outputs.list }}
