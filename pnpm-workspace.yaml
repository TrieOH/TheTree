packages:
  - 'front/*'
  - 'lib/ts/*'
  - 'sdk/ts/*'

catalog:
  # === @trieoh ===
  '@trieoh/identityx-sdk-ts': ^0.15.0
  '@trieoh/identityx-access-sdk-ts': ^0.1.6
  '@trieoh/envoy-fetch-ts': ^0.1.5
  '@hookform/resolvers': ^5.4.0
  tsup: ^8.5.1

  # === Core UI ===
  react: ^19.2.0
  react-dom: ^19.2.0
  '@types/react': ^19.2.5
  '@types/react-dom': ^19.2.3
  '@types/node': ^24.10.1

  # === TanStack ===
  '@tanstack/react-router': ^1.170.16
  '@tanstack/react-start': ^1.168.26
  '@tanstack/react-query': ^5.101.4
  '@tanstack/router-plugin': ^1.168.18
  '@tanstack/react-router-ssr-query': ^1.167.1
  '@tanstack/react-devtools': ^0.7.0
  '@tanstack/react-query-devtools': ^5.84.2
  '@tanstack/react-router-devtools': ^1.132.0
  '@tanstack/devtools-event-client': ^0.4.0
  '@tanstack/devtools-vite': latest
  '@tanstack/eslint-config': latest

  # === Styles ===
  tailwindcss: ^4.3.0
  '@tailwindcss/vite': ^4.0.6
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0

  # === Animations & Icons ===
  motion: ^12.40.0
  lucide-react: ^1.18.0

  # === Validation ===
  zod: ^4.4.3
  react-hook-form: ^7.78.0

  # === Build / Tooling ===
  typescript: ^7.0.2
  vite: ^8.0.16
  '@vitejs/plugin-react': ^6.0.2
  '@cloudflare/vite-plugin': ^1.39.2
  wrangler: ^4.97.0
  '@biomejs/biome': 2.2.4
  '@rolldown/plugin-babel': ^0.2.3

  # === Misc ===
  sonner: ^2.0.7
  posthog-js: ^1.335.2
  next-themes: ^0.4.6
  # tw-animate-css: ^1.4.0
  '@t3-oss/env-core': ^0.13.11
  '@base-ui/react': ^1.6.0

overrides:
  dompurify: ">=3.4.12"
  esbuild: ">=0.28.1"
  "@opentelemetry/core": ">=2.8.0"
  "@tanstack/query-core": "5.101.4"
  "@tanstack/router-core": "1.171.15"
  postcss: ">=8.5.23"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@trieoh/identityx-sdk-ts'
  - '@trieoh/identityx-access-sdk-ts'
  - 'shiki'
  - '@shikijs/*'
blockExoticSubdeps: true
trustPolicy: check-and-allow-fixes
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - '@cloudflare/workerd-linux-64'
  - workerd
  - core-js
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
allowBuilds:
  canvas: true
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
